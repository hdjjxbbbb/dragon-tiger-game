<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 熊猫发币工具 | Solana Token2022</title>
    <!-- Solana SDK CDN -->
    <script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@0.4.9/dist/index.iife.js"></script>
    <script src="https://unpkg.com/@metaplex-foundation/js@0.20.0/dist/index.iife.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0E1117;
            color: #e5e7eb;
            font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans‑serif;
            padding: 40px 16px;
        }
        .wrap {
            max-width: 540px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            text-align: left;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 24px 0 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #b0b8c4;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            background: #181c25;
            border: 1px solid #2c323f;
            border-radius: 8px;
            padding: 12px 14px;
            color: #fff;
            font-size: 15px;
        }
        input:focus,textarea:focus {
            outline: none;
            border-color: #6366f1;
        }
        textarea {
            min-height:80px;
            resize:vertical;
        }
        /* 图片上传区域 */
        .upload-box {
            border:1px dashed #373f4e;
            border-radius:8px;
            padding:20px;
            text-align:center;
            cursor:pointer;
            color:#9ca3af;
        }
        .upload-box:hover{
            border-color:#6366f1;
        }
        #logoPreview{
            max-width:120px;
            max-height:120px;
            margin:10px auto;
            display:none;
            border-radius:8px;
        }
        input[type="file"]{
            display:none;
        }
        /* 高级选项 复选框 */
        .check-item{
            display:flex;
            gap:10px;
            align-items:flex-start;
            margin-bottom:14px;
        }
        .check-item input{
            width:auto;
            margin-top:3px;
        }
        .check-desc{
            font-size:13px;
            color:#94a3b8;
            line-height:1.5;
        }
        /* 创建按钮 */
        .create-btn{
            width:100%;
            background: #6366f1;
            color:#fff;
            border:none;
            border-radius:8px;
            padding:14px;
            font-size:16px;
            font-weight:600;
            margin-top:20px;
            cursor:pointer;
        }
        .create-btn:disabled{
            opacity:0.4;
            cursor:not-allowed;
        }
        .fee-tip{
            text-align:center;
            margin-top:8px;
            font-size:13px;
            color:#a1a1aa;
        }
        .result-panel{
            margin-top:20px;
            background:#181c25;
            padding:14px;
            border-radius:8px;
            display:none;
            word-break:break-all;
            font-size:13px;
        }
        .wallet-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
        }
        .wallet-btn{
            background:#272c36;
            border:1px solid #373f4e;
            color:#fff;
            padding:8px 14px;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="wallet-bar">
        <div></div>
        <button class="wallet-btn" id="connectWallet">连接钱包</button>
    </div>

    <h1>🐼 熊猫发币工具</h1>

    <div class="section-title">1 代币参数</div>

    <div class="form-group">
        <label>Token 名称</label>
        <input type="text" id="tokenName" placeholder="输入代币名称">
    </div>

    <div class="form-group">
        <label>Token 符号</label>
        <input type="text" id="tokenSymbol" placeholder="例如 BTC">
    </div>

    <div class="form-group">
        <label>精度</label>
        <input type="number" id="decimals" value="9" placeholder="一般填9">
    </div>

    <div class="form-group">
        <label>供应量</label>
        <input type="number" id="totalSupply" placeholder="总供应量">
    </div>

    <div class="form-group">
        <label>Token Logo（可选）<br><span style="font-size:12px;color:#777">建议 250×250px · PNG/JPG/GIF/WEBP</span></label>
        <div class="upload-box" id="uploadTrigger">
            <p>点击上传图片</p>
            <img id="logoPreview" alt="logo预览"/>
        </div>
        <input type="file" id="logoFileInput" accept="image/png,image/jpg,image/gif,image/webp">
    </div>

    <div class="form-group">
        <label>描述（可选）</label>
        <textarea id="tokenDesc" placeholder="代币描述"></textarea>
    </div>


    <div class="section-title">2 高级选项</div>

    <div class="check-item">
        <input type="checkbox" id="revokeMetadata">
        <div>
            <div>放弃元数据修改权</div>
            <div class="check-desc">放弃后将无法修改代币名称、符号、图标等元数据，让投资者更放心</div>
        </div>
    </div>

    <div class="check-item">
        <input type="checkbox" id="revokeMint">
        <div>
            <div>放弃铸币权</div>
            <div class="check-desc">放弃后将无法增发，代币总供应量永久固定</div>
        </div>
    </div>

    <div class="check-item">
        <input type="checkbox" id="revokeFreeze">
        <div>
            <div>放弃冻结权</div>
            <div class="check-desc">放弃后将无法冻结任何账户的转账功能</div>
        </div>
    </div>


    <button class="create-btn" id="createTokenBtn" disabled>✦ 创建代币</button>
    <div class="fee-tip">每次创建收取 <b>0.025 SOL</b> 手续费</div>

    <div class="result-panel" id="resultPanel">
        <div>Mint地址：<span id="outMint"></span></div>
        <div style="margin-top:6px">交易哈希：<span id="outTx"></span></div>
    </div>
</div>

<script>
const {Connection,clusterApiUrl,LAMPORTS_PER_SOL}=solanaWeb3;
const {createMint,getOrCreateAssociatedTokenAccount,mintTo,setAuthority,AuthorityType}=solanaSplToken;

// RPC配置
const connection=new Connection(clusterApiUrl("mainnet-beta"),"confirmed");

// DOM
const connectWallet=document.getElementById("connectWallet");
const createTokenBtn=document.getElementById("createTokenBtn");
const uploadTrigger=document.getElementById("uploadTrigger");
const logoFileInput=document.getElementById("logoFileInput");
const logoPreview=document.getElementById("logoPreview");

const tokenName=document.getElementById("tokenName");
const tokenSymbol=document.getElementById("tokenSymbol");
const decimals=document.getElementById("decimals");
const totalSupply=document.getElementById("totalSupply");
const tokenDesc=document.getElementById("tokenDesc");

const revokeMetadata=document.getElementById("revokeMetadata");
const revokeMint=document.getElementById("revokeMint");
const revokeFreeze=document.getElementById("revokeFreeze");

const resultPanel=document.getElementById("resultPanel");
const outMint=document.getElementById("outMint");
const outTx=document.getElementById("outTx");

let walletProvider=null;
let userPublicKey=null;
let selectedFile=null;

//图片上传UI逻辑
uploadTrigger.onclick=()=>logoFileInput.click();
logoFileInput.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    selectedFile=file;
    const reader=new FileReader();
    reader.onload=ev=>{
        logoPreview.src=ev.target.result;
        logoPreview.style.display="block";
    }
    reader.readAsDataURL(file);
};

//连接钱包
connectWallet.onclick=async ()=>{
    try{
        const provider=window.solana;
        if(!provider){
            alert("请安装 Phantom / OKX Solana钱包");
            return;
        }
        await provider.connect();
        walletProvider=provider;
        userPublicKey=provider.publicKey;
        connectWallet.innerText=userPublicKey.toBase58().slice(0,10)+"...";
        createTokenBtn.disabled=false;
    }catch(err){
        console.error(err);
    }
};

//创建代币按钮
createTokenBtn.onclick=async ()=>{
    if(!walletProvider||!userPublicKey){
        alert("请先连接钱包");
        return;
    }
    const name=tokenName.value.trim();
    const symbol=tokenSymbol.value.trim();
    const dec=parseInt(decimals.value);
    const supplyVal=totalSupply.value.trim();
    if(!name||!symbol||!supplyVal||isNaN(dec)){
        alert("请填写完整代币参数");
        return;
    }

    createTokenBtn.disabled=true;
    createTokenBtn.innerText="签名中，请等待...";

    try{
        // --- 1 创建Token2022 Mint
        const mintKp=solanaWeb3.Keypair.generate();
        const mintPub=mintKp.publicKey;
        const createMintIx=await createMint(
            connection,
            mintKp,
            userPublicKey,
            revokeFreeze.checked?null:userPublicKey,
            dec
        );
        //ATA账户
        const ata=await getOrCreateAssociatedTokenAccount(connection,mintKp,mintPub,userPublicKey);
        const supplyBig=BigInt(supplyVal)*(10n**BigInt(dec));
        const mintIx=mintTo(mintPub,ata.address,userPublicKey,supplyBig);

        //组装交易
        const tx=new solanaWeb3.Transaction();
        tx.add(createMintIx,mintIx);

        // 高级选项：关闭权限指令
        const ixList=[];
        if(revokeMint.checked){
            ixList.push(setAuthority(
                mintPub,
                userPublicKey,
                null,
                AuthorityType.MintTokens,
                userPublicKey
            ))
        }
        if(revokeFreeze.checked){
            ixList.push(setAuthority(
                mintPub,
                userPublicKey,
                null,
                AuthorityType.FreezeAccount,
                userPublicKey
            ))
        }
        tx.add(...ixList);

        tx.feePayer=userPublicKey;
        const bh=await connection.getLatestBlockhash();
        tx.recentBlockhash=bh.blockhash;
        tx.sign(mintKp);

        //发送交易
        const {signature}=await walletProvider.signAndSendTransaction(tx);

        //元数据提示：本demo没有IPFS上传，实际项目需要上传图片到IPFS，调用Metaplex createMetadataAccountV3
        alert("代币Mint创建成功！\n注意：图片、名称符号链上元数据需要上传IPFS后调用Metaplex接口");

        outMint.innerText=mintPub.toBase58();
        outTx.innerText=signature;
        resultPanel.style.display="block";

        createTokenBtn.innerText="✦ 创建代币";
        createTokenBtn.disabled=false;

    }catch(err){
        console.error(err);
        alert("失败："+err.message);
        createTokenBtn.innerText="✦ 创建代币";
        createTokenBtn.disabled=false;
    }
};
</script>
</body>
</html>
