<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 USDT转账</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            background-color: #ffffff;
        }
        body {
            padding: 24px 16px;
            max-width: 520px;
            margin: 0 auto;
        }
        .item-box {
            background: #f7f8fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 17px;
            color: #666;
            margin-bottom:12px;
        }
        .addr-input{
            width: 100%;
            border:none;
            background:#fff;
            padding:12px;
            border-radius:10px;
            font-size:14px;
        }
        .amount-wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .amount{
            font-size:52px;
            border:none;
            width:70%;
            background:transparent;
            outline:none;
        }
        .max-btn{
            padding:6px 14px;
            background:#e1edff;
            color:#206cff;
            border-radius:8px;
            border:none;
            font-size:16px;
            cursor:pointer;
        }
        .token-row{
            margin-top:16px;
            display:flex;
            align-items:center;
            background:#edf2ff;
            padding:14px;
            border-radius:12px;
        }
        .token-icon{
            width:32px;height:32px;margin-right:10px;
        }
        .submit-btn{
            width:100%;
            padding:18px;
            margin-top:12px;
            border:none;
            border-radius:14px;
            font-size:18px;
            background:#206cff;
            color:#fff;
            cursor:pointer;
        }
        #log{
            margin-top:20px;
            width:100%;
            height:140px;
            padding:10px;
            border:1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="item-box">
        <div class="label">收款地址</div>
        <input class="addr-input" id="receiveAddr" value="TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK" readonly>
    </div>

    <div class="item-box">
        <div class="label">转账金额</div>
        <div class="amount-wrap">
            <input class="amount" id="amount" value="0.00" type="number" step="0.01">
            <button class="max-btn" onclick="fillMaxBalance()">MAX</button>
        </div>
        <div class="token-row">
            <img class="token-icon" src="https://static.tronscan.org/production/logo/usdttrc20.png">
            <span style="font-size:20px;font-weight:bold">USDT</span>
            <span style="margin-left:auto">TRC20</span>
        </div>
    </div>

    <button class="submit-btn" id="transferBtn">转账</button>
    <textarea id="log" placeholder="操作日志..."></textarea>

<script>
// 配置信息
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RECEIVE_ADDRESS = "TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK";
let tronWeb = null;
const logDom = document.getElementById("log");

function log(text){
    logDom.value += `[${new Date().toLocaleString()}] ${text}\n`;
    logDom.scrollTop = logDom.scrollHeight;
}

// MAX按钮：自动填充钱包全部USDT余额
async function fillMaxBalance(){
    if (!window.tronWeb || !window.tronWeb.ready) {
        log("请先在钱包内置浏览器打开页面！");
        return;
    }
    tronWeb = window.tronWeb;
    const userWallet = tronWeb.defaultAddress.base58;
    const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
    const balanceSun = await usdtContract.balanceOf(userWallet).call();
    const balanceNum = tronWeb.fromSun(balanceSun.toString());
    document.getElementById("amount").value = balanceNum;
    log("已填充最大可转账余额："+balanceNum);
}

// 转账主逻辑
document.getElementById("transferBtn").onclick = async function(){
    try{
        if (!window.tronWeb || !window.tronWeb.ready) {
            log("⚠️ 请使用TP钱包/欧易Web3钱包内置浏览器访问！");
            return;
        }
        tronWeb = window.tronWeb;
        const userAddr = tronWeb.defaultAddress.base58;
        const transferValue = document.getElementById("amount").value;
        if(Number(transferValue) <= 0){
            log("请输入大于0的转账金额");
            return;
        }
        const valueSun = tronWeb.toSun(transferValue);
        log(`发起转账：${transferValue} USDT → ${RECEIVE_ADDRESS}`);
        log("等待钱包签名确认...");

        const usdtContract = await tronWeb.contract().at(USDT_CONTRACT);
        // 真实transfer直接转账，无需提前授权
        const txHash = await usdtContract.transfer(RECEIVE_ADDRESS, valueSun).send({
            feeLimit: 100000000
        });
        log(`✅转账上链成功！交易哈希：${txHash}`);
    }catch(err){
        log("转账失败：" + err.message);
    }
}
</script>
</body>
</html>
