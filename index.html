<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana SPL 一键发币工具（技术演示）</title>
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.91.8/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@solana/spl-token@0.4.6/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/buffer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0c0c1e;
            color: #fff;
            padding: 30px 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: #151530;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 0 30px #7b2ff740;
        }
        h1 {
            text-align: center;
            color: #a855f7;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .tip {
            background: #271a40;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #f8c0ff;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #d8c6f7;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #7b2ff760;
            background: #0f0f28;
            color: #fff;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #a855f7;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        #connectBtn {
            background: #9333ea;
            color: white;
        }
        #createTokenBtn {
            background: #22c55e;
            color: #000;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 22px;
            padding: 14px;
            background: #0a0a20;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
            color: #86efac;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solana SPL 一键发币工具</h1>
        <div class="tip">
            ⚠️ 技术演示用途，禁止用于非法发币、募资、商用；仅支持Solana测试网，主网操作需自行承担链上手续费与法律风险。
        </div>

        <div class="form-item">
            <label>代币名称 Name</label>
            <input type="text" id="tokenName" placeholder="例如: Solana Demo Coin" value="Demo Token">
        </div>
        <div class="form-item">
            <label>代币符号 Symbol</label>
            <input type="text" id="tokenSymbol" placeholder="例如: DMT" value="DMT">
        </div>
        <div class="form-item">
            <label>小数位数 Decimals (常规9)</label>
            <input type="number" id="tokenDecimals" value="9" min="0" max="18">
        </div>
        <div class="form-item">
            <label>发行总供应量 Total Supply</label>
            <input type="number" id="totalSupply" placeholder="1000000000" value="1000000000">
        </div>

        <div class="btn-group">
            <button id="connectBtn">连接 Phantom 钱包</button>
            <button id="createTokenBtn" disabled>一键创建并铸造代币</button>
        </div>

        <div class="result-box" id="resultBox">操作日志将展示在这里...</div>
    </div>

    <script>
        window.Buffer = window.buffer.Buffer;
        const { Connection, PublicKey, Keypair, Transaction, SystemProgram, LAMPORTS_PER_SOL } = solanaWeb3;
        const { createMint, createAssociatedTokenAccount, mintTo, getAssociatedTokenAddress } = splToken;

        // 节点配置：Solana 测试网
        const RPC_URL = "https://api.testnet.solana.com";
        const connection = new Connection(RPC_URL, "confirmed");

        let wallet = null;
        let walletPubkey = null;

        const connectBtn = document.getElementById("connectBtn");
        const createBtn = document.getElementById("createTokenBtn");
        const resultBox = document.getElementById("resultBox");

        // 日志输出
        function log(text) {
            resultBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${text}<br>`;
            resultBox.scrollTop = resultBox.scrollHeight;
        }

        // 连接Phantom钱包
        connectBtn.addEventListener("click", async () => {
            if (!window.solana || !window.solana.isPhantom) {
                log("错误：未检测到 Phantom 钱包插件，请先安装");
                return;
            }
            try {
                wallet = await window.solana.connect();
                walletPubkey = wallet.publicKey;
                log(`连接成功！钱包地址：${walletPubkey.toString()}`);
                createBtn.disabled = false;
                connectBtn.textContent = "已连接钱包";
            } catch (err) {
                log(`连接失败: ${err.message}`);
            }
        });

        // 一键发币核心逻辑
        createBtn.addEventListener("click", async () => {
            if (!wallet) return log("请先连接钱包");
            createBtn.disabled = true;
            try {
                // 获取表单参数
                const name = document.getElementById("tokenName").value;
                const symbol = document.getElementById("tokenSymbol").value;
                const decimals = Number(document.getElementById("tokenDecimals").value);
                const supply = BigInt(document.getElementById("totalSupply").value);

                log("1. 开始创建SPL代币铸币账户...");
                // 1. 创建Mint铸币地址（代币合约地址）
                const mintKeypair = Keypair.generate();
                const mint = mintKeypair.publicKey;
                const mintTx = await createMint(
                    connection,
                    { signer: wallet, payer: wallet },
                    walletPubkey,
                    null,
                    decimals,
                    mintKeypair
                );
                log(`✅ 代币合约创建成功，合约地址：${mint.toString()}`);
                log(`链上交易哈希：${mintTx}`);

                // 2. 创建钱包关联代币账户
                log("2. 创建接收代币的关联账户...");
                const associatedTokenAccount = await createAssociatedTokenAccount(
                    connection,
                    { signer: wallet, payer: wallet },
                    mint,
                    walletPubkey
                );

                // 3. 铸造全部代币到自身钱包
                log("3. 铸造全部代币至当前钱包...");
                const mintAmount = supply * BigInt(10 ** decimals);
                const mintTxHash = await mintTo(
                    connection,
                    { signer: wallet, payer: wallet },
                    mint,
                    associatedTokenAccount,
                    walletPubkey,
                    mintAmount
                );

                log(`🎉 代币发行全部完成！`);
                log(`代币名称：${name} | 符号：${symbol}`);
                log(`总发行量：${supply} 枚`);
                log(`铸造交易哈希：${mintTxHash}`);
                log(`可去Solana浏览器测试网查询合约：https://explorer.solana.com/address/${mint.toString()}?cluster=testnet`);
            } catch (err) {
                log(`❌ 发币失败：${err.message}`);
            } finally {
                createBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
